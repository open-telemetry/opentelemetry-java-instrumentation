name: Auto-update OpenTelemetry SDK

on:
  schedule:
    # hourly at minute 46
    - cron: "46 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-otel-sdk:
    strategy:
      fail-fast: false
      matrix:
        target-branch:
          - main
          - maintenance/v2.x
    uses: $/.github/workflows/reusable-update-otel-sdk.yml
    with:
      target-branch: ${{ matrix.target-branch }}
    secrets:
      OTELBOT_JAVA_INSTRUMENTATION_PRIVATE_KEY: ${{ secrets.OTELBOT_JAVA_INSTRUMENTATION_PRIVATE_KEY }}

  workflow-notification:
    permissions:
      issues: write
    needs:
      - update-otel-sdk
    if: always()
    uses: open-telemetry/shared-workflows/.github/workflows/workflow-failure-issue.yml@f73c28e3be66444181acb54f07ada23f144c0c39 # v0.25.0
    with:
      success: ${{ needs.update-otel-sdk.result == 'success' }}
