name: Auto-update OpenTelemetry SDK

on:
  schedule:
    # hourly at minute 46
    - cron: "46 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-otel-sdk:
    strategy:
      fail-fast: false
      matrix:
        target-branch:
          - main
          - maintenance/v2.x
    uses: ./.github/workflows/reusable-update-otel-sdk.yml
    with:
      target-branch: ${{ matrix.target-branch }}
    secrets:
      OTELBOT_JAVA_INSTRUMENTATION_PRIVATE_KEY: ${{ secrets.OTELBOT_JAVA_INSTRUMENTATION_PRIVATE_KEY }}

  workflow-notification:
    permissions:
      issues: write
    needs:
      - update-otel-sdk
    if: always()
    uses: open-telemetry/shared-workflows/.github/workflows/workflow-failure-issue.yml@efc55838c9769c5476e0a5cf7183a8c5b4ae70a5 # v0.24.0
    with:
      success: ${{ needs.update-otel-sdk.result == 'success' }}
