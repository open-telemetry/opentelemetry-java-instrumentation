name: Draft release notes

on:
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: draft-release-notes-${{ github.ref }}

jobs:
  draft:
    if: github.repository == 'open-telemetry/opentelemetry-java-instrumentation'
    runs-on: ubuntu-24.04
    environment: protected
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # need full history and tags so the release-notes script can resolve
          # the previous release tag (e.g. v2.27.0) when computing the commit range
          fetch-depth: 0
          persist-credentials: false

      - name: Verify development branch
        run: python .github/scripts/release-config.py prepare --ref "$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Install Copilot CLI
        run: |
          npm ci --prefix .github/scripts/copilot-cli
          echo "$GITHUB_WORKSPACE/.github/scripts/copilot-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Use CLA approved bot
        run: .github/scripts/use-cla-approved-bot.sh

      - name: Run draft-release-notes
        env:
          CLASSIFY_MODEL: ${{ vars.DRAFT_RELEASE_NOTES_MODEL || 'gpt-6-luna' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/draft-release-notes/draft-release-notes.py

      - name: Upload draft diagnostics artifact
        if: always()
        id: upload-diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: draft-release-notes-diagnostics-${{ github.run_id }}
          path: build/changelog-bundle/**

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: otelbot-token
        with:
          client-id: ${{ vars.OTELBOT_JAVA_INSTRUMENTATION_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_JAVA_INSTRUMENTATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create pull request against the development branch
        env:
          ARTIFACT_URL: ${{ steps.upload-diagnostics.outputs.artifact-url }}
          # pull requests from secrets.GITHUB_TOKEN do not run workflows
          GH_TOKEN: ${{ steps.otelbot-token.outputs.token }}
        run: |
          message="Draft release notes"
          body=$(cat <<EOF
          Automated draft of the \`## Unreleased\` section of \`CHANGELOG.md\`.

          The entire \`## Unreleased\` block was regenerated from per-PR classifications. Existing entries are intentionally replaced so the generated draft can be reviewed against them.

          [Download draft diagnostics]($ARTIFACT_URL)
          EOF
          )
          branch="otelbot/draft-release-notes-${GITHUB_RUN_ID}"

          gh auth setup-git
          git checkout -b $branch
          git add CHANGELOG.md
          git commit -m "$message"
          git push --set-upstream origin $branch
          gh pr create \
            --title "$message" \
            --body "$body" \
            --base "$DEVELOPMENT_BRANCH"
