name: Probe bare-metal runner

on:
  push:
    branches:
      - trask-java-agent-startup-benchmarks
    paths:
      - .github/workflows/probe-bare-metal-runner.yml

permissions: {}

jobs:
  probe:
    runs-on: oracle-bare-metal-64cpu-1024gb-x86-64-ubuntu-24
    timeout-minutes: 5
    steps:
      - name: Check host and Docker
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        shell: bash
        run: |
          test "$(uname -m)" = x86_64
          uname -a
          cat /etc/os-release
          lscpu
          free -h
          docker info --format 'Server={{.ServerVersion}} OS={{.OSType}} Architecture={{.Architecture}} CPUs={{.NCPU}}'
