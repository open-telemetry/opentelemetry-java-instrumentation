name: Agent startup benchmark

on:
  push:
    branches:
      - trask-java-agent-startup-benchmarks

permissions:
  contents: read

concurrency:
  group: agent-startup-benchmark
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            ref: dba159d210f124447cc9994b29ae64df772d247b
          - variant: candidate
            ref: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build exact agent
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
        run: ./gradlew :javaagent:shadowJar -PremoveJarVersionNumbers=true "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" --max-workers=2

      - name: Record source and artifact identity
        run: |
          git rev-parse HEAD > javaagent/build/libs/revision.txt
          sha256sum javaagent/build/libs/opentelemetry-javaagent.jar > javaagent/build/libs/sha256.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: startup-${{ matrix.variant }}
          path: |
            javaagent/build/libs/opentelemetry-javaagent.jar
            javaagent/build/libs/revision.txt
            javaagent/build/libs/sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Package standalone benchmark
        if: matrix.variant == 'candidate'
        run: tar -czf startup-harness.tar.gz benchmark-overhead .java-version buildscripts/spotless.license.java

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.variant == 'candidate'
        with:
          name: startup-harness
          path: startup-harness.tar.gz
          if-no-files-found: error
          retention-days: 30

  benchmark:
    needs: build
    runs-on: oracle-bare-metal-64cpu-1024gb-x86-64-ubuntu-24
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: startup-*
          path: ${{ runner.temp }}/startup-agents

      - name: Unpack standalone benchmark in temporary directory
        env:
          HARNESS: ${{ runner.temp }}/startup-agents/startup-harness
        run: tar -xzf "$HARNESS/startup-harness.tar.gz" -C "$HARNESS"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: ${{ runner.temp }}/startup-agents/startup-harness/.java-version

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Prepare harness and validate report logic
        working-directory: ${{ runner.temp }}/startup-agents/startup-harness/benchmark-overhead
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: ./gradlew test --tests 'io.opentelemetry.startup.*Test'

      - name: Measure startup and collect separate profiles
        working-directory: ${{ runner.temp }}/startup-agents/startup-harness/benchmark-overhead
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          AGENTS: ${{ runner.temp }}/startup-agents
        run: |
          mkdir -p build/reports/agent-startup
          uname -a > build/reports/agent-startup/host.txt
          lscpu >> build/reports/agent-startup/host.txt
          docker info >> build/reports/agent-startup/host.txt
          printf '%s\n' "$GITHUB_SHA" > build/reports/agent-startup/harness-revision.txt
          mkdir -p build/reports/agent-startup/artifact-identities/{baseline,candidate}
          cp "$AGENTS/startup-baseline/"*.txt build/reports/agent-startup/artifact-identities/baseline/
          cp "$AGENTS/startup-candidate/"*.txt build/reports/agent-startup/artifact-identities/candidate/
          ./gradlew agentStartupBenchmark \
            "-PstartupBenchmarkBaseline=$AGENTS/startup-baseline/opentelemetry-javaagent.jar" \
            "-PstartupBenchmarkCandidate=$AGENTS/startup-candidate/opentelemetry-javaagent.jar"

      - name: Publish summary
        working-directory: ${{ runner.temp }}/startup-agents/startup-harness/benchmark-overhead
        run: cat build/reports/agent-startup/*/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-startup-results
          path: |
            ${{ runner.temp }}/startup-agents/startup-harness/benchmark-overhead/build/reports/agent-startup
            ${{ runner.temp }}/startup-agents/startup-harness/benchmark-overhead/build/reports/tests
          if-no-files-found: error
          retention-days: 30
