name: Agent startup benchmark

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline same-repository branch or full commit SHA
        required: true
        default: main
        type: string
      candidate:
        description: Candidate same-repository branch or full commit SHA
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: agent-startup-benchmark
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'open-telemetry/opentelemetry-java-instrumentation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      baseline: ${{ steps.resolve.outputs.baseline }}
      candidate: ${{ steps.resolve.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve revisions on repository branches
        id: resolve
        env:
          BASELINE: ${{ inputs.baseline }}
          CANDIDATE: ${{ inputs.candidate }}
        shell: bash
        run: |
          set -euo pipefail
          for variant in baseline candidate; do
            if [[ "$variant" == baseline ]]; then ref="$BASELINE"; else ref="$CANDIDATE"; fi
            if [[ "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
              sha=$(git rev-parse --verify --end-of-options "$ref^{commit}")
            else
              git check-ref-format "refs/heads/$ref"
              sha=$(git rev-parse --verify --end-of-options "refs/remotes/origin/$ref^{commit}")
            fi
            # Exclude pull refs and commits reachable only through a fork.
            branches=$(git for-each-ref --contains="$sha" --format='%(refname)' refs/remotes/origin/)
            test -n "$branches"
            printf '%s=%s\n' "$variant" "$sha" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Validate and package common standalone benchmark
        working-directory: benchmark-overhead
        run: ./gradlew test --tests 'io.opentelemetry.startup.*Test' startupRecorderJar

      - name: Package trusted harness, not candidate sources
        run: |
          git rev-parse HEAD > harness-revision.txt
          tar --exclude=benchmark-overhead/build --exclude=benchmark-overhead/.gradle \
            -czf startup-harness.tar.gz benchmark-overhead .java-version buildscripts/spotless.license.java harness-revision.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: startup-harness
          path: startup-harness.tar.gz
          if-no-files-found: error
          retention-days: 30

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            ref: ${{ needs.prepare.outputs.baseline }}
          - variant: candidate
            ref: ${{ needs.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build exact agent
        run: ./gradlew :javaagent:shadowJar -PremoveJarVersionNumbers=true "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" --max-workers=2

      - name: Record source and artifact identity
        run: |
          git rev-parse HEAD > javaagent/build/libs/revision.txt
          cd javaagent/build/libs
          sha256sum opentelemetry-javaagent.jar > sha256.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: startup-${{ matrix.variant }}
          path: |
            javaagent/build/libs/opentelemetry-javaagent.jar
            javaagent/build/libs/revision.txt
            javaagent/build/libs/sha256.txt
          if-no-files-found: error
          retention-days: 30

  benchmark:
    needs: [prepare, build]
    permissions: {}
    runs-on: oracle-bare-metal-64cpu-1024gb-x86-64-ubuntu-24
    timeout-minutes: 45
    steps:
      - name: Isolate this attempt under runner temporary storage
        working-directory: ${{ runner.temp }}
        run: |
          root="$RUNNER_TEMP/agent-startup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'AGENTS=%s\nGRADLE_USER_HOME=%s/gradle-home\n' "$root" "$root" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: startup-*
          path: ${{ env.AGENTS }}

      - name: Unpack standalone benchmark in temporary directory
        env:
          HARNESS: ${{ env.AGENTS }}/startup-harness
        run: tar -xzf "$HARNESS/startup-harness.tar.gz" -C "$HARNESS"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: ${{ env.AGENTS }}/startup-harness/.java-version

      - name: Prepare harness and validate report logic
        working-directory: ${{ env.AGENTS }}/startup-harness/benchmark-overhead
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          (cd "$AGENTS/startup-baseline" && sha256sum --check sha256.txt)
          (cd "$AGENTS/startup-candidate" && sha256sum --check sha256.txt)
          ./gradlew --no-daemon test --tests 'io.opentelemetry.startup.*Test' startupRecorderJar

      - name: Verify pinned CPUs are distinct cores on the same NUMA node
        shell: python
        run: |
          import subprocess
          rows = subprocess.check_output(
              ["lscpu", "-p=CPU,CORE,SOCKET,NODE"], text=True
          ).splitlines()
          cpus = dict((row.split(",")[0], row.split(",")[1:])
                      for row in rows if not row.startswith("#"))
          assert cpus["0"][:2] != cpus["1"][:2], "CPUs 0,1 must be distinct cores"
          assert cpus["0"][2] == cpus["1"][2] and cpus["0"][2].isdigit(), "CPUs 0,1 must share a NUMA node"

      - name: Measure startup and collect separate profiles
        working-directory: ${{ env.AGENTS }}/startup-harness/benchmark-overhead
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          mkdir -p build/reports/agent-startup
          uname -a > build/reports/agent-startup/host.txt
          lscpu >> build/reports/agent-startup/host.txt
          docker info >> build/reports/agent-startup/host.txt
          cp ../harness-revision.txt build/reports/agent-startup/
          printf '%s/ actions run %s attempt %s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > build/reports/agent-startup/workflow.txt
          mkdir -p build/reports/agent-startup/artifact-identities/{baseline,candidate}
          cp "$AGENTS/startup-baseline/"*.txt build/reports/agent-startup/artifact-identities/baseline/
          cp "$AGENTS/startup-candidate/"*.txt build/reports/agent-startup/artifact-identities/candidate/
          ./gradlew --no-daemon agentStartupBenchmark \
            "-PstartupBenchmarkBaseline=$AGENTS/startup-baseline/opentelemetry-javaagent.jar" \
            "-PstartupBenchmarkCandidate=$AGENTS/startup-candidate/opentelemetry-javaagent.jar"

      - name: Publish summary
        working-directory: ${{ env.AGENTS }}/startup-harness/benchmark-overhead
        run: cat build/reports/agent-startup/*/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-startup-results-${{ github.run_attempt }}
          path: |
            ${{ env.AGENTS }}/startup-harness/benchmark-overhead/build/reports/agent-startup
            ${{ env.AGENTS }}/startup-harness/benchmark-overhead/build/reports/tests
          if-no-files-found: error
          retention-days: 30

      - name: Remove only this attempt's files
        if: always()
        run: rm -rf -- "$AGENTS"
