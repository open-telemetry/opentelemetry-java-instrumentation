name: Agent startup benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-startup-benchmark
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'open-telemetry/opentelemetry-java-instrumentation'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build agent from selected revision
        run: ./gradlew :javaagent:shadowJar -PremoveJarVersionNumbers=true "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" --max-workers=2

      - name: Format and validate standalone benchmark
        working-directory: benchmark-overhead
        env:
          STARTUP_VOLUME_CLEANUP_ENABLED: true
        run: ./gradlew spotlessApply test --tests 'io.opentelemetry.startup.*Test' startupRecorderJar

      - name: Package selected revision and agent identity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/startup-agent" "$RUNNER_TEMP/startup-harness"
          cp javaagent/build/libs/opentelemetry-javaagent.jar "$RUNNER_TEMP/startup-agent/"
          git rev-parse HEAD > "$RUNNER_TEMP/startup-agent/revision.txt"
          (cd "$RUNNER_TEMP/startup-agent" && sha256sum opentelemetry-javaagent.jar > sha256.txt)
          git rev-parse HEAD > "$RUNNER_TEMP/startup-harness/harness-revision.txt"
          tar --exclude=benchmark-overhead/build --exclude=benchmark-overhead/.gradle \
            -czf "$RUNNER_TEMP/startup-harness/startup-harness.tar.gz" \
            benchmark-overhead .java-version buildscripts/spotless.license.java

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: startup-agent
          path: ${{ runner.temp }}/startup-agent
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: startup-harness
          path: ${{ runner.temp }}/startup-harness
          if-no-files-found: error
          retention-days: 30

  benchmark:
    needs: build
    permissions: {}
    runs-on: oracle-bare-metal-64cpu-1024gb-x86-64-ubuntu-24
    timeout-minutes: 45
    steps:
      - name: Isolate this attempt under runner temporary storage
        working-directory: ${{ runner.temp }}
        run: |
          root="$RUNNER_TEMP/agent-startup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'AGENTS=%s\nGRADLE_USER_HOME=%s/gradle-home\n' "$root" "$root" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: startup-*
          path: ${{ env.AGENTS }}

      - name: Unpack standalone benchmark in temporary directory
        env:
          HARNESS: ${{ env.AGENTS }}/startup-harness
        run: tar -xzf "$HARNESS/startup-harness.tar.gz" -C "$HARNESS"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: ${{ env.AGENTS }}/startup-harness/.java-version

      - name: Verify artifact and validate report logic
        working-directory: ${{ env.AGENTS }}/startup-harness/benchmark-overhead
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          (cd "$AGENTS/startup-agent" && sha256sum --check sha256.txt)
          ./gradlew --no-daemon test --tests 'io.opentelemetry.startup.*Test' startupRecorderJar

      - name: Verify pinned CPUs are distinct cores on the same NUMA node
        shell: python
        run: |
          import subprocess
          rows = subprocess.check_output(
              ["lscpu", "-p=CPU,CORE,SOCKET,NODE"], text=True
          ).splitlines()
          cpus = dict((row.split(",")[0], row.split(",")[1:])
                      for row in rows if not row.startswith("#"))
          assert cpus["0"][:2] != cpus["1"][:2], "CPUs 0,1 must be distinct cores"
          assert cpus["0"][2] == cpus["1"][2] and cpus["0"][2].isdigit(), "CPUs 0,1 must share a NUMA node"

      - name: Measure startup and collect separate profile
        working-directory: ${{ env.AGENTS }}/startup-harness/benchmark-overhead
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          mkdir -p build/reports/agent-startup
          uname -a > build/reports/agent-startup/host.txt
          lscpu >> build/reports/agent-startup/host.txt
          docker info >> build/reports/agent-startup/host.txt
          cp ../harness-revision.txt build/reports/agent-startup/
          printf '%s/ actions run %s attempt %s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > build/reports/agent-startup/workflow.txt
          mkdir -p build/reports/agent-startup/artifact-identities/agent
          cp "$AGENTS/startup-agent/"*.txt build/reports/agent-startup/artifact-identities/agent/
          source_revision=$(cat "$AGENTS/startup-agent/revision.txt")
          ./gradlew --no-daemon agentStartupBenchmark \
            "-PstartupBenchmarkAgentJar=$AGENTS/startup-agent/opentelemetry-javaagent.jar" \
            "-PstartupBenchmarkSourceRevision=$source_revision"

      - name: Publish summary
        working-directory: ${{ env.AGENTS }}/startup-harness/benchmark-overhead
        run: cat build/reports/agent-startup/*/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-startup-results-${{ github.run_attempt }}
          path: |
            ${{ env.AGENTS }}/startup-harness/benchmark-overhead/build/reports/agent-startup
            ${{ env.AGENTS }}/startup-harness/benchmark-overhead/build/reports/tests
          if-no-files-found: error
          retention-days: 30

      - name: Remove only this attempt's files
        if: always()
        run: rm -rf -- "$AGENTS"
