name: Muzzle benchmark

on:
  workflow_dispatch:
    inputs:
      baseline-ref:
        description: Baseline revision
        required: true
        type: string
      candidate-ref:
        description: Candidate revision, defaults to the selected workflow revision
        type: string
      partitions:
        description: JSON array of Muzzle partitions, for example [1,2,3,4]
        type: string
        default: '[1]'
      rounds:
        description: Measured baseline/control/candidate rounds, 1 to 10
        type: string
        default: '5'
      workload-run-id:
        description: Optional earlier benchmark run whose frozen workload to reuse
        type: string
      online-dependencies:
        description: Online Gradle resolution with combined dependency preparation and reference generation
        type: boolean
        default: false
      live-metadata-pair:
        description: Add one diagnostic baseline/candidate pair with cold live Maven version discovery
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: muzzle-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25.0.5+8

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Validate runner
        working-directory: benchmark-muzzle
        run: python3 -m unittest -v

      - name: Validate benchmark controls
        run: ./gradlew -p gradle-plugins test --tests '*Muzzle*Test' --no-scan --max-workers=2

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: muzzle-benchmark-validation
          path: gradle-plugins/build/reports/tests

  benchmark:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON(inputs.partitions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space
        run: .github/scripts/gha-free-disk-space.sh

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25.0.5+8

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Download frozen workload
        if: inputs.workload-run-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: muzzle-benchmark-results-${{ matrix.partition }}
          path: ${{ runner.temp }}/muzzle-workload
          run-id: ${{ inputs.workload-run-id }}
          github-token: ${{ github.token }}

      - name: Run paired benchmark with identical-revision control
        env:
          BASELINE: ${{ inputs.baseline-ref }}
          CANDIDATE: ${{ inputs.candidate-ref || github.sha }}
          PARTITION: ${{ matrix.partition }}
          ROUNDS: ${{ inputs.rounds }}
          WORKLOAD_RUN_ID: ${{ inputs.workload-run-id }}
          ONLINE_DEPENDENCIES: ${{ inputs.online-dependencies }}
          LIVE_METADATA_PAIR: ${{ inputs.live-metadata-pair }}
        run: |
          arguments=()
          if [ "$ONLINE_DEPENDENCIES" = "true" ]; then
            arguments+=(--online-dependencies)
          fi
          if [ "$LIVE_METADATA_PAIR" = "true" ]; then
            arguments+=(--live-metadata-pair)
          fi
          if [ -n "$WORKLOAD_RUN_ID" ]; then
            if [ -f "$RUNNER_TEMP/muzzle-workload/inputs/identity.json" ]; then
              arguments+=(--inputs "$RUNNER_TEMP/muzzle-workload/inputs")
            else
              echo "::error::Saved run does not contain a prepared workload."
              exit 1
            fi
          fi
          python3 benchmark-muzzle/benchmark.py \
            --baseline "$BASELINE" --candidate "$CANDIDATE" \
            --partition "$PARTITION" --rounds "$ROUNDS" \
            --work-dir "$RUNNER_TEMP/muzzle-benchmark" \
            --seed-gradle-home "$HOME/.gradle" "${arguments[@]}"

      - name: Publish summary
        run: cat "$RUNNER_TEMP/muzzle-benchmark/reports/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: muzzle-benchmark-inputs-${{ matrix.partition }}
          path: ${{ runner.temp }}/muzzle-benchmark/reports/inputs
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: muzzle-benchmark-results-${{ matrix.partition }}
          path: ${{ runner.temp }}/muzzle-benchmark/reports
          if-no-files-found: error
          retention-days: 30
