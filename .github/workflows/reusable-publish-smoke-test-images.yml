# Every workflow that includes this must also include the following to make sure that it
# is triggered when a new JDK is added to the matrix:
#on:
#  push:
#    paths:
#      - ".github/workflows/reusable-publish-smoke-test-images.yml"

name: PR build fake backend images for smoke tests

on:
  workflow_call:
    inputs:
      project:
        type: string
        required: true
      cache-read-only:
        type: boolean
        required: false
        default: true
      skip-java-8:
        type: boolean
        required: false
      skip-java-11:
        type: boolean
        required: false
      skip-java-17:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
      family: ${{ steps.set-tag.outputs.family }}
      images: ${{ steps.build-images.outputs.images }}
    env:
      LATEST_JAVA_VERSION: 27 # renovate(java-version)
      PROJECT: ${{ inputs.project }}
      SKIP_JAVA_8: ${{ inputs.skip-java-8 }}
      SKIP_JAVA_11: ${{ inputs.skip-java-11 }}
      SKIP_JAVA_17: ${{ inputs.skip-java-17 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: .github/scripts/gha-free-disk-space.sh

      - name: Set up JDK for running Gradle
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Login to GitHub package registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tag
        id: set-tag
        run: |
          tag="$(date -u '+%Y%m%d').${GITHUB_RUN_ID}$(printf '%06d' "$GITHUB_RUN_ATTEMPT")"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "family=${PROJECT##*:}" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ inputs.cache-read-only }}

      - name: Build Docker images
        id: build-images
        run: |
          set -euo pipefail
          family="${PROJECT##*:}"
          versions=()
          [[ "$SKIP_JAVA_8" == true ]] || versions+=(8)
          [[ "$SKIP_JAVA_11" == true ]] || versions+=(11)
          [[ "$SKIP_JAVA_17" == true ]] || versions+=(17)
          versions+=(21 25 "$LATEST_JAVA_VERSION")
          : > "$RUNNER_TEMP/publication-images.txt"
          for version in "${versions[@]}"; do
            ./gradlew "$PROJECT:jib" -Ptag="$TAG" -PtargetJDK="$version" -Djib.httpTimeout=120000 -Djib.console=plain
            printf 'ghcr.io/%s/smoke-test-%s:jdk%s-%s\n' "${GITHUB_REPOSITORY,,}" "$family" "$version" "$TAG" >> "$RUNNER_TEMP/publication-images.txt"
          done
          echo "images=$(paste -sd ',' "$RUNNER_TEMP/publication-images.txt")" >> "$GITHUB_OUTPUT"

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login to GitHub package registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published image family
        env:
          FAMILY: ${{ needs.build.outputs.family }}
          TAG: ${{ needs.build.outputs.tag }}
          IMAGES: ${{ needs.build.outputs.images }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          printf '%s\n' "$IMAGES" | tr ',' '\n' > "$RUNNER_TEMP/publication-images.txt"
          python3 .github/scripts/smoke_test_publication.py \
            --family "$FAMILY" --tag "$TAG" \
            --references "$RUNNER_TEMP/publication-images.txt" \
            --results "$BUILD_RESULT" --output "$RUNNER_TEMP/publication-candidate.json"

      - name: Upload publication candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-publication-${{ needs.build.outputs.family }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-candidate.json
          if-no-files-found: error
