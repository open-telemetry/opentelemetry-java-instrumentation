name: Zizmor

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
  schedule:
    - cron: '42 9 * * 3' # weekly at 09:42 UTC on Wednesday
  workflow_dispatch:

# superseded pull request runs are cancelled; other events get a unique group so they never queue or cancel
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read # for actions/checkout
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@6839dcd6ea227c18b59d11da34499746634728ad # v0.17.0
