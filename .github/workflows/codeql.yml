name: CodeQL

on:
  pull_request:
    branches:
      - main
      - maintenance/v*.x
      - release/*
      - cloudfoundry
      - gh-pages
  push:
    branches:
      - main
      - maintenance/v*.x
      - release/*
      - cloudfoundry
      - gh-pages
  schedule:
    - cron: "29 13 * * 2"  # weekly at 13:29 UTC on Tuesday

# superseded pull request runs are cancelled; other events get a unique group so they never queue or cancel
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze-actions:
    name: Analyze (actions)
    permissions:
      contents: read
      actions: read  # for github/codeql-action/init to get workflow details
      security-events: write  # for github/codeql-action/analyze to upload SARIF results
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: actions

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:actions"

  analyze-java-none:
    name: Analyze Java (none)
    permissions:
      contents: read
      actions: read  # for github/codeql-action/init to get workflow details
      security-events: write  # for github/codeql-action/analyze to upload SARIF results
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK for running Gradle
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Gradle
        # zizmor: ignore[cache-poisoning] This job uploads CodeQL results, not release artifacts.
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: java-kotlin
          build-mode: none
          tools: linked

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:java"

  analyze-kotlin-manual:
    name: Analyze Kotlin (manual)
    permissions:
      contents: read
      actions: read  # for github/codeql-action/init to get workflow details
      security-events: write  # for github/codeql-action/analyze to upload SARIF results
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK for running Gradle
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Increase gradle daemon heap size
        run: |
          # Leave enough heap for CodeQL-traced Kotlin compilation.
          sed -i "s/org.gradle.jvmargs=/org.gradle.jvmargs=-Xmx8g /" gradle.properties

      - name: Set up Gradle
        # zizmor: ignore[cache-poisoning] This job uploads CodeQL results, not release artifacts.
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Prepare Kotlin compiler classpaths
        run: ./gradlew compileKotlin -Pkotlin.daemon.jvmargs=-Xmx4g

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: java-kotlin
          build-mode: manual
          # using "linked" helps to keep up with the linked Kotlin support
          # see https://github.com/github/codeql-action/issues/1555#issuecomment-1452228433
          tools: linked

      - name: Compile production Kotlin
        # --rerun forces only the requested Kotlin compiler tasks. Their prepared Java
        # dependencies remain up-to-date and outside CodeQL tracing.
        # --no-daemon and in-process Kotlin compilation are required for CodeQL
        # to observe the compilation without reusing the warm-up compiler daemon.
        # (see https://docs.github.com/en/code-security/codeql-cli/getting-started-with-the-codeql-cli/preparing-your-code-for-codeql-analysis#specifying-build-commands)
        run: |
          ./gradlew -p gradle-plugins compileKotlin --rerun --no-build-cache --no-daemon -Dorg.gradle.jvmargs=-Xmx8g -Pkotlin.compiler.execution.strategy=in-process
          ./gradlew -p conventions compileKotlin --rerun --no-build-cache --no-daemon -Dorg.gradle.jvmargs=-Xmx8g -Pkotlin.compiler.execution.strategy=in-process
          ./gradlew compileKotlin --rerun --no-build-cache --no-daemon -Pkotlin.compiler.execution.strategy=in-process

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:kotlin-manual"

  workflow-notification:
    permissions:
      issues: write
    needs:
      - analyze-actions
      - analyze-java-none
      - analyze-kotlin-manual
    if: always() && github.event_name == 'schedule'
    uses: open-telemetry/shared-workflows/.github/workflows/workflow-failure-issue.yml@f09a36e1fa2576787fe05cbc1313ef6066918c78 # v0.23.0
    with:
      success: ${{ needs.analyze-actions.result == 'success' && needs.analyze-java-none.result == 'success' && needs.analyze-kotlin-manual.result == 'success' }}
