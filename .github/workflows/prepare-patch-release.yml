name: Prepare patch release
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-patch-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ hashFiles('towncrier.toml') != '' }}
        with:
          python-version: '3.14'

      - name: Install Towncrier
        if: ${{ hashFiles('towncrier.toml') != '' }}
        run: python -m pip install -r .github/scripts/changelog/requirements.txt

      - name: Verify prerequisites
        run: |
          if [[ ! $GITHUB_REF_NAME =~ ^release/v[0-9]+\.[0-9]+\.x$ ]]; then
            echo this workflow should only be run against release branches
            exit 1
          fi

          if [[ -f towncrier.toml ]]; then
            if ! grep --quiet "^<!-- towncrier release notes start -->$" CHANGELOG.md; then
              echo the change log is missing the Towncrier insertion marker
              exit 1
            fi
          elif ! grep --quiet "^## Unreleased$" CHANGELOG.md; then
            echo the change log is missing the Unreleased section
            exit 1
          fi

      - name: Set environment variables
        run: |
          version=$(.github/scripts/get-version.sh)
          if [[ $version =~ ^([0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
            major_minor="${BASH_REMATCH[1]}"
            patch="${BASH_REMATCH[2]}"
          else
            echo "unexpected version: $version"
            exit 1
          fi
          echo "VERSION=$major_minor.$((patch + 1))" >> $GITHUB_ENV

      - name: Update version
        run: .github/scripts/update-version.sh $VERSION

      - name: Update download link version
        run: |
          sed -Ei "s,https://github\.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v[0-9]+\.[0-9]+\.[0-9]+/,https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v$VERSION/," README.md

      - name: Update the change log with the approximate release date
        run: |
          date=$(date "+%Y-%m-%d")
          if [[ -f towncrier.toml ]]; then
            .github/scripts/update-changelog-for-release.sh "$VERSION" "$date"
          else
            sed -Ei "s/^## Unreleased$/## Version $VERSION ($date)/" CHANGELOG.md
          fi

      - name: Use CLA approved bot
        run: .github/scripts/use-cla-approved-bot.sh

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: otelbot-token
        with:
          client-id: ${{ vars.OTELBOT_JAVA_INSTRUMENTATION_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_JAVA_INSTRUMENTATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create pull request
        env:
          # pull requests from secrets.GITHUB_TOKEN do not run workflows
          GH_TOKEN: ${{ steps.otelbot-token.outputs.token }}
        run: |
          message="Prepare release $VERSION"
          branch="otelbot/prepare-release-${VERSION}"

          gh auth setup-git
          git checkout -b $branch
          git commit -a -m "$message"
          git push --set-upstream origin $branch
          gh pr create \
            --title "[$GITHUB_REF_NAME] $message" \
            --body "$message." \
            --base $GITHUB_REF_NAME
