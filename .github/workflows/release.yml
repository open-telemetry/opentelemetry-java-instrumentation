name: Release
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  common:
    uses: $/.github/workflows/build-common.yml

  # test-latest-deps is intentionally not included in the release workflows
  # because any time a new library version is released to maven central
  # it can fail due to test code incompatibility with the new library version,
  # or due to slight changes in emitted telemetry

  # muzzle is intentionally not included in the release workflows
  # because any time a new library version is released to maven central it can fail,
  # and this is not a reason to hold up the release

  release:
    environment: protected
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs:
      - common
    outputs:
      version: ${{ steps.release-version.outputs.VERSION }}
      prior-version: ${{ steps.release-version.outputs.PRIOR_VERSION }}
      development-branch: ${{ steps.release-version.outputs.DEVELOPMENT_BRANCH }}
    steps:
      - run: |
          if [[ ! $GITHUB_REF =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo this workflow should only be run against release tags
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch development branch refs so the release destination can be resolved
          fetch-depth: 0
          persist-credentials: false

      - id: release-version
        name: Set environment variables
        # Sets VERSION, DEVELOPMENT_BRANCH, and PRIOR_VERSION.
        run: |
          config=$(python .github/scripts/release-config.py release --ref "$GITHUB_REF_NAME")
          echo "$config" >> "$GITHUB_ENV"
          echo "$config" >> "$GITHUB_OUTPUT"

        # check out the development branch to verify there won't be problems merging the change log
        # at the end of this workflow
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEVELOPMENT_BRANCH }}
          persist-credentials: false

      - name: Check that change log update was merged to the development branch
        run: |
          if [[ $VERSION == *.0 ]]; then
            # not making a patch release
            if ! grep --quiet "^## Version $VERSION " CHANGELOG.md; then
              echo the pull request generated by prepare-release-branch.yml needs to be merged first
              exit 1
            fi
          fi

        # back to the release tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tags are needed for the generate-release-contributors.sh script
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space
        run: .github/scripts/gha-free-disk-space.sh

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build and publish artifacts
        env:
          SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
          SONATYPE_KEY: ${{ secrets.SONATYPE_KEY }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
        # run: ./gradlew assemble spdxSbom publishToSonatype closeAndReleaseSonatypeStagingRepository
        run: ./gradlew assemble spdxSbom publishAllPublicationToReleaseRepoRepository generateReleaseBundle uploadReleaseBundle

      - name: Build and publish gradle plugins
        env:
          SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
          SONATYPE_KEY: ${{ secrets.SONATYPE_KEY }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
        # Don't use publishToSonatype since we don't want to publish the marker artifact
        run: ./gradlew build publishPlugins publishPluginMavenPublicationToSonatypeRepository closeAndReleaseSonatypeStagingRepository
        working-directory: gradle-plugins

      - name: Collect SBOMs
        run: |
          mkdir sboms
          cp javaagent/build/spdx/*.spdx.json sboms
          zip opentelemetry-java-instrumentation-SBOM.zip sboms/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        name: Upload SBOMs
        with:
          name: opentelemetry-java-instrumentation-SBOM
          path: "sboms/*.json"

      - name: Simplify paths for attaching
        run: |
          cp javaagent/build/libs/opentelemetry-javaagent-${VERSION}.jar opentelemetry-javaagent.jar
          cp javaagent/build/libs/opentelemetry-javaagent-${VERSION}.jar.asc opentelemetry-javaagent.jar.asc

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          if-no-files-found: error
          path: |
            opentelemetry-javaagent.jar
            opentelemetry-javaagent.jar.asc
            opentelemetry-java-instrumentation-SBOM.zip

  sign-and-release:
    permissions:
      contents: write # for creating the release
      id-token: write # for signing artifacts with Sigstore
      attestations: write # for uploading attestations
    runs-on: ubuntu-latest
    needs:
      - release
    env:
      DEVELOPMENT_BRANCH: ${{ needs.release.outputs.development-branch }}
    outputs:
      version: ${{ steps.create-github-release.outputs.version }}
      prior-version: ${{ steps.create-github-release.outputs.prior-version }}
      development-branch: ${{ steps.create-github-release.outputs.development-branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts

      - name: Determine whether to mark the release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        # Sets MAKE_LATEST.
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | python .github/scripts/release-config.py latest --version "$VERSION" >> "$GITHUB_ENV"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIOR_VERSION: ${{ needs.release.outputs.prior-version }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          sed -n "0,/^## Version $VERSION /d;/^## Version /q;p" CHANGELOG.md \
            > /tmp/CHANGELOG_SECTION.md

          # The complex perl regex is needed because markdown docs render newlines as soft wraps
          # while release notes render them as line breaks.
          perl -0pe 's/(?<!\n)\n *(?!\n)(?![-*] )(?![1-9]+\. )/ /g' /tmp/CHANGELOG_SECTION.md \
            > /tmp/release-notes.txt

          # Conditional block not indented because of the heredoc.
          if [[ $VERSION == *.0 ]]; then
          cat >> /tmp/release-notes.txt << EOF
          ### 🙇 Thank you

          This release was possible thanks to the following contributors who shared their brilliant ideas and awesome pull requests:

          EOF

          .github/scripts/generate-release-contributors.sh "v$PRIOR_VERSION" "$DEVELOPMENT_BRANCH" >> /tmp/release-notes.txt
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts
        run: |
          for artifact in opentelemetry-javaagent.jar opentelemetry-java-instrumentation-SBOM.zip; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "${artifact}"
          done

      - name: Verify release artifact signatures
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          for artifact in opentelemetry-javaagent.jar opentelemetry-java-instrumentation-SBOM.zip; do
            cosign verify-blob "${artifact}" \
              --bundle "${artifact}.sigstore.json" \
              --certificate-identity "${CERTIFICATE_IDENTITY}" \
              --certificate-oidc-issuer "${CERTIFICATE_OIDC_ISSUER}"
          done

      - name: Generate checksums
        run: |
          sha256sum opentelemetry-javaagent.jar \
                    opentelemetry-javaagent.jar.asc \
                    opentelemetry-java-instrumentation-SBOM.zip \
                    > checksums.txt

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            opentelemetry-javaagent.jar
            opentelemetry-java-instrumentation-SBOM.zip
            checksums.txt

      - id: create-github-release
        name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIOR_VERSION: ${{ needs.release.outputs.prior-version }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release create --verify-tag \
                            --title "Version $VERSION" \
                            --latest="$MAKE_LATEST" \
                            --notes-file /tmp/release-notes.txt \
                            v$VERSION \
                            opentelemetry-javaagent.jar \
                            opentelemetry-javaagent.jar.asc \
                            opentelemetry-javaagent.jar.sigstore.json \
                            opentelemetry-java-instrumentation-SBOM.zip \
                            opentelemetry-java-instrumentation-SBOM.zip.sigstore.json \
                            checksums.txt

          # these are used as job outputs
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prior-version=$PRIOR_VERSION" >> $GITHUB_OUTPUT
          echo "development-branch=$DEVELOPMENT_BRANCH" >> $GITHUB_OUTPUT

  documentation-audit:
    permissions:
      contents: read
      issues: write
    needs:
      - sign-and-release
    uses: $/.github/workflows/documentation-synchronization-audit.yml

  post-release-updates:
    runs-on: ubuntu-latest
    needs:
      - sign-and-release
    env:
      DEVELOPMENT_BRANCH: ${{ needs.sign-and-release.outputs.development-branch }}
    steps:
      # add change log sync (if any) into this PR since the apidiff update
      # is required before any other PR can be merged anyway
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Copy change log section from release tag
        env:
          VERSION: ${{ needs.sign-and-release.outputs.version }}
        run: |
          sed -n "0,/^## Version $VERSION /d;/^## Version /q;p" CHANGELOG.md \
            > /tmp/changelog-section.md

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEVELOPMENT_BRANCH }}
          persist-credentials: false

      - name: Determine whether to update the API baseline
        env:
          VERSION: ${{ needs.sign-and-release.outputs.version }}
        # Sets UPDATE_API_BASELINE.
        run: |
          python .github/scripts/release-config.py post-release --version "$VERSION" >> "$GITHUB_ENV"

      - name: Merge change log to the development branch
        env:
          VERSION: ${{ needs.sign-and-release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_date=$(gh release view v$VERSION --json publishedAt --jq .publishedAt | sed 's/T.*//')
          RELEASE_DATE=$release_date .github/scripts/merge-change-log-after-release.sh

      - name: Wait for release to be available in maven central
        if: ${{ env.UPDATE_API_BASELINE == 'true' }}
        env:
          VERSION: ${{ needs.sign-and-release.outputs.version }}
        run: |
          until curl --silent \
                     --show-error \
                     --output /dev/null \
                     --head \
                     --fail \
                     https://repo1.maven.org/maven2/io/opentelemetry/javaagent/opentelemetry-javaagent/$VERSION/opentelemetry-javaagent-$VERSION.jar
          do
            sleep 60
          done

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: ${{ env.UPDATE_API_BASELINE == 'true' }}
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: ${{ env.UPDATE_API_BASELINE == 'true' }}
        with:
          cache-read-only: true

      - name: Update apidiff baseline
        if: ${{ env.UPDATE_API_BASELINE == 'true' }}
        env:
          VERSION: ${{ needs.sign-and-release.outputs.version }}
          PRIOR_VERSION: ${{ needs.sign-and-release.outputs.prior-version }}
        run: |
          ./gradlew japicmp -PapiBaseVersion=$PRIOR_VERSION -PapiNewVersion=$VERSION
          # Pin the apidiff baseline to the just-released version.
          sed -i "s/^val apidiffBaselineVersion = .*/val apidiffBaselineVersion = \"$VERSION\"/" version.gradle.kts
          ./gradlew --refresh-dependencies japicmp

      - name: Update development branch download link
        if: ${{ startsWith(env.DEVELOPMENT_BRANCH, 'maintenance/v') && env.UPDATE_API_BASELINE == 'true' }}
        env:
          VERSION: ${{ needs.sign-and-release.outputs.version }}
        run: |
          sed -Ei "s,https://github\.com/open-telemetry/opentelemetry-java-instrumentation/releases/(latest/download|download/v[0-9]+\.[0-9]+\.[0-9]+)/,https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v$VERSION/," README.md

      - name: Use CLA approved bot
        run: .github/scripts/use-cla-approved-bot.sh

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: otelbot-token
        with:
          client-id: ${{ vars.OTELBOT_JAVA_INSTRUMENTATION_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_JAVA_INSTRUMENTATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create pull request against the development branch
        env:
          VERSION: ${{ needs.sign-and-release.outputs.version }}
          # pull requests from secrets.GITHUB_TOKEN do not run workflows
          GH_TOKEN: ${{ steps.otelbot-token.outputs.token }}
        run: |
          message="Post-release updates for $VERSION"
          body="Post-release updates for \`$VERSION\`."
          branch="otelbot/update-apidiff-baseline-to-released-version-${VERSION}"

          gh auth setup-git
          git checkout -b $branch
          git add CHANGELOG.md
          git add README.md
          git add docs/apidiffs
          git add version.gradle.kts
          git commit -m "$message"
          git push --set-upstream origin $branch
          gh pr create \
            --title "$message" \
            --body "$body" \
            --base "$DEVELOPMENT_BRANCH"
