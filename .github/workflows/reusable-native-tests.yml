name: Reusable - Native tests

on:
  workflow_call:
    inputs:
      test-latest-deps:
        type: boolean
        required: false
      quick-build:
        type: boolean
        required: false
        default: false
      cache-read-only:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  graalvm-native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        test-java-version:
          - 22
          - 23
          - 24
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read-java
        run: echo "version=$(cat .java-version)" >> "$GITHUB_OUTPUT"
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          version: "latest"
          java-version: ${{ matrix.test-java-version }}
      - name: Increase gradle daemon heap size
        run: |
          sed -i "s/org.gradle.jvmargs=/org.gradle.jvmargs=-Xmx4g /" gradle.properties
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ inputs.cache-read-only }}
      - name: Running test
        env:
          DOCKER_COMPOSE_TEST: "true"
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          java --version
          native-image --version
          # Testcontainers does not work in some cases with GraalVM native images, 
          # therefore we're starting a Kafka container manually for the tests
          docker compose -f .github/graal-native-docker-compose.yaml up -d
          # don't wait for startup - gradle compile takes long enough
          ./gradlew ${{ inputs.test-latest-deps && '-PtestLatestDeps=true' || '' }} ${{ inputs.quick-build && '-PnativeTestQuickBuild=true' || '' }} nativeTest --no-configuration-cache
          docker compose -f .github/graal-native-docker-compose.yaml down # is this needed?
