name: Reusable - Update OpenTelemetry SDK

on:
  workflow_call:
    inputs:
      target-branch:
        type: string
        required: true
    secrets:
      OTELBOT_JAVA_INSTRUMENTATION_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  check-versions:
    runs-on: ubuntu-latest
    outputs:
      current-version: ${{ steps.check-versions.outputs.current-version }}
      latest-version: ${{ steps.check-versions.outputs.latest-version }}
      already-opened: ${{ steps.check-versions.outputs.already-opened }}
      branch: ${{ steps.check-versions.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target-branch }}
          persist-credentials: false

      - id: check-versions
        name: Check versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
        run: |
          set -o pipefail

          current_version=$(grep -Po "val otelSdkVersion = \"\K[0-9]+.[0-9]+.[0-9]+" \
                                dependencyManagement/build.gradle.kts)
          latest_version=$(gh release view \
                               --repo open-telemetry/opentelemetry-java \
                               --json tagName \
                               --jq .tagName \
                             | sed 's/^v//')

          branch="otelbot/update-opentelemetry-sdk-${TARGET_BRANCH//\//-}-to-${latest_version}"
          matches=$(gh pr list \
                        --base "$TARGET_BRANCH" \
                        --state open \
                        --search "in:title \"Update the OpenTelemetry SDK version to $latest_version\"")
          already_opened=false
          if [ -n "$matches" ]
          then
            already_opened=true
          fi

          {
            echo "current-version=$current_version"
            echo "latest-version=$latest_version"
            echo "already-opened=$already_opened"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

  update-otel-sdk:
    runs-on: ubuntu-latest
    if: |
      needs.check-versions.outputs.current-version != needs.check-versions.outputs.latest-version &&
      needs.check-versions.outputs.already-opened != 'true'
    needs:
      - check-versions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target-branch }}
          persist-credentials: false

      - name: Update version
        env:
          VERSION: ${{ needs.check-versions.outputs.latest-version }}
        run: ./.github/scripts/update-sdk-version.sh "$VERSION"

      - name: Free disk space
        run: .github/scripts/gha-free-disk-space.sh

      - name: Set up JDK for running Gradle
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Update license report
        # with the build cache enabled occasionally produces outdated results
        run: ./gradlew generateLicenseReport --no-build-cache

      - name: Undo license report clean
        if: failure()
        run: git checkout -- licenses

      - name: Use CLA approved bot
        run: .github/scripts/use-cla-approved-bot.sh

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: otelbot-token
        with:
          client-id: ${{ vars.OTELBOT_JAVA_INSTRUMENTATION_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_JAVA_INSTRUMENTATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create pull request
        if: success() || failure()
        env:
          VERSION: ${{ needs.check-versions.outputs.latest-version }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          BRANCH: ${{ needs.check-versions.outputs.branch }}
          # pull requests from secrets.GITHUB_TOKEN do not run workflows
          GH_TOKEN: ${{ steps.otelbot-token.outputs.token }}
        run: |
          message="Update the OpenTelemetry SDK version to $VERSION"
          body="Update the OpenTelemetry SDK version to \`$VERSION\`."

          gh auth setup-git
          git checkout -b "$BRANCH"
          git add -u
          git add licenses
          git commit -m "$message"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --title "$message" \
            --body "$body" \
            --base "$TARGET_BRANCH"
