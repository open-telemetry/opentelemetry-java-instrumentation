name: Reusable PR build

# Always invoked from build-pull-request.yml (the dispatcher).
# All gating decisions are made by the dispatcher and passed in as inputs.
on:
  workflow_call:
    inputs:
      skip-native-tests:
        type: boolean
        default: false
      skip-openj9-tests:
        type: boolean
        default: false
      skip-windows-smoke-tests:
        type: boolean
        default: false
      limited-appserver-matrix:
        type: boolean
        default: false
      skip-servlet-images:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  common:
    uses: $/.github/workflows/build-common.yml
    with:
      skip-openj9-tests: ${{ inputs.skip-openj9-tests }}
      skip-windows-smoke-tests: ${{ inputs.skip-windows-smoke-tests }}
      limited-appserver-matrix: ${{ inputs.limited-appserver-matrix }}
      cache-read-only: true

  test-latest-deps:
    uses: $/.github/workflows/reusable-test-latest-deps.yml
    with:
      cache-read-only: true

  test-native:
    if: "!inputs.skip-native-tests"
    uses: $/.github/workflows/reusable-native-tests.yml
    with:
      cache-read-only: true

  muzzle:
    uses: $/.github/workflows/reusable-muzzle.yml
    with:
      cache-read-only: true

  lint:
    uses: $/.github/workflows/reusable-lint-check.yml

  link-check:
    # The README's javaagent download link can point to an unpublished release.
    if: "!startsWith(github.base_ref, 'release/')"
    uses: $/.github/workflows/reusable-lint-check.yml
    with:
      links-only: true

  build-servlet-images:
    if: "!inputs.skip-servlet-images"
    uses: $/.github/workflows/reusable-build-servlet-images.yml

  required-status-check:
    needs:
      - common
      - test-latest-deps
      - test-native
      - muzzle
      - lint
      - build-servlet-images
    runs-on: ubuntu-slim
    if: ${{ always() }}
    steps:
      - if: |
          needs.common.result != 'success' ||
          needs.test-latest-deps.result != 'success' ||
          needs.muzzle.result != 'success' ||
          needs.lint.result != 'success' ||
          (
            needs.test-native.result != 'success' &&
            needs.test-native.result != 'skipped'
          ) ||
          (
            needs.build-servlet-images.result != 'success' &&
            needs.build-servlet-images.result != 'skipped'
          )
        run: exit 1 # fail
