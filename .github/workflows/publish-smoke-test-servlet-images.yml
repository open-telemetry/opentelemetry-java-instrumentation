name: Publish Servlet images for smoke tests

on:
  push:
    paths:
      - "smoke-tests/images/servlet/**"
      - ".github/workflows/publish-smoke-test-servlet-images.yml"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.set-tag.outputs.TAG }}
    steps:
      - id: set-tag
        name: Set tag
        run: echo "TAG=$(date -u '+%Y%m%d').${GITHUB_RUN_ID}$(printf '%06d' "$GITHUB_RUN_ATTEMPT")" >> "$GITHUB_OUTPUT"

  publish:
    permissions:
      contents: read
      packages: write
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash # this is needed for TAG construction below on Windows
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
        smoke-test-server:
          - jetty
          - liberty
          - payara
          - tomcat
          - tomee
          - websphere
          - wildfly
        exclude:
          - os: windows-latest
            smoke-test-server: websphere
      fail-fast: false
    steps:
      - name: Support long paths
        run: git config --system core.longpaths true
        if: matrix.os == 'windows-latest'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        if: matrix.os != 'windows-latest'
        run: .github/scripts/gha-free-disk-space.sh

      - name: Set up JDK for running Gradle
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Login to GitHub package registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Build Linux docker images
        if: matrix.os != 'windows-latest'
        shell: bash
        run: ./gradlew :smoke-tests:images:servlet:pushLinuxImages -PextraTag=${NEEDS_PREPARE_OUTPUTS_TAG} -PsmokeTestServer=${{ matrix.smoke-test-server }}
        env:
          NEEDS_PREPARE_OUTPUTS_TAG: ${{ needs.prepare.outputs.tag }}

      - name: Build Windows docker images
        if: matrix.os == 'windows-latest'
        shell: bash
        run: ./gradlew :smoke-tests:images:servlet:pushWindowsImages -PextraTag=${NEEDS_PREPARE_OUTPUTS_TAG} -PsmokeTestServer=${{ matrix.smoke-test-server }}
        env:
          NEEDS_PREPARE_OUTPUTS_TAG: ${{ needs.prepare.outputs.tag }}

  verify:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK for running Gradle
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .java-version
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Login to GitHub package registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published image family
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          ./gradlew :smoke-tests:images:servlet:writePublicationImages --no-configuration-cache -PextraTag="$TAG"
          python3 .github/scripts/smoke_test_publication.py \
            --family servlet --tag "$TAG" \
            --references smoke-tests/images/servlet/build/publication-images.txt \
            --results "$PUBLISH_RESULT" --output "$RUNNER_TEMP/publication-candidate.json"
      - name: Upload publication candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-publication-servlet-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-candidate.json
          if-no-files-found: error

  workflow-notification:
    permissions:
      contents: read
      issues: write
    needs:
      - publish
      - verify
    if: always()
    uses: $/.github/workflows/reusable-workflow-notification.yml
    with:
      success: ${{ needs.publish.result == 'success' && needs.verify.result == 'success' }}
      failure-notification-after-attempts: 2
