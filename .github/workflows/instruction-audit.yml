name: Instruction audit

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Allow one draft PR for a verified, publishable finding
        type: boolean
        default: false
      continuation:
        description: Internal continuation state
        type: string
        default: ''

permissions: {}

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: write
      contents: write
      copilot-requests: write
    uses: open-telemetry/shared-workflows/.github/workflows/instruction-audit.yml@5e1e448c1c0e638bc714dce85e47ba227ace550a
    with:
      publish: ${{ inputs.publish }}
      continuation: ${{ inputs.continuation }}
      otelbot_client_id: ${{ vars.OTELBOT_CLIENT_ID }}
    secrets:
      otelbot_private_key: ${{ secrets.OTELBOT_PRIVATE_KEY }}
