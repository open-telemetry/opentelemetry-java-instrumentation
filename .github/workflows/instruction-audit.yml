name: Instruction audit

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Allow one draft PR for a verified, publishable finding
        type: boolean
        default: false

permissions: {}

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      copilot-requests: write
    uses: open-telemetry/shared-workflows/.github/workflows/instruction-audit.yml@a90ba87d674117cc67734f9039112590c60b9ecb
    with:
      publish: ${{ inputs.publish }}
      otelbot_client_id: ${{ vars.OTELBOT_CLIENT_ID }}
    secrets:
      otelbot_private_key: ${{ secrets.OTELBOT_PRIVATE_KEY }}
