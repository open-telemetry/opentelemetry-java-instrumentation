name: Documentation Synchronization Audit (opentelemetry.io)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl:
    outputs:
      success: ${{ steps.doc-site-audit.outputs.success }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Run instrumentation analyzer (identify any module changes)
        run: ./gradlew :instrumentation-docs:runAnalysis

      - name: Run doc site audit
        id: doc-site-audit
        run: |
          set -euo pipefail
          ./gradlew :instrumentation-docs:docSiteAudit
          audit_result=$(cat instrumentation-docs/build/audit-result)
          case "$audit_result" in
            clean)
              echo "success=true" >> "$GITHUB_OUTPUT"
              ;;
            drift)
              echo "success=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected documentation audit result: $audit_result" >&2
              exit 1
              ;;
          esac

  documentation-drift-notification:
    permissions:
      contents: read
      issues: write
    needs:
      - crawl
    if: ${{ needs.crawl.result == 'success' }}
    uses: $/.github/workflows/reusable-workflow-notification.yml
    with:
      success: ${{ needs.crawl.outputs.success == 'true' }}
      title: "Documentation sync needed: opentelemetry.io site out of sync"

  workflow-notification:
    permissions:
      contents: read
      issues: write
    needs:
      - crawl
    if: always()
    uses: $/.github/workflows/reusable-workflow-notification.yml
    with:
      success: ${{ needs.crawl.result == 'success' }}
