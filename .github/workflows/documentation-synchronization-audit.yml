name: Documentation Synchronization Audit (opentelemetry.io)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run instrumentation analyzer (identify any module changes)
        run: ./gradlew :instrumentation-docs:runAnalysis

      - name: Run doc site audit
        run: ./gradlew :instrumentation-docs:docSiteAudit

  workflow-notification:
    permissions:
      contents: read
      issues: write
    needs:
      - crawl
    if: always()
    uses: ./.github/workflows/reusable-workflow-notification.yml
    with:
      success: ${{ needs.crawl.result == 'success' }}
      title: "Documentation sync needed: opentelemetry.io site out of sync"
