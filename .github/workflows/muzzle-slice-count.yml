name: Muzzle slice-count benchmark

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
      source-run:
        type: string
        required: true
      partitions:
        type: string
        default: '[1,2,3,4]'
      rounds:
        type: string
        default: '5'
      report-run:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      rounds: ${{ steps.plan.outputs.rounds }}
      partitions: ${{ steps.plan.outputs.partitions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate slice-count comparison
        id: plan
        env:
          ROUNDS: ${{ inputs.rounds }}
          PARTITIONS: ${{ inputs.partitions }}
        run: |
          python3 -m unittest discover -s benchmark-muzzle -q
          python3 - <<'PY'
          import json, os
          rounds = int(os.environ["ROUNDS"])
          partitions = json.loads(os.environ["PARTITIONS"])
          if not 1 <= rounds <= 10:
              raise ValueError("Invalid round count")
          if (not isinstance(partitions, list) or not partitions
              or any(type(p) is not int or p not in range(1, 5) for p in partitions)
              or partitions != sorted(set(partitions))):
              raise ValueError("Invalid baseline groups")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("rounds=" + json.dumps(list(range(1, rounds + 1))) + "\n")
              out.write("partitions=" + json.dumps(partitions) + "\n")
          PY

  benchmark:
    if: inputs.report-run == ''
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        round: ${{ fromJSON(needs.validate.outputs.rounds) }}
        partition: ${{ fromJSON(needs.validate.outputs.partitions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash .github/scripts/gha-muzzle-free-disk-space.sh
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25.0.5+8
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: muzzle-ci-cache-snapshot
          path: ${{ runner.temp }}/initial
          run-id: ${{ inputs.source-run }}
          github-token: ${{ github.token }}
      - name: Compare four slices with the corresponding eight-slice halves
        env:
          REVISION: ${{ inputs.revision }}
          PARTITION: ${{ matrix.partition }}
          ROUND: ${{ matrix.round }}
        run: |
          python3 benchmark-muzzle/slice_count_benchmark.py run \
            --revision "$REVISION" --partition "$PARTITION" --round "$ROUND" \
            --cache-snapshot "$RUNNER_TEMP/initial/gradle-snapshot.tar.gz" \
            --snapshot-sha256 "$(sha256sum "$RUNNER_TEMP/initial/gradle-snapshot.tar.gz" | cut -d' ' -f1)" \
            --work-dir "$RUNNER_TEMP/muzzle-slices"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: muzzle-slices-${{ matrix.round }}-${{ matrix.partition }}
          path: ${{ runner.temp }}/muzzle-slices/reports
          if-no-files-found: error
          retention-days: 30

  report:
    if: always() && needs.validate.result == 'success'
    needs: [validate, benchmark]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: muzzle-slices-[0-9]*-*
          path: ${{ runner.temp }}/groups
          run-id: ${{ inputs.report-run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify identical coverage and paired maximum command times
        env:
          ROUNDS: ${{ inputs.rounds }}
          PARTITIONS: ${{ needs.validate.outputs.partitions }}
        run: |
          mapfile -t partitions < <(python3 -c 'import json,os; print(*json.loads(os.environ["PARTITIONS"]), sep="\n")')
          python3 benchmark-muzzle/slice_count_benchmark.py report \
            --inputs "$RUNNER_TEMP/groups" --rounds "$ROUNDS" --partitions "${partitions[@]}" \
            --output "$RUNNER_TEMP/summary"
          cat "$RUNNER_TEMP/summary/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: muzzle-slices-summary
          path: ${{ runner.temp }}/summary
          retention-days: 30
