name: Overhead benchmark (daily)
on:
  schedule:
    # daily at 5:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      workload:
        description: Application to benchmark (WebFlux includes the four-way Reactor experiment)
        type: choice
        default: petclinic
        options:
          - petclinic
          - webflux

permissions:
  contents: read

jobs:
  run-overhead-tests:
    if: github.event_name == 'schedule'
    permissions:
      contents: write # for git push to gh-pages branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages
          # zizmor: ignore[artipacked] Credentials are required by the gh-pages push below.
          persist-credentials: true

      - name: Free disk space
        run: .github/scripts/gha-free-disk-space.sh

      - name: Copy results from gh-pages branch
        run: |
          rsync -avv gh-pages/benchmark-overhead/results/ benchmark-overhead/results/

      - name: Set up JDK for running Gradle
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Build Latest Snapshot JAR
        run: >
          ./gradlew assemble -x javadoc

      - name: Run tests
        working-directory: benchmark-overhead
        run: ./gradlew test

      - name: Inspect the results dir
        working-directory: benchmark-overhead
        run: ls -lR results

      - name: Copy results back to gh-pages branch
        run: rsync -avv benchmark-overhead/results/ gh-pages/benchmark-overhead/results/ && rm -rf benchmark-overhead/results

      - name: Use CLA approved bot
        working-directory: ./gh-pages
        run: ../.github/scripts/use-cla-approved-bot.sh

      - name: Commit updated results
        working-directory: ./gh-pages
        run: |
          git add benchmark-overhead/results
          git commit -m "update test result data"
          git push

  workflow-notification:
    permissions:
      issues: write
    needs:
      - run-overhead-tests
    if: always() && github.event_name == 'schedule'
    uses: open-telemetry/shared-workflows/.github/workflows/workflow-failure-issue.yml@f73c28e3be66444181acb54f07ada23f144c0c39 # v0.25.0
    with:
      success: ${{ needs.run-overhead-tests.result == 'success' }}

  build-load-benchmark:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'open-telemetry/opentelemetry-java-instrumentation'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Build agent from dispatched revision
        run: ./gradlew :javaagent:shadowJar -PremoveJarVersionNumbers=true "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" --max-workers=2

      - name: Build WebFlux fixture
        if: inputs.workload == 'webflux'
        working-directory: benchmark-overhead
        run: ./gradlew -p webflux bootJar

      - name: Package benchmark inputs
        env:
          GH_TOKEN: ${{ github.token }}
          BENCHMARK_WORKLOAD: ${{ inputs.workload }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/load-benchmark-inputs"
          mkdir -p "$inputs"
          git rev-parse HEAD > "$inputs/revision.txt"
          test "$(cat "$inputs/revision.txt")" = "$GITHUB_SHA"
          cp javaagent/build/libs/opentelemetry-javaagent.jar "$inputs/revision-agent.jar"
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          gh release download "$release" --repo "$GITHUB_REPOSITORY" \
            --pattern opentelemetry-javaagent.jar --output "$inputs/release-agent.jar"
          printf '%s\n' "$release" > "$inputs/release.txt"
          git archive --format=tar HEAD benchmark-overhead .java-version buildscripts/spotless.license.java \
            | gzip -n > "$inputs/harness.tar.gz"
          files=(revision-agent.jar release-agent.jar revision.txt release.txt harness.tar.gz)
          if [[ "$BENCHMARK_WORKLOAD" == webflux ]]; then
            cp benchmark-overhead/webflux/build/libs/webflux-benchmark.jar "$inputs/"
            files+=(webflux-benchmark.jar)
          fi
          (cd "$inputs" && sha256sum "${files[@]}" > sha256.txt)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-benchmark-inputs
          path: ${{ runner.temp }}/load-benchmark-inputs
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  measure-load-benchmark:
    needs: build-load-benchmark
    permissions: {}
    runs-on: oracle-bare-metal-64cpu-1024gb-x86-64-ubuntu-24
    timeout-minutes: 45
    env:
      BENCHMARK_WORKLOAD: ${{ inputs.workload || 'petclinic' }}
    steps:
      - name: Isolate this attempt under runner temporary storage
        working-directory: ${{ runner.temp }}
        run: |
          root="$RUNNER_TEMP/agent-load-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'BENCHMARK_ROOT=%s\nGRADLE_USER_HOME=%s/gradle-home\n' "$root" "$root" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: load-benchmark-inputs
          path: ${{ env.BENCHMARK_ROOT }}

      - name: Verify and unpack benchmark inputs
        working-directory: ${{ env.BENCHMARK_ROOT }}
        run: |
          sha256sum --check sha256.txt
          test "$(cat revision.txt)" = "$GITHUB_SHA"
          tar -xzf harness.tar.gz

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: ${{ env.BENCHMARK_ROOT }}/.java-version

      - name: Measure application load
        working-directory: ${{ env.BENCHMARK_ROOT }}/benchmark-overhead
        run: |
          reports=build/reports/load-benchmark
          images=(grafana/k6 otel/opentelemetry-collector-contrib:latest)
          if [[ "$BENCHMARK_WORKLOAD" == webflux ]]; then
            reports="$reports/webflux"
            images=(grafana/k6@sha256:a5ad6bc089a08d77c3ec49f3db8c6fa7a148e4073efcac44c675dbaf3568d8e1
                    otel/opentelemetry-collector-contrib:latest
                    eclipse-temurin:25-jdk@sha256:ce2ef9d2d67a68de5e196d4de9d743327c44a10b57fe02ec39f572c652cacfd3)
          fi
          mkdir -p "$BENCHMARK_ROOT/tmp" "$reports"
          export TMPDIR="$BENCHMARK_ROOT/tmp" TMP="$BENCHMARK_ROOT/tmp" TEMP="$BENCHMARK_ROOT/tmp"
          cp "$BENCHMARK_ROOT/"{revision.txt,release.txt,sha256.txt} "$reports/"
          printf '%s/%s/actions/runs/%s/attempts/%s\nref=%s\nrunner=%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_REF" "$RUNNER_NAME" \
            > "$reports/workflow.txt"
          { uname -smr; lscpu; java -version; docker version; } > "$reports/host.txt" 2>&1
          ./gradlew --no-daemon agentLoadBenchmark "-PloadBenchmarkAgentDir=$BENCHMARK_ROOT" \
            "-PloadBenchmarkWorkload=$BENCHMARK_WORKLOAD" \
            "-PloadBenchmarkWebFluxJar=$BENCHMARK_ROOT/webflux-benchmark.jar"
          docker image inspect --format '{{json .RepoTags}} {{json .RepoDigests}} {{.Id}}' \
            "${images[@]}" > "$reports/images.txt"

      - name: Publish summary
        working-directory: ${{ env.BENCHMARK_ROOT }}/benchmark-overhead
        run: |
          cd build/reports/load-benchmark
          if [[ "$BENCHMARK_WORKLOAD" == webflux ]]; then
            cat webflux/standard/summary.md webflux/reactor/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            cat summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && env.BENCHMARK_ROOT != '' }}
        with:
          name: load-benchmark-results-${{ github.run_attempt }}
          path: |
            ${{ env.BENCHMARK_ROOT }}/benchmark-overhead/build/reports/load-benchmark
            ${{ env.BENCHMARK_ROOT }}/benchmark-overhead/build/reports/tests/agentLoadBenchmark
            ${{ env.BENCHMARK_ROOT }}/benchmark-overhead/petclinic-*.jfr
            ${{ env.BENCHMARK_ROOT }}/benchmark-overhead/k6_out_*.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove only this attempt's files
        if: always() && env.BENCHMARK_ROOT != ''
        working-directory: ${{ runner.temp }}
        run: rm -rf -- "$BENCHMARK_ROOT"
