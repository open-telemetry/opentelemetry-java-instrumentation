name: Overhead benchmark (daily)
on:
  schedule:
    # daily at 5:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-overhead-tests:
    permissions:
      contents: write # for git push to gh-pages branch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages
          # zizmor: ignore[artipacked] Credentials are required by the gh-pages push below.
          persist-credentials: true

      - name: Free disk space
        run: .github/scripts/gha-free-disk-space.sh

      - name: Copy results from gh-pages branch
        run: |
          rsync -avv gh-pages/benchmark-overhead/results/ benchmark-overhead/results/

      - name: Set up JDK for running Gradle
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build Latest Snapshot JAR
        run: >
          ./gradlew assemble -x javadoc

      - name: Run tests
        working-directory: benchmark-overhead
        run: ./gradlew test

      - name: Inspect the results dir
        working-directory: benchmark-overhead
        run: ls -lR results

      - name: Copy results back to gh-pages branch
        run: rsync -avv benchmark-overhead/results/ gh-pages/benchmark-overhead/results/ && rm -rf benchmark-overhead/results

      - name: Use CLA approved bot
        working-directory: ./gh-pages
        run: ../.github/scripts/use-cla-approved-bot.sh

      - name: Commit updated results
        working-directory: ./gh-pages
        run: |
          git add benchmark-overhead/results
          git commit -m "update test result data"
          git push

  workflow-notification:
    permissions:
      issues: write
    needs:
      - run-overhead-tests
    if: always()
    uses: open-telemetry/shared-workflows/.github/workflows/workflow-failure-issue.yml@f09a36e1fa2576787fe05cbc1313ef6066918c78 # v0.23.0
    with:
      success: ${{ needs.run-overhead-tests.result == 'success' }}
