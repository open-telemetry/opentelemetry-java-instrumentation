name: OSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: "43 6 * * 5" # weekly at 06:43 (UTC) on Friday
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    permissions:
      contents: read # for actions/checkout
      id-token: write # for Scorecard to publish results
      security-events: write # for the SARIF upload to code scanning
    uses: open-telemetry/shared-workflows/.github/workflows/scorecard.yml@30362d425ab746bb2ec4647538ea9154591cce91 # v0.22.0

  workflow-notification:
    permissions:
      issues: write
    needs:
      - analysis
    if: always()
    uses: open-telemetry/shared-workflows/.github/workflows/workflow-failure-issue.yml@30362d425ab746bb2ec4647538ea9154591cce91 # v0.22.0
    with:
      success: ${{ needs.analysis.result == 'success' }}
