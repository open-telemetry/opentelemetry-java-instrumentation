name: Diagnose Windows smoke tests

on:
  push:
    branches:
      - trask-ci-failure-analysis-312
    paths:
      - .github/workflows/diagnose-windows-smoke.yml
      - .github/scripts/diagnose-windows-smoke.ps1

permissions:
  contents: read

jobs:
  diagnose:
    name: Payara (${{ matrix.mode }})
    runs-on: windows-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        mode:
          - parallel
    steps:
      - name: Support long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out failing revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3446195a6732f11ba587b75da4cdcc941822436d
          path: source
          persist-credentials: false

      - name: Free disk space
        working-directory: source
        run: .github/scripts/gha-free-disk-space.sh

      - name: Start Docker if needed
        run: |
          if ((Get-Service -Name docker).Status -ne "Running") {
            Start-Service -Name docker
          }

      - name: Set up JDK for running Gradle
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: source/.java-version

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build and diagnose
        working-directory: source
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          DIAGNOSTIC_MODE: ${{ matrix.mode }}
        run: |
          $env:JAVA_HOME = Split-Path (Split-Path (Get-Command java).Source)
          ./gradlew :smoke-tests:test -PsmokeTestSuite=none --no-daemon
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & "$env:GITHUB_WORKSPACE\.github\scripts\diagnose-windows-smoke.ps1" `
            -Mode $env:DIAGNOSTIC_MODE `
            -OutputDirectory "$env:GITHUB_WORKSPACE\diagnostics"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-smoke-${{ matrix.mode }}
          path: |
            diagnostics/
            source/build-scan.txt
            source/smoke-tests/build/test-results/testLimitedMatrix/
            source/smoke-tests/build/test-results/testAdditionalVariants/
          if-no-files-found: warn
          retention-days: 7
