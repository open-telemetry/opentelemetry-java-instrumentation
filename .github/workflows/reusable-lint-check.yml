name: Reusable - Lint check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed for merge-base used in modified-files mode
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Lint for pull requests
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          FLINT_NEW_FROM_REV: origin/${{ github.base_ref }}
        run: mise run lint

      - name: Lint for pushes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLINT_NEW_FROM_REV: ${{ github.event.before }}
        run: mise run lint

      - name: Lint all files
        if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.event.before == '0000000000000000000000000000000000000000')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLINT_FULL: "true"
        run: mise run lint
