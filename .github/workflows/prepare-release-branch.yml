name: Prepare release branch
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prereqs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify prerequisites
        run: |
          python .github/scripts/release-config.py prepare --ref "$GITHUB_REF_NAME"

          if ! grep --quiet "^## Unreleased$" CHANGELOG.md; then
            echo the change log is missing an \"Unreleased\" section
            exit 1
          fi

  create-pull-request-against-release-branch:
    runs-on: ubuntu-latest
    needs:
      - prereqs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # history is needed to allow fast-forward push below in case
          # re-running this workflow after merging additional PRs to the development branch
          fetch-depth: 0
          persist-credentials: false

      - name: Set release branch variables
        # Sets VERSION, DEVELOPMENT_BRANCH, RELEASE_BRANCH_NAME, and NEXT_VERSION.
        run: python .github/scripts/release-config.py prepare --ref "$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Update version
        run: .github/scripts/update-version.sh $VERSION

      - name: Update download link version
        run: |
          sed -Ei "s,https://github\.com/open-telemetry/opentelemetry-java-instrumentation/releases/(latest/download|download/v[0-9]+\.[0-9]+\.[0-9]+)/,https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v$VERSION/," README.md

      - name: Update the change log with the approximate release date
        run: |
          date=$(date "+%Y-%m-%d")
          .github/scripts/update-changelog-for-release.sh "$VERSION" "$date"

      - name: Use CLA approved bot
        run: .github/scripts/use-cla-approved-bot.sh

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: otelbot-token
        with:
          client-id: ${{ vars.OTELBOT_JAVA_INSTRUMENTATION_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_JAVA_INSTRUMENTATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create pull request against the release branch
        env:
          # pull requests from secrets.GITHUB_TOKEN do not run workflows
          GH_TOKEN: ${{ steps.otelbot-token.outputs.token }}
        run: |
          message="Prepare release $VERSION"
          branch="otelbot/prepare-release-${VERSION}"

          gh auth setup-git
          git push origin HEAD:$RELEASE_BRANCH_NAME
          git checkout -b $branch
          git commit -a -m "$message"
          git push --set-upstream origin $branch
          gh pr create \
            --title "[$RELEASE_BRANCH_NAME] $message" \
            --body "$message." \
            --base $RELEASE_BRANCH_NAME

  create-pull-request-against-development-branch:
    runs-on: ubuntu-latest
    needs:
      - prereqs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set environment variables
        # Sets VERSION, DEVELOPMENT_BRANCH, RELEASE_BRANCH_NAME, and NEXT_VERSION.
        run: python .github/scripts/release-config.py prepare --ref "$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Update version
        run: .github/scripts/update-version.sh $NEXT_VERSION

      - name: Update the change log on the development branch
        run: |
          # the actual release date will be updated at the end of the release workflow
          date=$(date "+%Y-%m-%d")
          .github/scripts/update-changelog-for-release.sh "$VERSION" "$date" --keep-unreleased-section

      - name: Use CLA approved bot
        run: .github/scripts/use-cla-approved-bot.sh

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: otelbot-token
        with:
          client-id: ${{ vars.OTELBOT_JAVA_INSTRUMENTATION_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_JAVA_INSTRUMENTATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create pull request against the development branch
        env:
          # pull requests from secrets.GITHUB_TOKEN do not run workflows
          GH_TOKEN: ${{ steps.otelbot-token.outputs.token }}
        run: |
          message="Update version to $NEXT_VERSION"
          body="Update version to \`$NEXT_VERSION\`."
          branch="otelbot/update-version-to-${NEXT_VERSION}"

          gh auth setup-git
          git checkout -b $branch
          git commit -a -m "$message"
          git push --set-upstream origin $branch
          gh pr create \
            --title "$message" \
            --body "$body" \
            --base "$DEVELOPMENT_BRANCH"
