name: Reusable - Muzzle

on:
  workflow_call:
    inputs:
      cache-read-only:
        type: boolean
        required: false
        default: true
      checkout-ref:
        type: string
        required: false
        default: ""
      tasks:
        type: string
        required: false
        default: '[":instrumentation:muzzle1", ":instrumentation:muzzle2", ":instrumentation:muzzle3", ":instrumentation:muzzle4"]'

permissions:
  contents: read

jobs:
  muzzle:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      matrix:
        task: ${{ fromJSON(inputs.tasks) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false

      - name: Free disk space
        run: .github/scripts/gha-free-disk-space.sh

      - name: Set up JDK for running Gradle
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ inputs.cache-read-only }}

      - name: Warm build scripts
        run: ./gradlew help --info --profile

      - name: Run muzzle
        env:
          MUZZLE_TASK: ${{ matrix.task }}
        run: ./gradlew "$MUZZLE_TASK" --info --profile

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: muzzle-profiles-${{ inputs.checkout-ref }}-${{ strategy.job-index }}
          path: build/reports/profile
          if-no-files-found: error
