name: PR review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number
  # zizmor: ignore[dangerous-triggers] Only main is checked out on comment runs.
  issue_comment:
    types: [created]
  # Temporary pre-merge smoke test. Remove this trigger and its PR number before merging.
  push:
    branches: [trask-pr-review-workflow]

permissions: {}

jobs:
  gate:
    if: >-
      github.repository == 'open-telemetry/opentelemetry-java-instrumentation' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request != null &&
        github.event.issue.state == 'open' &&
        github.event.comment.user.type == 'User' &&
        github.event.comment.body == '/review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pr_number: ${{ steps.gate.outputs.pr_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve PR number and check commenter's permission
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event_name == 'push' && '21335' || format('{0}', inputs.pr_number || github.event.issue.number) }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: python .github/scripts/pr-review/gate.py

  review:
    needs: gate
    if: needs.gate.outputs.pr_number != ''
    concurrency:
      group: pr-review-${{ needs.gate.outputs.pr_number }}-${{ github.event_name == 'push' && 'smoke' || 'live' }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # Allow for three passes, one verification retry, and sandbox setup and cleanup.
    timeout-minutes: 270
    permissions:
      contents: read
      pull-requests: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Copilot CLI
        run: |
          npm ci --prefix .github/scripts/copilot-cli
          echo "$GITHUB_WORKSPACE/.github/scripts/copilot-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - uses: github/gh-aw-firewall@d9272015d8523b4c9cf3b00ce26b507046cbf1a3 # v0.29.11
        id: firewall
        with:
          version: v0.29.11

      - name: Review, simplify, and double-check
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          AWF_IMAGE_TAG: ${{ steps.firewall.outputs.image-tag }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
        run: python .github/scripts/pr-review/review.py "$PR_NUMBER" prepare review-result.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        with:
          name: review-result
          path: review-result.json
          if-no-files-found: error
          retention-days: 7

  post:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    needs: [gate, review]
    environment: protected
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-result

      - name: Post the result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
        run: python .github/scripts/pr-review/review.py "$PR_NUMBER" post review-result.json
