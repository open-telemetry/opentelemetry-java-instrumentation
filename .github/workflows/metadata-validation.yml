name: Metadata Validation Check

on:
  pull_request:
    paths:
      - 'instrumentation-docs/**'
      - 'instrumentation/**/metadata.yaml'
      - '.github/scripts/instrumentations.sh'
      - '.github/scripts/metadata-ci-validate-tasks.sh'
      - '.github/workflows/metadata-update.yml'
      - '.github/workflows/metadata-validation.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test metadata collector
        run: bash instrumentation-docs/collect-test.sh

      - name: Set up JDK for running Gradle
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Run documentation analyzer
        run: ./gradlew :instrumentation-docs:runAnalysis

      - name: Validate instrumentation task list
        run: ./.github/scripts/metadata-ci-validate-tasks.sh
