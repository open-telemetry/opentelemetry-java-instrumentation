name: Metadata Validation Check

on:
  pull_request:
    paths:
      - 'instrumentation-docs/**'
      - 'instrumentation/**/metadata.yaml'
      - '.github/scripts/instrumentations.sh'
      - '.github/scripts/metadata-ci-validate-tasks.sh'
      - '.github/workflows/metadata-update.yml'
      - '.github/workflows/metadata-validation.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK for running Gradle
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Run documentation analyzer
        run: ./gradlew :instrumentation-docs:runAnalysis

      - name: Validate instrumentation task list
        run: ./.github/scripts/metadata-ci-validate-tasks.sh
