# Shared configuration definitions ("globals") for instrumentation metadata.
#
# These are configuration options that many instrumentations expose identically. Instead of
# hand-copying the full block into every instrumentation's metadata.yaml, a module references a
# definition by id:
#
#   configurations:
#     - ref: http.known-methods
#     - name: otel.instrumentation.my-module.specific   # module-specific configs stay inline
#       ...
#
# The doc generator resolves each `ref` against this file (see SharedConfigurationRegistry) and
# fails the build on an unknown id. The id is also used as the definition key in the generated
# docs/instrumentation-list.yaml `definitions.configurations` catalog, so keep ids stable.
configurations:
  http.known-methods:
    name: otel.instrumentation.http.known-methods
    declarative_name: java.common.http.known_methods
    description: "Configures the instrumentation to recognize an alternative set of HTTP request methods. All other methods will be treated as `_OTHER`."
    type: list
    default: "CONNECT,DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT,TRACE"

  common.peer-service-mapping:
    name: otel.instrumentation.common.peer-service-mapping
    declarative_name: java.common.service_peer_mapping
    description: "Used to specify a mapping from server addresses or configured targets to peer services. Configured targets containing commas or equals signs can only be mapped with declarative `service_peer_mapping`."
    type: map
    default: ""
    declarative_type: structured_list
    declarative_schema:
      type: object
      required:
        - peer
        - service_name
      properties:
        peer:
          type: string
          description: "Server address or configured target to match against."
          example: host
        service_name:
          type: string
          description: "Peer service name to record for matching peers."
          example: serviceName

  http.client.capture-request-headers:
    name: otel.instrumentation.http.client.capture-request-headers
    declarative_name: general.http.client.request_captured_headers
    description: "List of HTTP request headers to capture in HTTP client telemetry."
    type: list
    default: ""

  http.client.capture-response-headers:
    name: otel.instrumentation.http.client.capture-response-headers
    declarative_name: general.http.client.response_captured_headers
    description: "List of HTTP response headers to capture in HTTP client telemetry."
    type: list
    default: ""

  http.client.emit-experimental-telemetry:
    name: otel.instrumentation.http.client.emit-experimental-telemetry
    declarative_name: java.common.http.client.emit_experimental_telemetry/development
    description: "Enable the capture of experimental HTTP client telemetry. Adds the `http.request.body.size` and `http.response.body.size` attributes to spans, and records `http.client.request.body.size` and `http.client.response.body.size` metrics."
    type: boolean
    default: false

  http.server.capture-request-headers:
    name: otel.instrumentation.http.server.capture-request-headers
    declarative_name: general.http.server.request_captured_headers
    description: "List of HTTP request headers to capture in HTTP server telemetry."
    type: list
    default: ""

  http.server.capture-response-headers:
    name: otel.instrumentation.http.server.capture-response-headers
    declarative_name: general.http.server.response_captured_headers
    description: "List of HTTP response headers to capture in HTTP server telemetry."
    type: list
    default: ""

  http.server.emit-experimental-telemetry:
    name: otel.instrumentation.http.server.emit-experimental-telemetry
    declarative_name: java.common.http.server.emit_experimental_telemetry/development
    description: "Enable the capture of experimental HTTP server telemetry. Adds the `http.request.body.size` and `http.response.body.size` attributes to spans, and records `http.server.request.body.size` and `http.server.response.body.size` metrics."
    type: boolean
    default: false

  common.controller-telemetry.enabled:
    name: otel.instrumentation.common.controller-telemetry.enabled
    declarative_name: java.common.controller_telemetry.enabled
    description: "Enables the creation of experimental controller spans."
    type: boolean
    default: false

  common.deprecated-controller-telemetry.enabled:
    name: otel.instrumentation.common.experimental.controller-telemetry.enabled
    declarative_name: java.common.controller_telemetry/development.enabled
    description: "Deprecated: use `otel.instrumentation.common.controller-telemetry.enabled` instead. This setting is ignored under v3-preview and will be removed in 3.0."
    type: boolean
    default: false
    deprecated: true
    replaced_by: otel.instrumentation.common.controller-telemetry.enabled

  sanitization.url.sensitive-query-parameters:
    name: otel.instrumentation.sanitization.url.experimental.sensitive-query-parameters
    declarative_name: general.sanitization.url.sensitive_query_parameters
    description: "List of URL query parameter names whose values are redacted in URL attributes. See https://opentelemetry.io/docs/specs/semconv/http/http-spans."
    type: list
    default: "AWSAccessKeyId,Signature,X-Amz-Signature,X-Amz-Credential,X-Amz-Security-Token,sig,X-Goog-Signature"

  common.db.query-sanitization.enabled:
    name: otel.instrumentation.common.db.query-sanitization.enabled
    declarative_name: java.common.db.query_sanitization.enabled
    description: "Enables query sanitization for database queries."
    type: boolean
    default: true

  common.db.sqlcommenter.enabled:
    name: otel.instrumentation.common.db.experimental.sqlcommenter.enabled
    declarative_name: java.common.db.sqlcommenter/development.enabled
    description: >
      Enables augmenting queries with a comment containing tracing information. An
      instrumentation-specific setting takes precedence. See
      [sqlcommenter](https://google.github.io/sqlcommenter/) for more info. WARNING: augmenting
      queries with tracing context will make query texts unique, which may have adverse impact on
      database performance.
    type: boolean
    default: false

  messaging.headers.included:
    name: otel.instrumentation.common.messaging.headers.included
    declarative_name: java.common.messaging.headers.included
    description: "A comma-separated list of case-sensitive message header name glob patterns to capture as span attributes. `?` matches one character and `*` matches zero or more characters. Excluded patterns take precedence over included patterns. An absent or empty selector captures no headers; an exclude-only selector captures every header not excluded."
    type: list
    default: ""

  messaging.headers.excluded:
    name: otel.instrumentation.common.messaging.headers.excluded
    declarative_name: java.common.messaging.headers.excluded
    description: "A comma-separated list of case-sensitive message header name glob patterns to exclude from span attributes. `?` matches one character and `*` matches zero or more characters. Excluded patterns take precedence over included patterns. An absent or empty selector captures no headers; an exclude-only selector captures every header not excluded, which may expose sensitive information."
    type: list
    default: ""

  messaging.capture-headers:
    name: otel.instrumentation.messaging.experimental.capture-headers
    declarative_name: java.common.messaging.capture_headers/development
    description: "Deprecated: use `otel.instrumentation.common.messaging.headers.included` instead. Ignored without a warning under v3-preview; may be removed in a later minor release and will be removed no later than 3.0. A comma-separated list of header names to capture as span attributes. It does not support glob patterns: an entry containing `*` or `?` is ignored with a warning, and every other entry is matched as a literal header name."
    type: list
    default: ""
    deprecated: true
    replaced_by: otel.instrumentation.common.messaging.headers.included

  # The deprecated names below are flat properties only: the declarative configuration schema keeps
  # them under `java.common.messaging`, so they declare no declarative_name.
  messaging.deprecated-headers.included:
    name: otel.instrumentation.messaging.experimental.headers.included
    description: "Deprecated: use `otel.instrumentation.common.messaging.headers.included` instead. Ignored without a warning under v3-preview; may be removed in a later minor release and will be removed no later than 3.0."
    type: list
    default: ""
    deprecated: true
    replaced_by: otel.instrumentation.common.messaging.headers.included

  messaging.deprecated-headers.excluded:
    name: otel.instrumentation.messaging.experimental.headers.excluded
    description: "Deprecated: use `otel.instrumentation.common.messaging.headers.excluded` instead. Ignored without a warning under v3-preview; may be removed in a later minor release and will be removed no later than 3.0."
    type: list
    default: ""
    deprecated: true
    replaced_by: otel.instrumentation.common.messaging.headers.excluded

  messaging.deprecated-receive-telemetry.enabled:
    name: otel.instrumentation.messaging.experimental.receive-telemetry.enabled
    description: "Deprecated: use `otel.instrumentation.common.messaging.experimental.receive-telemetry.enabled` instead. It may be removed in the next minor release."
    type: boolean
    default: false
    deprecated: true
    replaced_by: otel.instrumentation.common.messaging.experimental.receive-telemetry.enabled

  messaging.batch-send.message-creation-spans.enabled:
    name: otel.instrumentation.common.messaging.message-create-spans.enabled
    declarative_name: java.common.messaging.message_create_spans.enabled
    description: "Provides the default for whether to create a producer span for each eligible message in a batch send. An instrumentation-specific setting takes precedence."
    type: boolean
    default: true

  # Deprecated aliases of the common database settings above, resolved by the same helper.
  common.db-statement-sanitizer.enabled:
    name: otel.instrumentation.common.db-statement-sanitizer.enabled
    description: "Deprecated: use `otel.instrumentation.common.db.query-sanitization.enabled` instead. It is ignored under v3 preview and will be removed in 3.0."
    type: boolean
    default: true
    deprecated: true
    replaced_by: otel.instrumentation.common.db.query-sanitization.enabled

  # This one and the next were never regular (non-declarative) configuration property names.
  common.database.statement_sanitizer.enabled:
    declarative_name: java.common.database.statement_sanitizer.enabled
    description: "Deprecated: use `java.common.db.query_sanitization.enabled` instead. It is ignored under v3 preview."
    type: boolean
    default: true
    deprecated: true
    replaced_by: java.common.db.query_sanitization.enabled

  common.database.sqlcommenter.enabled:
    declarative_name: java.common.database.sqlcommenter/development.enabled
    description: "Deprecated: use `java.common.db.sqlcommenter/development.enabled` instead. It is ignored under v3 preview."
    type: boolean
    default: false
    deprecated: true
    replaced_by: java.common.db.sqlcommenter/development.enabled

  common.logging.trace-id-key:
    name: otel.instrumentation.common.logging.trace-id-key
    declarative_name: java.common.logging.trace_id_key
    description: "Specifies the key name used to store the trace ID in the logging context."
    type: string
    default: trace_id

  common.logging.span-id-key:
    name: otel.instrumentation.common.logging.span-id-key
    declarative_name: java.common.logging.span_id_key
    description: "Specifies the key name used to store the span ID in the logging context."
    type: string
    default: span_id

  common.logging.trace-flags-key:
    name: otel.instrumentation.common.logging.trace-flags-key
    declarative_name: java.common.logging.trace_flags_key
    description: "Specifies the key name used to store the trace flags in the logging context."
    type: string
    default: trace_flags

# Global configurations are read by the agent or the instrumentation API itself, on behalf of every
# instrumentation rather than any particular one, so no module's metadata.yaml declares them and
# modules must not `ref` them. A setting that is read on behalf of specific instrumentations (even by
# a shared helper) belongs in `configurations` above, referenced by each of those modules.
#
# An entry without a `default` falls back to another setting when unset. Such entries, and deprecated
# ones, are left out of docs/declarative-configuration-example.yaml, because merely setting them there
# would change behavior.
global_configurations:
  common.v3-preview:
    name: otel.instrumentation.common.v3-preview
    declarative_name: java.common.v3_preview
    description: "Enables a preview of the behavior planned for version 3.0 of the agent, such as ignoring deprecated settings. The set of changes it enables can grow in any release."
    type: boolean
    default: false

  semconv-stability.opt-in:
    name: otel.semconv-stability.opt-in
    declarative_name: general.stability_opt_in_list
    description: "A comma-separated list of semantic convention groups to opt into, such as `rpc` and `service.peer`. Use `<group>/dup` to emit both old and new conventions. Under v3 preview the preview groups use `otel.semconv-stability.preview` instead."
    type: list
    declarative_type: string
    default: ""

  semconv-stability.preview:
    name: otel.semconv-stability.preview
    declarative_name: java.common.semconv_stability.preview
    description: "Opt-in to emit preview (not yet stable) semantic conventions for the `rpc` and `service.peer` groups. Use `<group>/dup` to emit both the old and the preview conventions simultaneously. Outside v3 preview these groups are also accepted by `otel.semconv-stability.opt-in`; under v3 preview only this setting selects them. The flat `otel.semconv-stability.preview` property is read only from system properties and environment variables, not from the agent configuration file."
    type: list

  semconv-exception.signal.preview:
    name: otel.semconv.exception.signal.preview
    declarative_name: general.semconv_exception.signal.preview
    description: "Preview of emitting exceptions as log records instead of span events. `logs` emits log records only and `logs/dup` emits both log records and span events. When unset, exceptions are recorded as span events."
    type: string

  span-suppression-strategy:
    name: otel.instrumentation.common.span-suppression-strategy
    declarative_name: java.common.span_suppression_strategy
    description: "Strategy for suppressing nested instrumentation spans: `semconv` suppresses a span nested in a span of the same semantic convention type, `span-kind` suppresses a span nested in a span of the same span kind, and `none` disables suppression."
    type: string
    default: semconv

  span-suppression-strategy.deprecated:
    name: otel.instrumentation.experimental.span-suppression-strategy
    declarative_name: java.common.span_suppression_strategy/development
    description: "Deprecated: use `otel.instrumentation.common.span-suppression-strategy` or `java.common.span_suppression_strategy` instead. This setting will be removed in 3.0."
    type: string
    deprecated: true
    replaced_by: otel.instrumentation.common.span-suppression-strategy

  rpc.semconv.version:
    declarative_name: general.rpc.semconv.version
    description: "RPC semantic convention version to emit: `0` for the current conventions or `1` together with `experimental: true` for the preview conventions. Takes precedence over the semantic convention opt-in settings; when unset, those settings select the conventions."
    type: int

  rpc.semconv.experimental:
    declarative_name: general.rpc.semconv.experimental
    description: "With `version: 1`, selects the preview RPC semantic conventions. Required, because version 1 of the RPC semantic conventions is not yet stable."
    type: boolean
    default: false

  rpc.semconv.dual_emit:
    declarative_name: general.rpc.semconv.dual_emit
    description: "With `version: 1` and `experimental: true`, emits both the current and the preview RPC semantic conventions."
    type: boolean
    default: false

  semconv-stability.opt-in.deprecated-declarative-name:
    declarative_name: general.semconv_stability.opt_in
    description: "Deprecated: use `general.stability_opt_in_list` instead. It is ignored when `general.stability_opt_in_list` is configured."
    type: list
    default: ""
    deprecated: true
    replaced_by: general.stability_opt_in_list
