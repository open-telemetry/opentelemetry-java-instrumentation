# Shared configuration definitions ("globals") for instrumentation metadata.
#
# These are configuration options that many instrumentations expose identically. Instead of
# hand-copying the full block into every instrumentation's metadata.yaml, a module references a
# definition by id:
#
#   configurations:
#     - ref: http.known-methods
#     - name: otel.instrumentation.my-module.specific   # module-specific configs stay inline
#       ...
#
# The doc generator resolves each `ref` against this file (see SharedConfigurationRegistry) and
# fails the build on an unknown id. The id is also used as the definition key in the generated
# docs/instrumentation-list.yaml `definitions.configurations` catalog, so keep ids stable.
configurations:
  http.known-methods:
    name: otel.instrumentation.http.known-methods
    declarative_name: java.common.http.known_methods
    description: "Configures the instrumentation to recognize an alternative set of HTTP request methods. All other methods will be treated as `_OTHER`."
    type: list
    default: "CONNECT,DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT,TRACE"

  common.peer-service-mapping:
    name: otel.instrumentation.common.peer-service-mapping
    declarative_name: java.common.service_peer_mapping
    description: "Used to specify a mapping from server addresses or configured targets to peer services. Configured targets containing commas or equals signs can only be mapped with declarative `service_peer_mapping`."
    type: map
    default: ""
    declarative_type: structured_list
    declarative_schema:
      type: object
      required:
        - peer
        - service_name
      properties:
        peer:
          type: string
          description: "Server address or configured target to match against."
          example: host
        service_name:
          type: string
          description: "Peer service name to record for matching peers."
          example: serviceName

  http.client.capture-request-headers:
    name: otel.instrumentation.http.client.capture-request-headers
    declarative_name: general.http.client.request_captured_headers
    description: "List of HTTP request headers to capture in HTTP client telemetry."
    type: list
    default: ""

  http.client.capture-response-headers:
    name: otel.instrumentation.http.client.capture-response-headers
    declarative_name: general.http.client.response_captured_headers
    description: "List of HTTP response headers to capture in HTTP client telemetry."
    type: list
    default: ""

  http.client.emit-experimental-telemetry:
    name: otel.instrumentation.http.client.emit-experimental-telemetry
    declarative_name: java.common.http.client.emit_experimental_telemetry/development
    description: "Enable the capture of experimental HTTP client telemetry. Adds the `http.request.body.size` and `http.response.body.size` attributes to spans, and records `http.client.request.body.size` and `http.client.response.body.size` metrics."
    type: boolean
    default: false

  http.server.capture-request-headers:
    name: otel.instrumentation.http.server.capture-request-headers
    declarative_name: general.http.server.request_captured_headers
    description: "List of HTTP request headers to capture in HTTP server telemetry."
    type: list
    default: ""

  http.server.capture-response-headers:
    name: otel.instrumentation.http.server.capture-response-headers
    declarative_name: general.http.server.response_captured_headers
    description: "List of HTTP response headers to capture in HTTP server telemetry."
    type: list
    default: ""

  http.server.emit-experimental-telemetry:
    name: otel.instrumentation.http.server.emit-experimental-telemetry
    declarative_name: java.common.http.server.emit_experimental_telemetry/development
    description: "Enable the capture of experimental HTTP server telemetry. Adds the `http.request.body.size` and `http.response.body.size` attributes to spans, and records `http.server.request.body.size` and `http.server.response.body.size` metrics."
    type: boolean
    default: false

  common.controller-telemetry.enabled:
    name: otel.instrumentation.common.experimental.controller-telemetry.enabled
    declarative_name: java.common.controller_telemetry/development.enabled
    description: "Enables the creation of experimental controller spans."
    type: boolean
    default: false

  sanitization.url.sensitive-query-parameters:
    name: otel.instrumentation.sanitization.url.experimental.sensitive-query-parameters
    declarative_name: general.sanitization.url.sensitive_query_parameters
    description: "List of URL query parameter names whose values are redacted in URL attributes. See https://opentelemetry.io/docs/specs/semconv/http/http-spans."
    type: list
    default: "AWSAccessKeyId,Signature,X-Amz-Signature,X-Amz-Credential,X-Amz-Security-Token,sig,X-Goog-Signature"

  common.db.query-sanitization.enabled:
    name: otel.instrumentation.common.db.query-sanitization.enabled
    declarative_name: java.common.db.query_sanitization.enabled
    description: "Enables query sanitization for database queries."
    type: boolean
    default: true

  messaging.headers.included:
    name: otel.instrumentation.common.messaging.experimental.headers.included
    declarative_name: java.common.messaging.headers/development.included
    description: "A comma-separated list of message header name patterns to capture as span attributes. Matching is case-sensitive. `?` matches one character and `*` matches zero or more characters."
    type: list
    default: ""

  messaging.headers.excluded:
    name: otel.instrumentation.common.messaging.experimental.headers.excluded
    declarative_name: java.common.messaging.headers/development.excluded
    description: "A comma-separated list of message header name patterns to exclude from span attributes. Excluded patterns take precedence over included patterns. Matching is case-sensitive. `?` matches one character and `*` matches zero or more characters. If included is not configured, all non-excluded headers are captured, which may expose sensitive information."
    type: list
    default: ""

  messaging.capture-headers:
    name: otel.instrumentation.messaging.experimental.capture-headers
    declarative_name: java.common.messaging.capture_headers/development
    description: "Deprecated: use `otel.instrumentation.common.messaging.experimental.headers.included` instead. A comma-separated list of header names to capture as span attributes. It does not support glob patterns: an entry containing `*` or `?` is ignored with a warning, and every other entry is matched as a literal header name."
    type: list
    default: ""
    deprecated: true
    replaced_by: otel.instrumentation.common.messaging.experimental.headers.included

  # The deprecated names below are flat properties only: the declarative configuration schema keeps
  # them under `java.common.messaging`, so they declare no declarative_name.
  messaging.deprecated-headers.included:
    name: otel.instrumentation.messaging.experimental.headers.included
    description: "Deprecated: use `otel.instrumentation.common.messaging.experimental.headers.included` instead. It may be removed in the next minor release."
    type: list
    default: ""
    deprecated: true
    replaced_by: otel.instrumentation.common.messaging.experimental.headers.included

  messaging.deprecated-headers.excluded:
    name: otel.instrumentation.messaging.experimental.headers.excluded
    description: "Deprecated: use `otel.instrumentation.common.messaging.experimental.headers.excluded` instead. It may be removed in the next minor release."
    type: list
    default: ""
    deprecated: true
    replaced_by: otel.instrumentation.common.messaging.experimental.headers.excluded

  messaging.deprecated-receive-telemetry.enabled:
    name: otel.instrumentation.messaging.experimental.receive-telemetry.enabled
    description: "Deprecated: use `otel.instrumentation.common.messaging.experimental.receive-telemetry.enabled` instead. It may be removed in the next minor release."
    type: boolean
    default: false
    deprecated: true
    replaced_by: otel.instrumentation.common.messaging.experimental.receive-telemetry.enabled

  messaging.batch-send.message-creation-spans.enabled:
    name: otel.instrumentation.common.messaging.message-create-spans.enabled
    declarative_name: java.common.messaging.message_create_spans.enabled
    description: "Provides the default for whether to create a producer span for each eligible message in a batch send when stable messaging semantic conventions are enabled. An instrumentation-specific setting takes precedence."
    type: boolean
    default: true

  common.db.sqlcommenter.enabled:
    name: otel.instrumentation.common.db.experimental.sqlcommenter.enabled
    declarative_name: java.common.db.sqlcommenter/development.enabled
    description: "Provides the default for whether to augment database queries with a comment containing the tracing information. See [sqlcommenter](https://google.github.io/sqlcommenter/) for more info. An instrumentation-specific setting takes precedence. WARNING: augmenting queries with tracing context will make query texts unique, which may have adverse impact on database performance."
    type: boolean
    default: false

  # Deprecated aliases of the common database settings above, resolved by the same helper.
  common.db-statement-sanitizer.enabled:
    name: otel.instrumentation.common.db-statement-sanitizer.enabled
    description: "Deprecated: use `otel.instrumentation.common.db.query-sanitization.enabled` instead. It is ignored under v3 preview and will be removed in 3.0."
    type: boolean
    default: true
    deprecated: true
    replaced_by: otel.instrumentation.common.db.query-sanitization.enabled

  # This one and the next were never regular (non-declarative) configuration property names.
  common.database.statement_sanitizer.enabled:
    declarative_name: java.common.database.statement_sanitizer.enabled
    description: "Deprecated: use `java.common.db.query_sanitization.enabled` instead. It is ignored under v3 preview."
    type: boolean
    default: true
    deprecated: true
    replaced_by: java.common.db.query_sanitization.enabled

  common.database.sqlcommenter.enabled:
    declarative_name: java.common.database.sqlcommenter/development.enabled
    description: "Deprecated: use `java.common.db.sqlcommenter/development.enabled` instead. It is ignored under v3 preview."
    type: boolean
    default: false
    deprecated: true
    replaced_by: java.common.db.sqlcommenter/development.enabled

  common.logging.trace-id-key:
    name: otel.instrumentation.common.logging.trace-id-key
    declarative_name: java.common.logging.trace_id_key
    description: "Specifies the key name used to store the trace ID in the logging context."
    type: string
    default: trace_id

  common.logging.span-id-key:
    name: otel.instrumentation.common.logging.span-id-key
    declarative_name: java.common.logging.span_id_key
    description: "Specifies the key name used to store the span ID in the logging context."
    type: string
    default: span_id

  common.logging.trace-flags-key:
    name: otel.instrumentation.common.logging.trace-flags-key
    declarative_name: java.common.logging.trace_flags_key
    description: "Specifies the key name used to store the trace flags in the logging context."
    type: string
    default: trace_flags

  common.logging.trace-id:
    name: otel.instrumentation.common.logging.trace-id
    declarative_name: java.common.logging.trace_id
    description: "Deprecated: use `otel.instrumentation.common.logging.trace-id-key` instead. It is ignored under v3 preview and will be removed in 3.0."
    type: string
    default: trace_id
    deprecated: true
    replaced_by: otel.instrumentation.common.logging.trace-id-key

  common.logging.span-id:
    name: otel.instrumentation.common.logging.span-id
    declarative_name: java.common.logging.span_id
    description: "Deprecated: use `otel.instrumentation.common.logging.span-id-key` instead. It is ignored under v3 preview and will be removed in 3.0."
    type: string
    default: span_id
    deprecated: true
    replaced_by: otel.instrumentation.common.logging.span-id-key

  common.logging.trace-flags:
    name: otel.instrumentation.common.logging.trace-flags
    declarative_name: java.common.logging.trace_flags
    description: "Deprecated: use `otel.instrumentation.common.logging.trace-flags-key` instead. It is ignored under v3 preview and will be removed in 3.0."
    type: string
    default: trace_flags
    deprecated: true
    replaced_by: otel.instrumentation.common.logging.trace-flags-key
