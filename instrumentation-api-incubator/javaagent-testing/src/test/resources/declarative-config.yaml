file_format: "1.1"
propagator:
  composite_list: "tracecontext"
instrumentation/development:
  java:
    common:
      http:
        client:
          emit_experimental_telemetry/development: true
          url_template_rules:
            - pattern: "http://localhost:.*/not-a-match"
              template: "/not-a-match"
            - pattern: "http://localhost:.*/hello/.*"
              template: "/hello/*"
            - pattern: "http://localhost:.*/hello/.*"
              template: "/later-match"
