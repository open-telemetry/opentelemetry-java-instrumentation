import groovy.json.JsonOutput
import org.gradle.internal.operations.BuildOperationDescriptor
import org.gradle.internal.operations.BuildOperationListener
import org.gradle.internal.operations.BuildOperationListenerManager
import org.gradle.internal.operations.OperationFinishEvent
import org.gradle.internal.operations.OperationIdentifier
import org.gradle.internal.operations.OperationProgressEvent
import org.gradle.internal.operations.OperationStartEvent

if (gradle.parent == null) {
  def output = System.getProperty("muzzle.profile.output")
  if (!output) {
    throw new GradleException("muzzle.profile.output is required")
  }
  def file = new File(output)
  file.parentFile.mkdirs()
  def writer = new PrintWriter(new BufferedWriter(new OutputStreamWriter(
    new FileOutputStream(file), java.nio.charset.StandardCharsets.UTF_8)), true)
  def starts = new java.util.concurrent.ConcurrentHashMap()
  def listener = new BuildOperationListener() {
    void started(BuildOperationDescriptor operation, OperationStartEvent event) {
      starts.put(operation.id, event.startTime)
    }

    void progress(OperationIdentifier id, OperationProgressEvent event) {
    }

    void finished(BuildOperationDescriptor operation, OperationFinishEvent event) {
      def start = starts.remove(operation.id)
      if (start == null) {
        return
      }
      def details = operation.details
      def types = details == null ? [] : details.class.interfaces.collect { it.name }
      def name = operation.displayName
      def category = null
      if (types.any { it.contains("ExternalResourceRead") }) {
        category = "transfer"
      } else if (name.startsWith("Resolve dependencies ") || name.startsWith("Resolve files ") ||
        name.startsWith("Resolve artifacts ")) {
        category = "resolution"
      } else if (types.any { it.contains("ExecuteTaskBuildOperationType") }) {
        category = name.contains("muzzle-Assert") ? "assertion" : "task"
      } else if (name.startsWith("Configure ") || name.contains("projectsEvaluated") ||
        name.startsWith("Notify projects evaluated")) {
        category = "configuration"
      }
      if (category == null) {
        return
      }
      def record = [
        id: operation.id.toString(), parent: operation.parentId?.toString(),
        start: start, end: event.endTime, category: category, name: name,
        types: types, failure: event.failure?.class?.name
      ]
      if (category == "transfer") {
        record.failureCauses = []
        def cause = event.failure
        while (cause != null && record.failureCauses.size() < 10) {
          record.failureCauses.add(cause.class.name)
          if (cause.metaClass.respondsTo(cause, "getStatusCode")) {
            record.httpStatus = cause.statusCode
          }
          cause = cause.cause
        }
        if (details.metaClass.respondsTo(details, "getLocation")) {
          def uri = new URI(details.location.toString())
          record.location = new URI(uri.scheme, null, uri.host, uri.port, uri.path, null, null).toString()
        }
        def result = event.result
        if (result != null && result.metaClass.respondsTo(result, "getBytesRead")) {
          record.bytes = result.bytesRead
        }
        if (result != null && result.metaClass.respondsTo(result, "isMissing")) {
          record.missing = result.missing
        }
      }
      synchronized (writer) {
        writer.println(JsonOutput.toJson(record))
        if (writer.checkError()) {
          throw new GradleException("Unable to write the Muzzle operation profile")
        }
      }
    }
  }
  gradle.services.get(BuildOperationListenerManager).addListener(listener)
  Runtime.runtime.addShutdownHook(new Thread({ writer.close() } as Runnable))
}
