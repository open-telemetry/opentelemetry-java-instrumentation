settingsEvaluated { settings ->
  def remote = settings.buildCache.remote
  if (remote != null) {
    remote.push = false
  }
  if (settings.gradle.parent == null) {
    if (remote == null || !remote.enabled) {
      throw new GradleException("The CI benchmark requires remote cache reads")
    }
    println("MUZZLE_BENCHMARK_REMOTE enabled=${remote.enabled} push=${remote.push}")
    println("MUZZLE_BENCHMARK_CONFIGURATION_CACHE requested=${settings.gradle.startParameter.configurationCacheRequested}")
    println("MUZZLE_BENCHMARK_HTTP_CONNECTION_TTL ${System.getProperty('org.gradle.internal.http.idleConnectionTimeout', 'unset')}")
    println("MUZZLE_BENCHMARK_DISCOVER_ALL ${settings.gradle.startParameter.projectProperties.getOrDefault('muzzleBenchmarkDiscoverAll', 'false')}")
    settings.gradle.taskGraph.whenReady {
      println("MUZZLE_BENCHMARK_TASK_GRAPH ${System.currentTimeMillis()}")
    }
  }
}
