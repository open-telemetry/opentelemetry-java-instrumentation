file_format: 1.1

tracer_provider:
  processors:
    - batch:
        schedule_delay: 10
        max_export_batch_size: 1
        exporter:
          otlp_http:
            endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/traces

# add extra resource attributes to verify that declarative config is picked up
resource:
  detection/development:
    detectors:
      - container:
      - host:
      - process:
  attributes:
    - name: service.name
      value: declarative-config-smoke-test

distribution:
  javaagent:
    instrumentation:
      default_enabled: false
      enabled:
        - tomcat
