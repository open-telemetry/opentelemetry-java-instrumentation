display_name: Apache RocketMQ Client - Remoting Protocol
description: >
  This instrumentation enables messaging spans for Apache RocketMQ message producers and consumers
  using the Remoting Protocol.
semantic_conventions:
  - MESSAGING_SPANS
library_link: https://rocketmq.apache.org/
configurations:
  - name: otel.instrumentation.rocketmq-client.message-create-spans.enabled
    declarative_name: java.rocketmq_client.message_create_spans.enabled
    description: >
      Enables per-message Create spans for batch sends.
      Overrides the common messaging setting. Disabling this retains Send spans and
      context propagation and does not affect single-message sends.
    type: boolean
    default: true
  - ref: messaging.batch-send.message-creation-spans.enabled
  - ref: messaging.headers.included
  - ref: messaging.headers.excluded
  - name: otel.instrumentation.rocketmq-client.experimental-span-attributes
    declarative_name: java.rocketmq_client.experimental_span_attributes/development
    description: >
      Enables capturing experimental span attributes `rocketmq.message.tag`,
      `rocketmq.broker_address`, `rocketmq.send_result`,
      `rocketmq.queue_id`, and `rocketmq.queue_offset`.
    type: boolean
    default: false
