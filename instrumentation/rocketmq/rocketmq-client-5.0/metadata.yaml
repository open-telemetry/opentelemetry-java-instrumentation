display_name: Apache RocketMQ Client - gRPC Protocol
description: >
  This instrumentation enables messaging spans for Apache RocketMQ message producers and consumers
  using the gRPC/Protobuf Protocol.
semantic_conventions:
  - MESSAGING_SPANS
library_link: https://rocketmq.apache.org/
configurations:
  - name: otel.instrumentation.messaging.experimental.receive-spans.enabled
    declarative_name: java.common.messaging.receive_spans/development.enabled
    description: >
      Enables experimental receive spans, which will cause consumers to start a new trace, with
      only a span link connecting it to the producer trace.
    type: boolean
    default: false
  - ref: messaging.capture-headers
