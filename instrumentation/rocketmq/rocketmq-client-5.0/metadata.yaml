display_name: Apache RocketMQ Client - gRPC Protocol
description: >
  This instrumentation enables messaging spans for Apache RocketMQ message producers and consumers
  using the gRPC/Protobuf Protocol.
semantic_conventions:
  - MESSAGING_SPANS
library_link: https://rocketmq.apache.org/
configurations:
  - name: otel.instrumentation.rocketmq-client.experimental-span-attributes
    declarative_name: java.rocketmq_client.experimental_span_attributes/development
    description: >
      Enables capturing experimental attributes `rocketmq.message.lite_topic` and
      `rocketmq.message.priority` on messaging spans and receive-span links.
    type: boolean
    default: false
  - name: otel.instrumentation.common.messaging.experimental.receive-telemetry.enabled
    declarative_name: java.common.messaging.receive_telemetry/development.enabled
    description: >
      Enables experimental receive telemetry, which will cause consumers to start a new trace, with
      only a span link connecting it to the producer trace.
    type: boolean
    default: false
  - ref: messaging.headers.included
  - ref: messaging.headers.excluded
