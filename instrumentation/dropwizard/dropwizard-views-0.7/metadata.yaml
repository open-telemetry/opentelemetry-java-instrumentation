display_name: Dropwizard Views
description: >
  This instrumentation enables view spans for Dropwizard view template rendering
  (view spans are disabled by default).
features:
  - VIEW_SPANS
library_link: https://www.dropwizard.io/en/latest/manual/views.html
configurations:
  - name: otel.instrumentation.common.view-telemetry.enabled
    declarative_name: java.common.view_telemetry.enabled
    description: Enables the creation of experimental view spans.
    type: boolean
    default: false
  - name: otel.instrumentation.common.experimental.view-telemetry.enabled
    declarative_name: java.common.view_telemetry/development.enabled
    description: >
      Deprecated: use `otel.instrumentation.common.view-telemetry.enabled` instead. This setting
      is ignored under v3-preview and will be removed in 3.0.
    type: boolean
    default: false
    deprecated: true
    replaced_by: otel.instrumentation.common.view-telemetry.enabled
