description: >
  This instrumentation enables context propagation for Kotlin coroutines and, for Kotlin Flow
  (starting with version 1.3.0), completes spans of Flow-returning methods asynchronously. The
  separate `kotlinx-coroutines-annotations` instrumentation supports @WithSpan annotations
  on Kotlin suspend functions and is disabled by default.
display_name: Kotlin Coroutines
features:
  - CONTEXT_PROPAGATION
library_link: https://github.com/Kotlin/kotlinx.coroutines
