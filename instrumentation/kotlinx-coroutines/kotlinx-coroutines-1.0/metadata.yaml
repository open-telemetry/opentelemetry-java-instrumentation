description: >
  This instrumentation enables context propagation for Kotlin coroutines. The separate
  `kotlinx-coroutines-annotations` instrumentation supports @WithSpan annotations on Kotlin suspend
  functions and, starting with version 1.3.0, methods returning Kotlin Flow.
display_name: Kotlin Coroutines
features:
  - CONTEXT_PROPAGATION
library_link: https://github.com/Kotlin/kotlinx.coroutines
