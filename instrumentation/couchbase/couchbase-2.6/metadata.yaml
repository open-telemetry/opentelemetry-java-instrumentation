display_name: Couchbase Client
description: >
  This instrumentation enables database client spans and database client metrics for Couchbase 2.6
  operations. It automatically traces key-value operations (get, upsert, replace, remove), view
  queries, N1QL queries, and cluster management operations.
semantic_conventions:
  - DATABASE_CLIENT_SPANS
  - DATABASE_CLIENT_METRICS
library_link: https://github.com/couchbase/couchbase-java-client
configurations:
  - name: otel.instrumentation.couchbase.emit-experimental-telemetry
    declarative_name: java.couchbase.emit_experimental_telemetry/development
    description: >
      Enables experimental span attributes `couchbase.operation_id` and `couchbase.local.address`.
      Different operation types receive different experimental attributes.
    type: boolean
    default: false
  - name: otel.instrumentation.couchbase.experimental-span-attributes
    declarative_name: java.couchbase.experimental_span_attributes/development
    description: >
      Deprecated and will be removed in the next minor release. Use
      otel.instrumentation.couchbase.emit-experimental-telemetry instead.
    type: boolean
    default: false
    deprecated: true
    replaced_by: otel.instrumentation.couchbase.emit-experimental-telemetry
  - name: otel.instrumentation.couchbase.query-sanitization.enabled
    declarative_name: java.couchbase.query_sanitization.enabled
    description: >
      Enables query sanitization for Couchbase queries. Overrides
      `otel.instrumentation.common.db.query-sanitization.enabled` for this instrumentation; when
      unset, that setting applies.
    type: boolean
  - ref: common.db.query-sanitization.enabled
  - ref: common.db-statement-sanitizer.enabled
  - ref: common.database.statement_sanitizer.enabled
  - name: otel.instrumentation.couchbase.statement-sanitizer.enabled
    declarative_name: java.couchbase.statement_sanitizer.enabled
    description: "Deprecated: use `otel.instrumentation.couchbase.query-sanitization.enabled` instead. It is ignored under v3 preview and will be removed in 3.0."
    type: boolean
    default: true
    deprecated: true
    replaced_by: otel.instrumentation.couchbase.query-sanitization.enabled
