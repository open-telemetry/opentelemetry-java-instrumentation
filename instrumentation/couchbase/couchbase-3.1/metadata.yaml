display_name: Couchbase Client
description: >
  This instrumentation uses the Couchbase tracing SPI to create database client spans for Couchbase
  Java SDK 3.1.
semantic_conventions:
  - DATABASE_CLIENT_SPANS
library_link: https://github.com/couchbase/couchbase-java-client
configurations:
  - name: otel.instrumentation.couchbase.emit-experimental-telemetry
    declarative_name: java.couchbase.emit_experimental_telemetry/development
    description: >
      When v3 preview is enabled, enables experimental spans and span attributes emitted from the
      underlying Couchbase library. This setting has no effect outside v3 preview.
    type: boolean
    default: false
  - name: otel.instrumentation.couchbase.experimental-span-attributes
    declarative_name: java.couchbase.experimental_span_attributes/development
    description: >
      Deprecated for Couchbase 3.x and will be removed in the next minor release. Outside v3
      preview, enables experimental span attributes emitted from the underlying Couchbase library.
      Under v3 preview, this setting is ignored; use
      otel.instrumentation.couchbase.emit-experimental-telemetry instead.
    type: boolean
    default: false
