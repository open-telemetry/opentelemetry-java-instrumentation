description: >
  This instrumentation bridges Logback log events to OpenTelemetry logs.
display_name: Logback
library_link: https://logback.qos.ch/
features:
  - LOGGING_BRIDGE
configurations:
  - name: otel.instrumentation.logback-appender.experimental-log-attributes
    declarative_name: java.logback_appender.experimental_log_attributes/development
    description: >
      Enables the capture of experimental log attributes, including thread name and thread ID.
    type: boolean
    default: false
  - name: otel.instrumentation.logback-appender.experimental.capture-code-attributes
    declarative_name: java.logback_appender.capture_code_attributes/development
    description: >
      Enables the capture of code location attributes, including file path, class name, method
      name, and line number.
    type: boolean
    default: false
  - name: otel.instrumentation.logback-appender.experimental.capture-marker-attribute
    declarative_name: java.logback_appender.capture_marker_attribute/development
    description: >
      Enables the capture of the Logback marker attribute.
    type: boolean
    default: false
  - name: otel.instrumentation.logback-appender.experimental.key-value-pair-attributes.included
    declarative_name: java.logback_appender.key_value_pair_attributes/development.included
    description: >
      Comma-separated list of case-sensitive glob patterns for Logback key value pair keys to
      capture as log attributes. "*" matches any number of characters and "?" matches one
      character, so "*" captures all key value pair attributes. Excluded patterns take precedence
      over included patterns. No key value pair attributes are captured unless an included pattern,
      an excluded pattern, or the deprecated
      otel.instrumentation.logback-appender.experimental.capture-key-value-pair-attributes setting
      is configured; configuring only excluded patterns captures all key value pair attributes that
      do not match them. Captured key value pair attributes may contain sensitive information.
    type: list
    default: ''
    examples:
      - "custom-key"
      - "request-*,user-?"
  - name: otel.instrumentation.logback-appender.experimental.key-value-pair-attributes.excluded
    declarative_name: java.logback_appender.key_value_pair_attributes/development.excluded
    description: >
      Comma-separated list of case-sensitive glob patterns for Logback key value pair keys not to
      capture as log attributes. "*" matches any number of characters and "?" matches one
      character. Excluded patterns take precedence over included patterns. No key value pair
      attributes are captured unless an included pattern, an excluded pattern, or the deprecated
      otel.instrumentation.logback-appender.experimental.capture-key-value-pair-attributes setting
      is configured; configuring only excluded patterns captures all key value pair attributes that
      do not match them. Captured key value pair attributes may contain sensitive information.
    type: list
    default: ''
    examples:
      - "*-secret"
      - "password,token"
  - name: otel.instrumentation.logback-appender.experimental.capture-key-value-pair-attributes
    declarative_name: java.logback_appender.capture_key_value_pair_attributes/development
    description: >
      Deprecated setting that enables the capture of all attributes from Logback key value pairs.
      It is ignored when
      otel.instrumentation.logback-appender.experimental.key-value-pair-attributes.included or
      otel.instrumentation.logback-appender.experimental.key-value-pair-attributes.excluded is
      configured, and it may be removed in the next minor release. Use
      otel.instrumentation.logback-appender.experimental.key-value-pair-attributes.included
      instead.
    type: boolean
    default: false
  - name: otel.instrumentation.logback-appender.experimental.logger-context-attributes.included
    declarative_name: java.logback_appender.logger_context_attributes/development.included
    description: >
      Comma-separated list of case-sensitive glob patterns for Logback logger context property keys
      to capture as log attributes. "*" matches any number of characters and "?" matches one
      character, so "*" captures all logger context attributes. Excluded patterns take precedence
      over included patterns. No logger context attributes are captured unless an included pattern,
      an excluded pattern, or the deprecated
      otel.instrumentation.logback-appender.experimental.capture-logger-context-attributes setting
      is configured; configuring only excluded patterns captures all logger context attributes that
      do not match them. Captured logger context attributes may contain sensitive information.
    type: list
    default: ''
    examples:
      - "app.version"
      - "app.*,deployment-?"
  - name: otel.instrumentation.logback-appender.experimental.logger-context-attributes.excluded
    declarative_name: java.logback_appender.logger_context_attributes/development.excluded
    description: >
      Comma-separated list of case-sensitive glob patterns for Logback logger context property keys
      not to capture as log attributes. "*" matches any number of characters and "?" matches one
      character. Excluded patterns take precedence over included patterns. No logger context
      attributes are captured unless an included pattern, an excluded pattern, or the deprecated
      otel.instrumentation.logback-appender.experimental.capture-logger-context-attributes setting
      is configured; configuring only excluded patterns captures all logger context attributes that
      do not match them. Captured logger context attributes may contain sensitive information.
    type: list
    default: ''
    examples:
      - "*-secret"
      - "password,token"
  - name: otel.instrumentation.logback-appender.experimental.capture-logger-context-attributes
    declarative_name: java.logback_appender.capture_logger_context_attributes/development
    description: >
      Deprecated setting that enables the capture of all attributes from the Logback logger context.
      It is ignored when
      otel.instrumentation.logback-appender.experimental.logger-context-attributes.included or
      otel.instrumentation.logback-appender.experimental.logger-context-attributes.excluded is
      configured, and it may be removed in the next minor release. Use
      otel.instrumentation.logback-appender.experimental.logger-context-attributes.included
      instead.
    type: boolean
    default: false
  - name: otel.instrumentation.logback-appender.experimental.capture-template
    declarative_name: java.logback_appender.capture_template/development
    description: >
      Enables the capture of the log message template before parameter substitution.
    type: boolean
    default: false
  - name: otel.instrumentation.logback-appender.experimental.capture-arguments
    declarative_name: java.logback_appender.capture_arguments/development
    description: >
      Enables the capture of log message arguments as separate attributes.
    type: boolean
    default: false
  - name: otel.instrumentation.logback-appender.experimental.logstash-marker-attributes.included
    declarative_name: java.logback_appender.logstash_marker_attributes/development.included
    description: >
      Comma-separated list of case-sensitive glob patterns for Logstash marker keys to capture as
      log attributes. "*" matches any number of characters and "?" matches one character, so "*"
      captures all Logstash marker attributes. Excluded patterns take precedence over included
      patterns. No Logstash marker attributes are captured unless an included pattern, an excluded
      pattern, or the deprecated
      otel.instrumentation.logback-appender.experimental.capture-logstash-marker-attributes setting
      is configured; configuring only excluded patterns captures all Logstash marker attributes
      that do not match them. Captured Logstash marker attributes may contain sensitive
      information.
    type: list
    default: ''
    examples:
      - "custom-key"
      - "request-*,user-?"
  - name: otel.instrumentation.logback-appender.experimental.logstash-marker-attributes.excluded
    declarative_name: java.logback_appender.logstash_marker_attributes/development.excluded
    description: >
      Comma-separated list of case-sensitive glob patterns for Logstash marker keys not to capture
      as log attributes. "*" matches any number of characters and "?" matches one character.
      Excluded patterns take precedence over included patterns. No Logstash marker attributes are
      captured unless an included pattern, an excluded pattern, or the deprecated
      otel.instrumentation.logback-appender.experimental.capture-logstash-marker-attributes setting
      is configured; configuring only excluded patterns captures all Logstash marker attributes
      that do not match them. Captured Logstash marker attributes may contain sensitive
      information.
    type: list
    default: ''
    examples:
      - "*-secret"
      - "password,token"
  - name: otel.instrumentation.logback-appender.experimental.capture-logstash-marker-attributes
    declarative_name: java.logback_appender.capture_logstash_marker_attributes/development
    description: >
      Deprecated setting that enables the capture of all attributes from Logstash markers, supported
      are those added to logs via Markers.append(), Markers.appendEntries(), Markers.appendArray()
      and Markers.appendRaw() methods. It is ignored when
      otel.instrumentation.logback-appender.experimental.logstash-marker-attributes.included or
      otel.instrumentation.logback-appender.experimental.logstash-marker-attributes.excluded is
      configured, and it may be removed in the next minor release. Use
      otel.instrumentation.logback-appender.experimental.logstash-marker-attributes.included
      instead.
    type: boolean
    default: false
  - name: otel.instrumentation.logback-appender.experimental.logstash-structured-argument-attributes.included
    declarative_name: java.logback_appender.logstash_structured_argument_attributes/development.included
    description: >
      Comma-separated list of case-sensitive glob patterns for Logstash structured argument keys to
      capture as log attributes. "*" matches any number of characters and "?" matches one character,
      so "*" captures all Logstash structured argument attributes. Excluded patterns take precedence
      over included patterns. No Logstash structured argument attributes are captured unless an
      included pattern, an excluded pattern, or the deprecated
      otel.instrumentation.logback-appender.experimental.capture-logstash-structured-arguments
      setting is configured; configuring only excluded patterns captures all Logstash structured
      argument attributes that do not match them. Captured Logstash structured argument attributes
      may contain sensitive information.
    type: list
    default: ''
    examples:
      - "custom-key"
      - "request-*,user-?"
  - name: otel.instrumentation.logback-appender.experimental.logstash-structured-argument-attributes.excluded
    declarative_name: java.logback_appender.logstash_structured_argument_attributes/development.excluded
    description: >
      Comma-separated list of case-sensitive glob patterns for Logstash structured argument keys not
      to capture as log attributes. "*" matches any number of characters and "?" matches one
      character. Excluded patterns take precedence over included patterns. No Logstash structured
      argument attributes are captured unless an included pattern, an excluded pattern, or the
      deprecated
      otel.instrumentation.logback-appender.experimental.capture-logstash-structured-arguments
      setting is configured; configuring only excluded patterns captures all Logstash structured
      argument attributes that do not match them. Captured Logstash structured argument attributes
      may contain sensitive information.
    type: list
    default: ''
    examples:
      - "*-secret"
      - "password,token"
  - name: otel.instrumentation.logback-appender.experimental.capture-logstash-structured-arguments
    declarative_name: java.logback_appender.capture_logstash_structured_arguments/development
    description: >
      Deprecated setting that enables the capture of all attributes from Logstash structured
      arguments. It is ignored when
      otel.instrumentation.logback-appender.experimental.logstash-structured-argument-attributes.included
      or
      otel.instrumentation.logback-appender.experimental.logstash-structured-argument-attributes.excluded
      is configured, and it may be removed in the next minor release. Use
      otel.instrumentation.logback-appender.experimental.logstash-structured-argument-attributes.included
      instead.
    type: boolean
    default: false
  - name: otel.instrumentation.logback-appender.experimental.mdc-attributes.included
    declarative_name: java.logback_appender.mdc_attributes/development.included
    description: >
      Comma-separated list of case-sensitive glob patterns for MDC keys to capture as log
      attributes. "*" matches any number of characters and "?" matches one character, so "*"
      captures all MDC attributes. Excluded patterns take precedence over included patterns. No MDC
      attributes are captured unless an included pattern, an excluded pattern, or the deprecated
      otel.instrumentation.logback-appender.experimental.capture-mdc-attributes setting is
      configured; configuring only excluded patterns captures all MDC attributes that do not match
      them. Captured MDC attributes may contain sensitive information.
    type: list
    default: ''
    examples:
      - "custom-mdc-key"
      - "request-*,user-?"
  - name: otel.instrumentation.logback-appender.experimental.mdc-attributes.excluded
    declarative_name: java.logback_appender.mdc_attributes/development.excluded
    description: >
      Comma-separated list of case-sensitive glob patterns for MDC keys not to capture as log
      attributes. "*" matches any number of characters and "?" matches one character. Excluded
      patterns take precedence over included patterns. No MDC attributes are captured unless an
      included pattern, an excluded pattern, or the deprecated
      otel.instrumentation.logback-appender.experimental.capture-mdc-attributes setting is
      configured; configuring only excluded patterns captures all MDC attributes that do not match
      them. Captured MDC attributes may contain sensitive information.
    type: list
    default: ''
    examples:
      - "*-secret"
      - "password,token"
  - name: otel.instrumentation.logback-appender.experimental.capture-mdc-attributes
    declarative_name: java.logback_appender.capture_mdc_attributes/development
    description: >
      Deprecated comma-separated list of MDC keys to capture as log attributes. Keys are matched
      literally, including "*" and "?", except that the single value "*" captures all MDC
      attributes. It is ignored when
      otel.instrumentation.logback-appender.experimental.mdc-attributes.included or
      otel.instrumentation.logback-appender.experimental.mdc-attributes.excluded is configured, and
      it may be removed in the next minor release. Use
      otel.instrumentation.logback-appender.experimental.mdc-attributes.included instead.
    type: list
    default: ''
    examples:
      - "custom-mdc-key"
      - "key1,key2,key3"
