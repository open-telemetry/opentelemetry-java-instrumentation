display_name: R2DBC
description: >
  This instrumentation enables database client spans and database client metrics for R2DBC
  (Reactive Relational Database Connectivity).
semantic_conventions:
  - DATABASE_CLIENT_SPANS
  - DATABASE_CLIENT_METRICS
library_link: https://r2dbc.io/
configurations:
  - name: otel.instrumentation.r2dbc.query-sanitization.enabled
    declarative_name: java.r2dbc.query_sanitization.enabled
    description: >
      Enables query sanitization for database queries. Overrides
      `otel.instrumentation.common.db.query-sanitization.enabled` for this instrumentation; when
      unset, that setting applies.
    type: boolean
  - ref: common.db.query-sanitization.enabled
  - ref: common.db-statement-sanitizer.enabled
  - ref: common.database.statement_sanitizer.enabled
  - name: otel.instrumentation.r2dbc.statement-sanitizer.enabled
    declarative_name: java.r2dbc.statement_sanitizer.enabled
    description: "Deprecated: use `otel.instrumentation.r2dbc.query-sanitization.enabled` instead. It is ignored under v3 preview and will be removed in 3.0."
    type: boolean
    default: true
    deprecated: true
    replaced_by: otel.instrumentation.r2dbc.query-sanitization.enabled
  - name: otel.instrumentation.r2dbc.experimental.sqlcommenter.enabled
    declarative_name: java.r2dbc.sqlcommenter/development.enabled
    description: >
      Enables augmenting queries with a comment containing the tracing information. See
      [sqlcommenter](https://google.github.io/sqlcommenter/) for more info. Overrides
      `otel.instrumentation.common.db.experimental.sqlcommenter.enabled` for this instrumentation;
      when unset, that setting applies. WARNING: augmenting queries with tracing context will make
      query texts unique, which may have adverse impact on database performance.
    type: boolean
  - ref: common.db.sqlcommenter.enabled
  - ref: common.database.sqlcommenter.enabled
  - ref: common.peer-service-mapping
