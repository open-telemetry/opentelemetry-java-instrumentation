display_name: JVM Runtime Telemetry
description: >
  This instrumentation enables JVM runtime metrics using JMX (Java 8+) and JFR (Java 17+) to
  monitor classes, CPU, garbage collection, memory, and threads.
semantic_conventions:
  - JVM_RUNTIME_METRICS
library_link: https://github.com/open-telemetry/opentelemetry-java-instrumentation/tree/main/instrumentation/runtime-telemetry
configurations:
  - name: otel.instrumentation.runtime-telemetry.emit-experimental-metrics
    declarative_name: java.runtime_telemetry.emit_experimental_metrics/development
    description: Enables the capture of experimental JMX-based JVM runtime metrics.
    type: boolean
    default: false
  - name: otel.instrumentation.runtime-telemetry.emit-experimental-jfr-metrics
    declarative_name: java.runtime_telemetry.emit_experimental_jfr_metrics/development
    description: >
      Enables the capture of experimental JFR-based JVM runtime metrics on Java 17+.
    type: boolean
    default: false
  - name: otel.instrumentation.runtime-telemetry.experimental.prefer-jfr
    declarative_name: java.runtime_telemetry.prefer_jfr/development
    description: >
      Deprecated: use `otel.instrumentation.runtime-telemetry.experimental.jfr-metrics.included`
      instead. Prefer JFR over JMX for metrics available from both sources, on Java 17+.
    type: boolean
    default: false
    deprecated: true
    replaced_by: otel.instrumentation.runtime-telemetry.experimental.jfr-metrics.included
  - name: otel.instrumentation.runtime-telemetry.experimental.jfr-metrics.included
    declarative_name: java.runtime_telemetry.jfr_metrics/development.included
    description: >
      Selects JVM runtime metrics to source from JFR on Java 17+. Supports exact names and glob
      patterns with * and ?. Configuring either JFR metric selector property activates JFR. Use *
      to select all metrics.
    type: list
    default: ""
    examples:
      - "jvm.memory.*,jvm.cpu.longlock"
  - name: otel.instrumentation.runtime-telemetry.experimental.jfr-metrics.excluded
    declarative_name: java.runtime_telemetry.jfr_metrics/development.excluded
    description: >
      Excludes JVM runtime metrics from JFR on Java 17+ using exact names or glob patterns with * and
      ?. Excluded patterns take precedence over included patterns, including over shorthand and
      legacy selections. Configuring this property without included selects all metrics except those
      excluded.
    type: list
    default: ""
    examples:
      - "jvm.memory.allocation,jvm.network.*"
  - name: otel.instrumentation.runtime-telemetry.experimental.package-emitter.enabled
    declarative_name: java.runtime_telemetry.package_emitter/development.enabled
    description: Enables creating events for JAR libraries used by the application.
    type: boolean
    default: false
  - name: otel.instrumentation.runtime-telemetry.experimental.package-emitter.jars-per-second
    declarative_name: java.runtime_telemetry.package_emitter/development.jars_per_second
    description: The number of JAR files processed per second by the package emitter.
    type: int
    default: 10
  - name: otel.instrumentation.runtime-telemetry.emit-experimental-telemetry
    declarative_name: java.runtime_telemetry.emit_experimental_telemetry/development
    description: "Deprecated: use `otel.instrumentation.runtime-telemetry.emit-experimental-metrics` instead. It will be removed in 3.0."
    type: boolean
    default: false
    deprecated: true
    replaced_by: otel.instrumentation.runtime-telemetry.emit-experimental-metrics
  - name: otel.instrumentation.runtime-telemetry.capture-gc-cause
    declarative_name: java.runtime_telemetry.capture_gc_cause
    description: "Deprecated: will be removed in 3.0, when the GC cause is always captured. There is no replacement. Enables capturing the `jvm.gc.cause` attribute; under v3 preview the GC cause is always captured."
    type: boolean
    default: false
    deprecated: true
  - name: otel.instrumentation.runtime-telemetry.package-emitter.enabled
    declarative_name: java.runtime_telemetry.package_emitter.enabled
    description: "Deprecated: use `otel.instrumentation.runtime-telemetry.experimental.package-emitter.enabled` instead. It will be removed in 3.0."
    type: boolean
    default: false
    deprecated: true
    replaced_by: otel.instrumentation.runtime-telemetry.experimental.package-emitter.enabled
  - name: otel.instrumentation.runtime-telemetry.package-emitter.jars-per-second
    declarative_name: java.runtime_telemetry.package_emitter.jars_per_second
    description: "Deprecated: use `otel.instrumentation.runtime-telemetry.experimental.package-emitter.jars-per-second` instead. It will be removed in 3.0."
    type: int
    default: 10
    deprecated: true
    replaced_by: otel.instrumentation.runtime-telemetry.experimental.package-emitter.jars-per-second
  - name: otel.instrumentation.runtime-telemetry-java17.enabled
    declarative_name: java.runtime_telemetry_java17.enabled
    description: "Deprecated: use `otel.instrumentation.runtime-telemetry.emit-experimental-jfr-metrics` instead. It will be removed in 3.0."
    type: boolean
    default: false
    deprecated: true
    replaced_by: otel.instrumentation.runtime-telemetry.emit-experimental-jfr-metrics
  - name: otel.instrumentation.runtime-telemetry-java17.enable-all
    declarative_name: java.runtime_telemetry_java17.enable_all
    description: "Deprecated: use `otel.instrumentation.runtime-telemetry.experimental.jfr-metrics.included=*` instead. It will be removed in 3.0."
    type: boolean
    default: false
    deprecated: true
    replaced_by: otel.instrumentation.runtime-telemetry.experimental.jfr-metrics.included
