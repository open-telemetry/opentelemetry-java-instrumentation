display_name: Apache Pulsar Client
description: >
  This instrumentation enables messaging spans for Apache Pulsar message producers and consumers.
library_link: https://pulsar.apache.org/
semantic_conventions:
  - MESSAGING_SPANS
configurations:
  - name: otel.instrumentation.messaging.experimental.receive-telemetry.enabled
    declarative_name: java.common.messaging.receive_telemetry/development.enabled
    description: >
      Controls experimental receive spans for pull-based messaging operations. When unset, receive
      spans are enabled with stable messaging semantic conventions or v3-preview, and disabled otherwise.
    type: boolean
    default_is_conditional: true
  - ref: messaging.capture-headers
  - name: otel.instrumentation.pulsar.experimental-span-attributes
    declarative_name: java.pulsar.experimental_span_attributes/development
    description: >
      Enables the experimental span attribute `messaging.pulsar.message.type` for producer spans.
    type: boolean
    default: false
