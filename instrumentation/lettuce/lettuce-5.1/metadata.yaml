display_name: Lettuce
description: >
  This instrumentation enables database client spans and database client metrics for the Lettuce
  Redis client.
semantic_conventions:
  - DATABASE_CLIENT_SPANS
  - DATABASE_CLIENT_METRICS
library_link: https://github.com/redis/lettuce
configurations:
  - name: otel.instrumentation.lettuce.experimental.command-encoding-events.enabled
    declarative_name: java.lettuce.command_encoding_events/development.enabled
    description: Enables capturing `redis.encode.start` and `redis.encode.end` span events in the standalone library instrumentation.
    type: boolean
    default: false
  - name: otel.instrumentation.lettuce.query-sanitization.enabled
    declarative_name: java.lettuce.query_sanitization.enabled
    description: >
      Enables query sanitization for Lettuce queries. Overrides
      `otel.instrumentation.common.db.query-sanitization.enabled` for this instrumentation; when
      unset, that setting applies.
    type: boolean
  - ref: common.db.query-sanitization.enabled
