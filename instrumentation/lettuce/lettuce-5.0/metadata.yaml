display_name: Lettuce
description: >
  This instrumentation enables database client spans and database client metrics for the Lettuce
  Redis client.
semantic_conventions:
  - DATABASE_CLIENT_SPANS
  - DATABASE_CLIENT_METRICS
library_link: https://github.com/redis/lettuce
configurations:
  - name: otel.instrumentation.lettuce.connection-telemetry.enabled
    declarative_name: java.lettuce.connection_telemetry.enabled
    description: Enables connection telemetry spans for Redis connections.
    type: boolean
    default: false
  - name: otel.instrumentation.lettuce.experimental-span-attributes
    declarative_name: java.lettuce.experimental_span_attributes/development
    description: >
      Enables experimental span attributes `lettuce.command.cancelled` and
      `lettuce.command.results.count`.
    type: boolean
    default: false
  - name: otel.instrumentation.lettuce.query-sanitization.enabled
    declarative_name: java.lettuce.query_sanitization.enabled
    description: >
      Enables query sanitization for Lettuce queries. Overrides
      `otel.instrumentation.common.db.query-sanitization.enabled` for this instrumentation; when
      unset, that setting applies.
    type: boolean
  - ref: common.db.query-sanitization.enabled
  - ref: common.db-statement-sanitizer.enabled
  - ref: common.database.statement_sanitizer.enabled
  - name: otel.instrumentation.lettuce.statement-sanitizer.enabled
    declarative_name: java.lettuce.statement_sanitizer.enabled
    description: "Deprecated: use `otel.instrumentation.lettuce.query-sanitization.enabled` instead. It is ignored under v3 preview and will be removed in 3.0."
    type: boolean
    default: true
    deprecated: true
    replaced_by: otel.instrumentation.lettuce.query-sanitization.enabled
  - ref: common.peer-service-mapping
