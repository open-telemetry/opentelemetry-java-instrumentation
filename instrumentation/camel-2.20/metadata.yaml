display_name: Apache Camel
description: >
  This instrumentation enables tracing and messaging metrics for Apache Camel 2.x applications. For
  Camel versions 3.5 and newer, users should instead use the native 'camel-opentelemetry' component
  provided directly by the Camel project.
semantic_conventions:
  - HTTP_CLIENT_SPANS
  - HTTP_SERVER_SPANS
  - DATABASE_CLIENT_SPANS
  - MESSAGING_SPANS
features:
  - HTTP_ROUTE
library_link: https://camel.apache.org/
configurations:
  - name: otel.instrumentation.camel.experimental-span-attributes
    declarative_name: java.camel.experimental_span_attributes/development
    description: >
      Enable the capture of experimental `camel.uri`, `camel.kafka.partitionKey`, `camel.kafka.key`
      and `camel.kafka.offset` span attributes.
    type: boolean
    default: false
additional_telemetry:
  - when: otel.semconv-stability.opt-in=messaging
    metrics:
      - name: messaging.client.consumed.messages
        description: Number of messages that were delivered to the application.
        type: LONG_SUM
        unit: "{message}"
        attributes:
          - name: error.type
            type: STRING
          - name: messaging.destination.name
            type: STRING
          - name: messaging.destination.partition.id
            type: STRING
          - name: messaging.operation.name
            type: STRING
          - name: messaging.system
            type: STRING
      - name: messaging.client.operation.duration
        description: Duration of messaging operation initiated by a producer or consumer client.
        type: HISTOGRAM
        unit: s
        attributes:
          - name: error.type
            type: STRING
          - name: messaging.destination.name
            type: STRING
          - name: messaging.operation.name
            type: STRING
          - name: messaging.operation.type
            type: STRING
          - name: messaging.system
            type: STRING
      - name: messaging.client.sent.messages
        description: Number of messages producer attempted to send to the broker.
        type: LONG_SUM
        unit: "{message}"
        attributes:
          - name: error.type
            type: STRING
          - name: messaging.destination.name
            type: STRING
          - name: messaging.operation.name
            type: STRING
          - name: messaging.system
            type: STRING
      - name: messaging.process.duration
        description: Duration of processing operation.
        type: HISTOGRAM
        unit: s
        attributes:
          - name: error.type
            type: STRING
          - name: messaging.destination.name
            type: STRING
          - name: messaging.destination.partition.id
            type: STRING
          - name: messaging.operation.name
            type: STRING
          - name: messaging.system
            type: STRING
  - when: otel.semconv-stability.opt-in=messaging/dup
    metrics:
      - name: messaging.client.consumed.messages
        description: Number of messages that were delivered to the application.
        type: LONG_SUM
        unit: "{message}"
        attributes:
          - name: error.type
            type: STRING
          - name: messaging.destination.name
            type: STRING
          - name: messaging.destination.partition.id
            type: STRING
          - name: messaging.operation.name
            type: STRING
          - name: messaging.system
            type: STRING
      - name: messaging.client.operation.duration
        description: Duration of messaging operation initiated by a producer or consumer client.
        type: HISTOGRAM
        unit: s
        attributes:
          - name: error.type
            type: STRING
          - name: messaging.destination.name
            type: STRING
          - name: messaging.operation.name
            type: STRING
          - name: messaging.operation.type
            type: STRING
          - name: messaging.system
            type: STRING
      - name: messaging.client.sent.messages
        description: Number of messages producer attempted to send to the broker.
        type: LONG_SUM
        unit: "{message}"
        attributes:
          - name: error.type
            type: STRING
          - name: messaging.destination.name
            type: STRING
          - name: messaging.operation.name
            type: STRING
          - name: messaging.system
            type: STRING
      - name: messaging.process.duration
        description: Duration of processing operation.
        type: HISTOGRAM
        unit: s
        attributes:
          - name: error.type
            type: STRING
          - name: messaging.destination.name
            type: STRING
          - name: messaging.destination.partition.id
            type: STRING
          - name: messaging.operation.name
            type: STRING
          - name: messaging.system
            type: STRING
  - when: otel.instrumentation.common.v3-preview=true
    metrics:
