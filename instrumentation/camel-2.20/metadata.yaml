display_name: Apache Camel
description: >
  This instrumentation enables tracing and messaging metrics for Apache Camel 2.x applications. For
  Camel versions 3.5 and newer, users should instead use the native 'camel-opentelemetry' component
  provided directly by the Camel project.
semantic_conventions:
  - HTTP_CLIENT_SPANS
  - HTTP_SERVER_SPANS
  - DATABASE_CLIENT_SPANS
  - MESSAGING_SPANS
features:
  - HTTP_ROUTE
library_link: https://camel.apache.org/
configurations:
  - name: otel.instrumentation.camel.experimental-span-attributes
    declarative_name: java.camel.experimental_span_attributes/development
    description: >
      Enable the capture of experimental `camel.uri`, `camel.kafka.partitionKey`, `camel.kafka.key`
      and `camel.kafka.offset` span attributes.
    type: boolean
    default: false
  - name: otel.instrumentation.camel.query-sanitization.enabled
    declarative_name: java.camel.query_sanitization.enabled
    description: >
      Enables query sanitization for database queries traced through Camel. Overrides
      `otel.instrumentation.common.db.query-sanitization.enabled` for this instrumentation; when
      unset, that setting applies.
    type: boolean
  - ref: common.db.query-sanitization.enabled
  - ref: common.db-statement-sanitizer.enabled
  - ref: common.database.statement_sanitizer.enabled
  - name: otel.instrumentation.camel.statement-sanitizer.enabled
    declarative_name: java.camel.statement_sanitizer.enabled
    description: "Deprecated: use `otel.instrumentation.camel.query-sanitization.enabled` instead. It is ignored under v3 preview and will be removed in 3.0. When unset, this setting falls back to `otel.instrumentation.common.db.query-sanitization.enabled` (including its deprecated aliases)."
    type: boolean
    deprecated: true
    replaced_by: otel.instrumentation.camel.query-sanitization.enabled
