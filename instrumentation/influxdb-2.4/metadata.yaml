display_name: InfluxDB Client
description: This instrumentation enables database client spans and metrics for the InfluxDB Java client.
semantic_conventions:
  - DATABASE_CLIENT_SPANS
  - DATABASE_CLIENT_METRICS
library_link: https://github.com/influxdata/influxdb-java
configurations:
  - name: otel.instrumentation.influxdb.query-sanitization.enabled
    declarative_name: java.influxdb.query_sanitization.enabled
    description: >
      Enables query sanitization for InfluxDB queries. Overrides
      `otel.instrumentation.common.db.query-sanitization.enabled` for this instrumentation; when
      unset, that setting applies.
    type: boolean
  - ref: common.db.query-sanitization.enabled
