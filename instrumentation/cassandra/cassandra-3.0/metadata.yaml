display_name: Cassandra Driver
description: >
  This instrumentation enables database client spans and database client metrics for the DataStax
  Cassandra Driver.
semantic_conventions:
  - DATABASE_CLIENT_SPANS
  - DATABASE_CLIENT_METRICS
library_link: https://github.com/apache/cassandra-java-driver
configurations:
  - name: otel.instrumentation.cassandra.query-sanitization.enabled
    declarative_name: java.cassandra.query_sanitization.enabled
    description: >
      Enables query sanitization for Cassandra queries. Overrides
      `otel.instrumentation.common.db.query-sanitization.enabled` for this instrumentation; when
      unset, that setting applies.
    type: boolean
  - ref: common.db.query-sanitization.enabled
  - ref: common.db-statement-sanitizer.enabled
  - ref: common.database.statement_sanitizer.enabled
  - name: otel.instrumentation.cassandra.statement-sanitizer.enabled
    declarative_name: java.cassandra.statement_sanitizer.enabled
    description: "Deprecated: use `otel.instrumentation.cassandra.query-sanitization.enabled` instead. It is ignored under v3 preview and will be removed in 3.0."
    type: boolean
    default: true
    deprecated: true
    replaced_by: otel.instrumentation.cassandra.query-sanitization.enabled
