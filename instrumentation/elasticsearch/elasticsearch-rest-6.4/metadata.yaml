display_name: Elasticsearch REST Client
description: This instrumentation enables database client spans and database client metrics for Elasticsearch REST clients.
semantic_conventions:
  - DATABASE_CLIENT_SPANS
  - DATABASE_CLIENT_METRICS
library_link: https://www.elastic.co/guide/en/elasticsearch/client/java-rest
configurations:
  - name: otel.instrumentation.elasticsearch.capture-search-query
    declarative_name: java.elasticsearch.capture_search_query
    description: >
      Deprecated for removal in 3.0 with no replacement. Outside v3-preview, explicitly set this to
      capture or omit search query bodies. Under v3-preview and in 3.0, the setting is ignored and
      search query bodies are always captured. Sanitization remains separately configurable with
      otel.instrumentation.elasticsearch.query-sanitization.enabled.
    type: boolean
    default: false
    deprecated: true
  - name: otel.instrumentation.elasticsearch.query-sanitization.enabled
    declarative_name: java.elasticsearch.query_sanitization.enabled
    description: >
      Enables sanitization of the captured search query bodies. Overrides
      `otel.instrumentation.common.db.query-sanitization.enabled` for this instrumentation; when
      unset, that setting applies.
    type: boolean
  - ref: common.db.query-sanitization.enabled
  - ref: common.db-statement-sanitizer.enabled
  - ref: common.database.statement_sanitizer.enabled
  - name: otel.instrumentation.elasticsearch.statement-sanitizer.enabled
    declarative_name: java.elasticsearch.statement_sanitizer.enabled
    description: "Deprecated: use `otel.instrumentation.elasticsearch.query-sanitization.enabled` instead. It is ignored under v3 preview and will be removed in 3.0."
    type: boolean
    default: true
    deprecated: true
    replaced_by: otel.instrumentation.elasticsearch.query-sanitization.enabled
  - ref: http.known-methods
