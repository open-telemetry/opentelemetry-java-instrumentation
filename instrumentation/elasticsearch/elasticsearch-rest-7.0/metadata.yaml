display_name: Elasticsearch REST Client
description: >
  This instrumentation enables database client spans and database client metrics for Elasticsearch
  REST clients. The library artifacts are deprecated and may be removed in the next minor release.
  The recommended replacement is the Elasticsearch Java API Client's native OpenTelemetry support
  (https://www.elastic.co/guide/en/elasticsearch/client/java-api-client/8.10/opentelemetry.html),
  available in 7.17.20+ on the 7.x line and 8.10+. The javaagent remains supported and is separate
  from this library deprecation.
semantic_conventions:
  - DATABASE_CLIENT_SPANS
  - DATABASE_CLIENT_METRICS
library_link: https://www.elastic.co/guide/en/elasticsearch/client/java-rest
configurations:
  - name: otel.instrumentation.elasticsearch.capture-search-query
    declarative_name: java.elasticsearch.capture_search_query
    description: >
      Deprecated for removal in 3.0 with no replacement. Outside v3-preview, explicitly set this to
      capture or omit search query bodies. Under v3-preview and in 3.0, the setting is ignored and
      search query bodies are always captured. Sanitization remains separately configurable with
      otel.instrumentation.elasticsearch.query-sanitization.enabled.
    type: boolean
    default: false
  - name: otel.instrumentation.elasticsearch.query-sanitization.enabled
    declarative_name: java.elasticsearch.query_sanitization.enabled
    description: >
      Enables sanitization of the captured search query bodies. Takes precedence over
      otel.instrumentation.common.db.query-sanitization.enabled.
    type: boolean
    default: true
  - ref: common.db.query-sanitization.enabled
  - ref: http.known-methods
