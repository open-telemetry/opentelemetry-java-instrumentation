display_name: Elasticsearch API Client
description: >
  This instrumentation enriches Elasticsearch database client spans generated by the
  elasticsearch-rest-7.0 instrumentation by adding `db.operation.parameter.id` and
  `db.operation.parameter.index` attributes, or the deprecated `db.elasticsearch.path_parts.id`
  and `db.elasticsearch.path_parts.index` attributes when the old database semantic conventions
  are in use. It does not emit any telemetry on its own.
  Versions 7.17.20 and later on the 7.x line, and versions 8.10 and later, have native OpenTelemetry
  support.
library_link: https://www.elastic.co/docs/reference/elasticsearch/clients/java
