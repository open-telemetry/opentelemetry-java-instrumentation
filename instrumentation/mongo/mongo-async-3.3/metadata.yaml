display_name: MongoDB Driver (Async)
description: >
  This instrumentation enables database client spans and database client metrics for the MongoDB
  async Java driver.
semantic_conventions:
  - DATABASE_CLIENT_SPANS
  - DATABASE_CLIENT_METRICS
library_link: https://www.mongodb.com/docs/drivers/java-drivers/
configurations:
  - name: otel.instrumentation.mongo.query-sanitization.enabled
    declarative_name: java.mongo.query_sanitization.enabled
    description: >
      Enables query sanitization for MongoDB queries. Overrides
      `otel.instrumentation.common.db.query-sanitization.enabled` for this instrumentation; when
      unset, that setting applies.
    type: boolean
  - ref: common.db.query-sanitization.enabled
  - ref: common.db-statement-sanitizer.enabled
  - ref: common.database.statement_sanitizer.enabled
  - name: otel.instrumentation.mongo.statement-sanitizer.enabled
    declarative_name: java.mongo.statement_sanitizer.enabled
    description: "Deprecated: use `otel.instrumentation.mongo.query-sanitization.enabled` instead. It is ignored under v3 preview and will be removed in 3.0."
    type: boolean
    default: true
    deprecated: true
    replaced_by: otel.instrumentation.mongo.query-sanitization.enabled
