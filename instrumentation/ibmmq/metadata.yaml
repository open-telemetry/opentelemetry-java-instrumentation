description: This instrumentation enables messaging spans for IBM MQ message producers.
display_name: IBM MQ
library_link: https://www.ibm.com/products/mq
semantic_conventions:
  - MESSAGING_SPANS
configurations:
  - name: otel.instrumentation.ibmmq.experimental-span-attributes
    declarative_name: java.ibmmq.experimental_span_attributes/development
    description: >
      Enables the `messaging.ibmmq.queue_manager.id` attribute on IBM MQ messaging spans. The
      queue manager identifier (QMID) is required to identify a queue manager unambiguously,
      because queue manager names are not globally unique in federated architectures.
    type: boolean
    default: false
  - name: otel.instrumentation.messaging.experimental.receive-telemetry.enabled
    declarative_name: java.common.messaging.receive_telemetry/development.enabled
    description: >
      Enables the creation of consumer spans on messaging receive operations. These spans will
      measure the time between receiving a message and the consumer processing that message.
    type: boolean
    default: false
  - ref: messaging.capture-headers
