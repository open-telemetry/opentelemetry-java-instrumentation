display_name: Eclipse Grizzly
description: This instrumentation enables HTTP server spans and HTTP server metrics for Grizzly.
semantic_conventions:
  - HTTP_SERVER_SPANS
  - HTTP_SERVER_METRICS
library_link: https://javaee.github.io/grizzly/httpserverframework.html
configurations:
  - ref: http.known-methods
  - ref: http.server.request-captured-headers
  - ref: http.server.response-captured-headers
  - ref: http.server.emit-experimental-telemetry
  - ref: common.user.name.enabled
