description: >
  This instrumentation bridges Log4j log events to OpenTelemetry logs.
display_name: Log4j
library_link: https://logging.apache.org/log4j/2.x/
features:
  - LOGGING_BRIDGE
configurations:
  - name: otel.instrumentation.common.logging.structured-attributes.included
    declarative_name: java.common.logging.structured_attributes.included
    description: >
      Comma-separated list of case-sensitive glob patterns for event-local structured log attribute
      keys to capture. Applies to Log4j MapMessage entries, SLF4J key-value pairs, Logback Logstash
      markers, and Logstash structured arguments. "*" matches any number of characters and "?"
      matches one character. Excluded patterns take precedence. An absent or empty included list
      captures every key not excluded. Under v3-preview, all structured attributes are captured by
      default. MDC and logger-context attributes remain separate and opt-in.
    type: list
    default: ''
  - name: otel.instrumentation.common.logging.structured-attributes.excluded
    declarative_name: java.common.logging.structured_attributes.excluded
    description: >
      Comma-separated list of case-sensitive glob patterns for event-local structured log attribute
      keys not to capture. Applies to Log4j MapMessage entries, SLF4J key-value pairs, Logback
      Logstash markers, and Logstash structured arguments. Excluded patterns take precedence over
      included patterns. An exclude-only selector captures every key not excluded; "*" captures no
      structured attributes. This does not affect otel.event.name, MDC, or logger context.
    type: list
    default: ''
  - name: otel.instrumentation.log4j-appender.experimental-log-attributes
    declarative_name: java.log4j_appender.experimental_log_attributes/development
    description: >
      Enables the capture of experimental log attributes, including thread name and thread ID.
    type: boolean
    default: false
  - name: otel.instrumentation.log4j-appender.experimental.capture-code-attributes
    declarative_name: java.log4j_appender.capture_code_attributes/development
    description: >
      Enables the capture of code location attributes, including file path, class name, method
      name, and line number.
    type: boolean
    default: false
  - name: otel.instrumentation.log4j-appender.experimental.map-message-attributes.included
    declarative_name: java.log4j_appender.map_message_attributes/development.included
    description: >
      Deprecated; use otel.instrumentation.common.logging.structured-attributes.included instead.
      This setting is ignored under v3-preview and will be removed in 3.0.
      Comma-separated list of case-sensitive glob patterns for MapMessage keys to capture as log
      attributes. "*" matches any number of characters and "?" matches one character. Excluded
      patterns take precedence over included patterns. No MapMessage attributes are captured unless
      an included pattern, an excluded pattern, or the deprecated
      otel.instrumentation.log4j-appender.experimental.capture-map-message-attributes setting is
      configured; configuring only excluded patterns captures all MapMessage attributes that do not
      match them. Captured MapMessage attributes may contain sensitive information.
    type: list
    default: ''
    examples:
      - "custom-map-message-key"
      - "request-*,user-?"
  - name: otel.instrumentation.log4j-appender.experimental.map-message-attributes.excluded
    declarative_name: java.log4j_appender.map_message_attributes/development.excluded
    description: >
      Deprecated; use otel.instrumentation.common.logging.structured-attributes.excluded instead.
      This setting is ignored under v3-preview and will be removed in 3.0.
      Comma-separated list of case-sensitive glob patterns for MapMessage keys not to capture as log
      attributes. "*" matches any number of characters and "?" matches one character. Excluded
      patterns take precedence over included patterns. No MapMessage attributes are captured unless
      an included pattern, an excluded pattern, or the deprecated
      otel.instrumentation.log4j-appender.experimental.capture-map-message-attributes setting is
      configured; configuring only excluded patterns captures all MapMessage attributes that do not
      match them. Captured MapMessage attributes may contain sensitive information.
    type: list
    default: ''
    examples:
      - "*-secret"
      - "password,token"
  - name: otel.instrumentation.log4j-appender.experimental.capture-map-message-attributes
    declarative_name: java.log4j_appender.capture_map_message_attributes/development
    description: >
      Deprecated; use otel.instrumentation.common.logging.structured-attributes.included instead.
      This setting is ignored under v3-preview and will be removed in 3.0. Outside v3-preview, true
      captures all MapMessage attributes and false captures none. It is ignored when a
      source-specific included or excluded pattern is configured.
    type: boolean
    default: false
  - name: otel.instrumentation.log4j-appender.experimental.capture-marker-attribute
    declarative_name: java.log4j_appender.capture_marker_attribute/development
    description: >
      Enables the capture of the Log4j marker attribute.
    type: boolean
    default: false
  - name: otel.instrumentation.log4j-appender.experimental.capture-template
    declarative_name: java.log4j_appender.capture_template/development
    description: >
      Enables the capture of the log message template (if arguments are provided).
    type: boolean
    default: false
  - name: otel.instrumentation.log4j-appender.experimental.capture-arguments
    declarative_name: java.log4j_appender.capture_arguments/development
    description: >
      Enables the capture of the log message arguments.
    type: boolean
    default: false
  - name: otel.instrumentation.log4j-appender.experimental.mdc-attributes.included
    declarative_name: java.log4j_appender.mdc_attributes/development.included
    description: >
      Comma-separated list of case-sensitive glob patterns for context data keys to capture as log
      attributes. "*" matches any number of characters and "?" matches one character. Excluded
      patterns take precedence over included patterns. No context data attributes are captured
      unless an included pattern, an excluded pattern, or the deprecated
      otel.instrumentation.log4j-appender.experimental.capture-mdc-attributes setting is configured;
      configuring only excluded patterns captures all context data attributes that do not match
      them. Captured context data attributes may contain sensitive information.
    type: list
    default: ''
    examples:
      - "custom-context-key"
      - "request-*,user-?"
  - name: otel.instrumentation.log4j-appender.experimental.mdc-attributes.excluded
    declarative_name: java.log4j_appender.mdc_attributes/development.excluded
    description: >
      Comma-separated list of case-sensitive glob patterns for context data keys not to capture as
      log attributes. "*" matches any number of characters and "?" matches one character. Excluded
      patterns take precedence over included patterns. No context data attributes are captured
      unless an included pattern, an excluded pattern, or the deprecated
      otel.instrumentation.log4j-appender.experimental.capture-mdc-attributes setting is configured;
      configuring only excluded patterns captures all context data attributes that do not match
      them. Captured context data attributes may contain sensitive information.
    type: list
    default: ''
    examples:
      - "*-secret"
      - "password,token"
  - name: otel.instrumentation.log4j-appender.experimental.capture-mdc-attributes
    declarative_name: java.log4j_appender.capture_mdc_attributes/development
    description: >
      Deprecated include-only alias for
      otel.instrumentation.log4j-appender.experimental.mdc-attributes.included. It does not support
      glob patterns: a list containing only "*" captures all context data attributes, and otherwise
      every entry, including one containing "*" or "?", is matched as a literal context data key. It
      is ignored when an included or excluded pattern is configured, and it may be removed in the
      next minor release.
    type: list
    default: ''
    examples:
      - "*"
      - "key1,key2"