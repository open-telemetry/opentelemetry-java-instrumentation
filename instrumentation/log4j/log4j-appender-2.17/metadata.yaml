description: >
  This instrumentation bridges Log4j log events to OpenTelemetry logs.
display_name: Log4j
library_link: https://logging.apache.org/log4j/2.x/
features:
  - LOGGING_BRIDGE
configurations:
  - name: otel.instrumentation.log4j-appender.experimental-log-attributes
    declarative_name: java.log4j_appender.experimental_log_attributes/development
    description: >
      Enables the capture of experimental log attributes, including thread name and thread ID.
    type: boolean
    default: false
  - name: otel.instrumentation.log4j-appender.experimental.capture-code-attributes
    declarative_name: java.log4j_appender.capture_code_attributes/development
    description: >
      Enables the capture of code location attributes, including file path, class name, method
      name, and line number.
    type: boolean
    default: false
  - name: otel.instrumentation.log4j-appender.experimental.capture-map-message-attributes
    declarative_name: java.log4j_appender.capture_map_message_attributes/development
    description: >
      Enables the capture of attributes from Log4j MapMessage instances.
    type: boolean
    default: false
  - name: otel.instrumentation.log4j-appender.experimental.capture-marker-attribute
    declarative_name: java.log4j_appender.capture_marker_attribute/development
    description: >
      Enables the capture of the Log4j marker attribute.
    type: boolean
    default: false
  - name: otel.instrumentation.log4j-appender.experimental.capture-template
    declarative_name: java.log4j_appender.capture_template/development
    description: >
      Enables the capture of the log message template (if arguments are provided).
    type: boolean
    default: false
  - name: otel.instrumentation.log4j-appender.experimental.capture-arguments
    declarative_name: java.log4j_appender.capture_arguments/development
    description: >
      Enables the capture of the log message arguments.
    type: boolean
    default: false
  - name: otel.instrumentation.log4j-appender.experimental.mdc-attributes.included
    declarative_name: java.log4j_appender.mdc_attributes/development.included
    description: >
      Comma-separated list of case-sensitive glob patterns for context data keys to capture as log
      attributes. "*" matches any number of characters and "?" matches one character. Excluded
      patterns take precedence over included patterns. No context data attributes are captured
      unless an included pattern, an excluded pattern, or the deprecated
      otel.instrumentation.log4j-appender.experimental.capture-mdc-attributes setting is configured;
      configuring only excluded patterns captures all context data attributes that do not match
      them. Captured context data attributes may contain sensitive information.
    type: list
    default: ''
    examples:
      - "custom-context-key"
      - "request-*,user-?"
  - name: otel.instrumentation.log4j-appender.experimental.mdc-attributes.excluded
    declarative_name: java.log4j_appender.mdc_attributes/development.excluded
    description: >
      Comma-separated list of case-sensitive glob patterns for context data keys not to capture as
      log attributes. "*" matches any number of characters and "?" matches one character. Excluded
      patterns take precedence over included patterns. No context data attributes are captured
      unless an included pattern, an excluded pattern, or the deprecated
      otel.instrumentation.log4j-appender.experimental.capture-mdc-attributes setting is configured;
      configuring only excluded patterns captures all context data attributes that do not match
      them. Captured context data attributes may contain sensitive information.
    type: list
    default: ''
    examples:
      - "*-secret"
      - "password,token"
  - name: otel.instrumentation.log4j-appender.experimental.capture-mdc-attributes
    declarative_name: java.log4j_appender.capture_mdc_attributes/development
    description: >
      Deprecated include-only alias for
      otel.instrumentation.log4j-appender.experimental.mdc-attributes.included. It does not support
      glob patterns: a list containing only "*" captures all context data attributes, and otherwise
      every entry, including one containing "*" or "?", is matched as a literal context data key. It
      is ignored when an included or excluded pattern is configured, and it may be removed in the
      next minor release.
    type: list
    default: ''
    examples:
      - "*"
      - "key1,key2"