description: >
  This instrumentation adds trace context (trace ID, span ID, and trace flags) to the Log4j MDC,
  it does not emit any telemetry on its own.
display_name: Log4j
library_link: https://logging.apache.org/log4j/1.2/
configurations:
  - ref: common.logging.trace-id-key
  - ref: common.logging.span-id-key
  - ref: common.logging.trace-flags-key
  - ref: common.logging.trace-id
  - ref: common.logging.span-id
  - ref: common.logging.trace-flags
  - name: otel.instrumentation.common.mdc.resource-attributes
    declarative_name: java.common.mdc.resource_attributes
    description: >
      Specifies which resource attributes to add to the logging context as a comma-separated list
      of attribute keys.
    type: list
    default: ''
