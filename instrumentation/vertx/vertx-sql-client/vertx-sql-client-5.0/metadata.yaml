display_name: Vert.x SQL Client
description: >
  This instrumentation enables database client spans and database client metrics for Vert.x SQL
  Client operations.
semantic_conventions:
  - DATABASE_CLIENT_SPANS
  - DATABASE_CLIENT_METRICS
library_link: https://github.com/eclipse-vertx/vertx-sql-client
configurations:
  - name: otel.instrumentation.vertx-sql-client.query-sanitization.enabled
    declarative_name: java.vertx_sql_client.query_sanitization.enabled
    description: >
      Enables query sanitization for Vert.x SQL client queries. Overrides
      `otel.instrumentation.common.db.query-sanitization.enabled` for this instrumentation; when
      unset, that setting applies.
    type: boolean
  - ref: common.db.query-sanitization.enabled
  - ref: common.db-statement-sanitizer.enabled
  - ref: common.database.statement_sanitizer.enabled
  - name: otel.instrumentation.vertx-sql-client.statement-sanitizer.enabled
    declarative_name: java.vertx_sql_client.statement_sanitizer.enabled
    description: "Deprecated: use `otel.instrumentation.vertx-sql-client.query-sanitization.enabled` instead. It is ignored under v3 preview and will be removed in 3.0."
    type: boolean
    default: true
    deprecated: true
    replaced_by: otel.instrumentation.vertx-sql-client.query-sanitization.enabled
