display_name: Vert.x Redis Client
description: >
  This instrumentation records the durable target a Vert.x Redis client was configured with.
  Dynamic options suppliers are omitted because they do not provide a stable client target. Spans
  and metrics themselves come from the Vert.x Redis Client 4.0 instrumentation.
library_link: https://vertx.io/docs/vertx-redis-client/java/
