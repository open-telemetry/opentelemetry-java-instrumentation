display_name: ClickHouse Java Client
description: >
  This instrumentation enables database client spans and database client metrics for the ClickHouse
  Java Client.
semantic_conventions:
  - DATABASE_CLIENT_SPANS
  - DATABASE_CLIENT_METRICS
library_link: https://github.com/ClickHouse/clickhouse-java
configurations:
  - name: otel.instrumentation.clickhouse.query-sanitization.enabled
    declarative_name: java.clickhouse.query_sanitization.enabled
    description: >
      Enables query sanitization for ClickHouse queries. Overrides
      `otel.instrumentation.common.db.query-sanitization.enabled` for this instrumentation; when
      unset, that setting applies.
    type: boolean
  - ref: common.db.query-sanitization.enabled
