display_name: gRPC
description: This instrumentation enables RPC client and RPC server spans and metrics for gRPC.
semantic_conventions:
  - RPC_CLIENT_SPANS
  - RPC_CLIENT_METRICS
  - RPC_SERVER_SPANS
  - RPC_SERVER_METRICS
library_link: https://github.com/grpc/grpc-java
configurations:
  - name: otel.instrumentation.grpc.emit-message-events
    declarative_name: java.grpc.emit_message_events
    type: boolean
    description: Determines whether to emit a span event for each individual message received and sent.
    default: true
  - name: otel.instrumentation.grpc.experimental-span-attributes
    declarative_name: java.grpc.experimental_span_attributes/development
    type: boolean
    description: >
      Enable the capture of experimental span attributes `grpc.received.message_count`,
      `grpc.sent.message_count` and `grpc.canceled`.
    default: false
  - name: otel.instrumentation.grpc.client.request-headers.included
    declarative_name: java.grpc.client.request_headers.included
    type: list
    description: >
      A comma-separated list of ASCII request header key patterns to capture on client spans.
      Matching is case-insensitive. `?` matches one character and `*` matches zero or more
      characters. No request headers are captured unless included or excluded patterns are
      configured. `*` captures all ASCII request headers.
    default: ''
    examples:
      - "custom-request-header"
      - "my-*-key,another-header-key"
  - name: otel.instrumentation.grpc.client.request-headers.excluded
    declarative_name: java.grpc.client.request_headers.excluded
    type: list
    description: >
      A comma-separated list of ASCII request header key patterns to exclude from client spans.
      Matching is case-insensitive. `?` matches one character and `*` matches zero or more
      characters. Excluded patterns take precedence over included patterns. If only excluded
      patterns are configured, all other ASCII request headers are captured, which may expose
      sensitive information.
    default: ''
    examples:
      - "authorization,*-token"
  - name: otel.instrumentation.grpc.server.request-headers.included
    declarative_name: java.grpc.server.request_headers.included
    type: list
    description: >
      A comma-separated list of ASCII request header key patterns to capture on server spans.
      Matching is case-insensitive. `?` matches one character and `*` matches zero or more
      characters. No request headers are captured unless included or excluded patterns are
      configured. `*` captures all ASCII request headers.
    default: ''
    examples:
      - "custom-request-header"
      - "my-*-key,another-header-key"
  - name: otel.instrumentation.grpc.server.request-headers.excluded
    declarative_name: java.grpc.server.request_headers.excluded
    type: list
    description: >
      A comma-separated list of ASCII request header key patterns to exclude from server spans.
      Matching is case-insensitive. `?` matches one character and `*` matches zero or more
      characters. Excluded patterns take precedence over included patterns. If only excluded
      patterns are configured, all other ASCII request headers are captured, which may expose
      sensitive information.
    default: ''
    examples:
      - "authorization,*-token"
