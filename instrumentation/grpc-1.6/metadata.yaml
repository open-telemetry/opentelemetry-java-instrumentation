display_name: gRPC
description: This instrumentation enables RPC client and RPC server spans and metrics for gRPC.
semantic_conventions:
  - RPC_CLIENT_SPANS
  - RPC_CLIENT_METRICS
  - RPC_SERVER_SPANS
  - RPC_SERVER_METRICS
library_link: https://github.com/grpc/grpc-java
configurations:
  - name: otel.instrumentation.grpc.emit-message-events
    declarative_name: java.grpc.emit_message_events
    type: boolean
    description: Determines whether to emit a span event for each individual message received and sent.
    default: true
  - name: otel.instrumentation.grpc.experimental-span-attributes
    declarative_name: java.grpc.experimental_span_attributes/development
    type: boolean
    description: >
      Enable the capture of experimental span attributes `grpc.received.message_count`,
      `grpc.sent.message_count` and `grpc.canceled`.
    default: false
  - name: otel.instrumentation.grpc.client.request-captured-headers
    declarative_name: java.grpc.client.request_captured_headers
    type: list
    description: >
      A comma-separated list of ASCII request header names to capture on client spans.
      Matching is case-insensitive and exact; wildcards are not supported.
      No headers are captured when unset or empty.
    default: ''
  - name: otel.instrumentation.grpc.server.request-captured-headers
    declarative_name: java.grpc.server.request_captured_headers
    type: list
    description: >
      A comma-separated list of ASCII request header names to capture on server spans.
      Matching is case-insensitive and exact; wildcards are not supported.
      No headers are captured when unset or empty.
    default: ''
