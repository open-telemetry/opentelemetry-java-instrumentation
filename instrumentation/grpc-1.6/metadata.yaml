display_name: gRPC
description: This instrumentation enables RPC client and RPC server spans and metrics for gRPC.
semantic_conventions:
  - RPC_CLIENT_SPANS
  - RPC_CLIENT_METRICS
  - RPC_SERVER_SPANS
  - RPC_SERVER_METRICS
library_link: https://github.com/grpc/grpc-java
configurations:
  - name: otel.instrumentation.grpc.emit-message-events
    declarative_name: java.grpc.emit_message_events
    type: boolean
    description: Determines whether to emit a span event for each individual message received and sent.
    default: true
  - name: otel.instrumentation.grpc.experimental-span-attributes
    declarative_name: java.grpc.experimental_span_attributes/development
    type: boolean
    description: >
      Enable the capture of experimental span attributes `grpc.received.message_count`,
      `grpc.sent.message_count` and `grpc.canceled`.
    default: false
  - name: otel.instrumentation.grpc.client.request-metadata.included
    declarative_name: java.grpc.client.request_metadata.included
    type: list
    description: >
      A comma-separated list of ASCII request metadata key patterns to capture on client spans.
      Matching is case-insensitive. `?` matches one character and `*` matches zero or more
      characters.
    default: ''
    examples:
      - "custom-request-header"
      - "my-*-key,another-metadata-key"
  - name: otel.instrumentation.grpc.client.request-metadata.excluded
    declarative_name: java.grpc.client.request_metadata.excluded
    type: list
    description: >
      A comma-separated list of ASCII request metadata key patterns to exclude from client spans.
      Excluded patterns take precedence over included patterns. Matching is case-insensitive. `?` matches one character and
      `*` matches zero or more characters. If included is not configured, all non-excluded ASCII
      metadata is captured, which may expose sensitive information.
    default: ''
    examples:
      - "authorization,*-token"
  - name: otel.instrumentation.grpc.server.request-metadata.included
    declarative_name: java.grpc.server.request_metadata.included
    type: list
    description: >
      A comma-separated list of ASCII request metadata key patterns to capture on server spans.
      Matching is case-insensitive. `?` matches one character and `*` matches zero or more
      characters.
    default: ''
    examples:
      - "custom-request-header"
      - "my-*-key,another-metadata-key"
  - name: otel.instrumentation.grpc.server.request-metadata.excluded
    declarative_name: java.grpc.server.request_metadata.excluded
    type: list
    description: >
      A comma-separated list of ASCII request metadata key patterns to exclude from server spans.
      Excluded patterns take precedence over included patterns. Matching is case-insensitive. `?` matches one character and
      `*` matches zero or more characters. If included is not configured, all non-excluded ASCII
      metadata is captured, which may expose sensitive information.
    default: ''
    examples:
      - "authorization,*-token"
  - name: otel.instrumentation.grpc.capture-metadata.client.request
    declarative_name: java.grpc.capture_metadata.client.request
    type: list
    description: >
      Deprecated: use `otel.instrumentation.grpc.client.request-metadata.included` instead. A
      comma-separated list of request metadata keys to capture on client spans. It does not support
      glob patterns: an entry containing `*` or `?` is ignored with a warning, and every other
      entry is matched as a literal metadata key.
    default: ''
  - name: otel.instrumentation.grpc.capture-metadata.server.request
    declarative_name: java.grpc.capture_metadata.server.request
    type: list
    description: >
      Deprecated: use `otel.instrumentation.grpc.server.request-metadata.included` instead. A
      comma-separated list of request metadata keys to capture on server spans. It does not support
      glob patterns: an entry containing `*` or `?` is ignored with a warning, and every other
      entry is matched as a literal metadata key.
    default: ''
