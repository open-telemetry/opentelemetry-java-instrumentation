display_name: Apache Geode
description: This instrumentation enables database client spans and database client metrics for Apache Geode cache operations.
library_link: https://geode.apache.org/
semantic_conventions:
  - DATABASE_CLIENT_SPANS
  - DATABASE_CLIENT_METRICS
configurations:
  - name: otel.instrumentation.geode.query-sanitization.enabled
    declarative_name: java.geode.query_sanitization.enabled
    description: >
      Enables query sanitization for Geode queries. Overrides
      `otel.instrumentation.common.db.query-sanitization.enabled` for this instrumentation; when
      unset, that setting applies.
    type: boolean
  - ref: common.db.query-sanitization.enabled
