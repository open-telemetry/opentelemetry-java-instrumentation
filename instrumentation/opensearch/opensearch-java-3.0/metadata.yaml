display_name: OpenSearch Java Client
description: >
  This instrumentation enables database client spans and database client metrics for the OpenSearch
  Java client.
library_link: https://docs.opensearch.org/latest/clients/java/
semantic_conventions:
  - DATABASE_CLIENT_SPANS
  - DATABASE_CLIENT_METRICS
configurations:
  - name: otel.instrumentation.opensearch.capture-search-query
    declarative_name: java.opensearch.capture_search_query
    description: >
      Deprecated and will be removed in 3.0, when search query bodies are always captured.
      There is no replacement. Until then, set this to false to disable capture. Search queries may
      contain personal or sensitive information.
    type: boolean
    default: true
    deprecated: true
  - name: otel.instrumentation.opensearch.query-sanitization.enabled
    declarative_name: java.opensearch.query_sanitization.enabled
    description: >
      Enables sanitization of captured search query bodies. Overrides
      `otel.instrumentation.common.db.query-sanitization.enabled` for this instrumentation; when
      unset, that setting applies. When disabled, bodies are captured verbatim and may contain
      personal or sensitive information.
    type: boolean
  - ref: common.db.query-sanitization.enabled
  - ref: common.db-statement-sanitizer.enabled
  - ref: common.database.statement_sanitizer.enabled
  - name: otel.instrumentation.opensearch.statement-sanitizer.enabled
    declarative_name: java.opensearch.statement_sanitizer.enabled
    description: "Deprecated: use `otel.instrumentation.opensearch.query-sanitization.enabled` instead. It is ignored under v3 preview and will be removed in 3.0."
    type: boolean
    default: true
    deprecated: true
    replaced_by: otel.instrumentation.opensearch.query-sanitization.enabled
