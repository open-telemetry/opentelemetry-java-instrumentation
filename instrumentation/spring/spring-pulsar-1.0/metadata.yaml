display_name: Spring Pulsar
description: This instrumentation enables consumer messaging spans for Spring Pulsar listeners.
library_link: https://spring.io/projects/spring-pulsar
semantic_conventions:
  - MESSAGING_SPANS
configurations:
  - name: otel.instrumentation.messaging.experimental.receive-spans.enabled
    declarative_name: java.common.messaging.receive_spans/development.enabled
    description: >
      Enables experimental receive spans, which will cause consumers to start a new trace, with
      only a span link connecting it to the producer trace.
    type: boolean
    default: false
  - ref: messaging.capture-headers
  - name: otel.instrumentation.pulsar.experimental-span-attributes
    declarative_name: java.pulsar.experimental_span_attributes/development
    description: >
      Enables capturing experimental span attribute `messaging.pulsar.message.type` on PRODUCER spans.
    type: boolean
    default: false
