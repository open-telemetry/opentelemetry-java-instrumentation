display_name: Spring AI
description: >
  This instrumentation creates GenAI client spans for Spring AI ChatModel calls.
library_link: https://spring.io/projects/spring-ai
semantic_conventions:
  - GENAI_CLIENT_SPANS
  - GENAI_CLIENT_METRICS
configurations:
  - name: otel.instrumentation.genai.capture-message-content
    declarative_name: java.common.gen_ai.capture_message_content
    type: boolean
    default: false
    description: >
      Enables including the full content of system, user, assistant, and tool messages in emitted
      log events. Note that full content can have data privacy and size concerns, and care should be
      taken when enabling this.
