otel:
  experimental:
    resource:
      disabled:
        keys: [ a,b ]
  propagators: [ baggage, b3 ]
  logs:
    exporter: [ console ]
  metrics:
    exporter: [ console ]
  traces:
    exporter: [ console ]

  instrumentation:
    http:
      known-methods: [ a,b ]
      client:
        request-captured-headers: [ a,b ]
        response-captured-headers: [ a,b ]
      server:
        request-captured-headers: [ a,b ]
        response-captured-headers: [ a,b ]
