display_name: Spring Security
description: >
  This instrumentation does not emit any telemetry on its own. Instead, it captures identity
  attributes, and is only enabled when at least one common identity configuration is enabled.
library_link: https://spring.io/projects/spring-security
configurations:
  - ref: common.user.name.enabled
  - ref: common.user.roles.enabled
  - name: otel.instrumentation.spring-security.user.roles.granted-authority-prefix
    declarative_name: java.spring_security.user.roles.granted_authority_prefix
    description: Prefix of granted authorities identifying roles to capture in the `user.roles` semantic attribute.
    type: string
    default: "ROLE_"
