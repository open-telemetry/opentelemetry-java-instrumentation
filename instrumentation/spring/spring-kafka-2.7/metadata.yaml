display_name: Spring Kafka
description: This instrumentation enables consumer messaging spans for Spring Kafka listeners.
library_link: https://spring.io/projects/spring-kafka
semantic_conventions:
  - MESSAGING_SPANS
configurations:
  - name: otel.instrumentation.messaging.experimental.receive-telemetry.enabled
    declarative_name: java.common.messaging.receive_telemetry/development.enabled
    description: >
      Controls experimental receive spans for pull-based messaging operations. When unset, receive
      spans are enabled with stable messaging semantic conventions or v3-preview, and disabled otherwise.
    type: boolean
    default_is_conditional: true
  - ref: messaging.capture-headers
  - name: otel.instrumentation.kafka.experimental-span-attributes
    declarative_name: java.kafka.experimental_span_attributes/development
    description: Enables the capture of the experimental consumer attribute `kafka.record.queue_time_ms` and `messaging.kafka.bootstrap.servers`.
    type: boolean
    default: false
