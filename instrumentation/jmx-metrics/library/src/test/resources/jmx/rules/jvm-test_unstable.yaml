---
# subset of jvm rules for testing without dependency on real jvm metrics evolution
rules:

  - bean: java.lang:type=Threading
    prefix: jvm.thread.
    mapping:

      # jvm.file_descriptor.count (experimental)
      OpenFileDescriptorCount:
        metric: file_descriptor.count
        type: updowncounter
        unit: "{file_descriptor}"
        desc: Number of open file descriptors as reported by the JVM.
      # jvm.file_descriptor.limit (experimental)
      MaxFileDescriptorCount:
        metric: file_descriptor.limit
        type: updowncounter
        unit: "{file_descriptor}"
        desc: Measure of max open file descriptors as reported by the JVM.

