---
rules:
  # Using JMX domain as prefix for all metrics helps to provide a consistent naming
  # scheme and also helps prevent name collisions.

  # Broker metrics

  - bean: kafka.server:type=BrokerTopicMetrics,name=MessagesInPerSec,topic=*
    metricAttribute:
      kafka.topic.name: param(topic)
    mapping:
      Count:
        metric: kafka.server.messages
        type: counter
        desc: The number of messages received by the broker
        unit: "{message}"

  - bean: kafka.server:type=BrokerTopicMetrics,name=TotalFetchRequestsPerSec,topic=*
    metricAttribute:
      kafka.request.type: const(fetch)
      kafka.topic.name: param(topic)
    mapping:
      Count:
        metric: kafka.server.requests
        type: counter
        desc: &desc The number of requests received by the broker
        unit: "{request}"

  - bean: kafka.server:type=BrokerTopicMetrics,name=TotalProduceRequestsPerSec,topic=*
    metricAttribute:
      kafka.request.type: const(produce)
      kafka.topic.name: param(topic)
    mapping:
      Count:
        metric: kafka.server.requests
        type: counter
        desc: *desc
        unit: "{request}"

  - bean: kafka.server:type=BrokerTopicMetrics,name=FailedFetchRequestsPerSec,topic=*
    metricAttribute:
      kafka.request.type: const(fetch)
      kafka.topic.name: param(topic)
    mapping:
      Count:
        metric: kafka.server.failed_requests
        type: counter
        desc: &desc The number of requests to the broker resulting in a failure
        unit: "{request}"

  - bean: kafka.server:type=BrokerTopicMetrics,name=FailedProduceRequestsPerSec,topic=*
    metricAttribute:
      kafka.request.type: const(produce)
      kafka.topic.name: param(topic)
    mapping:
      Count:
        metric: kafka.server.failed_requests
        type: counter
        desc: *desc
        unit: "{request}"

  - bean: kafka.server:type=BrokerTopicMetrics,name=BytesInPerSec,topic=*
    metricAttribute:
      network.io.direction: const(receive)
      kafka.topic.name: param(topic)
    mapping:
      Count:
        metric: kafka.server.network.io
        type: counter
        desc: &desc The bytes received or sent by the broker
        unit: By

  - bean: kafka.server:type=BrokerTopicMetrics,name=BytesOutPerSec,topic=*
    metricAttribute:
      network.io.direction: const(transmit)
      kafka.topic.name: param(topic)
    mapping:
      Count:
        metric: kafka.server.network.io
        type: counter
        desc: *desc
        unit: By

  - beans:
      - kafka.server:type=DelayedOperationPurgatory,name=PurgatorySize,delayedOperation=Produce
      - kafka.server:type=DelayedOperationPurgatory,name=PurgatorySize,delayedOperation=Fetch
    metricAttribute:
      kafka.request.type: lowercase(param(delayedOperation))
    mapping:
      Value:
        metric: kafka.server.purgatory.size
        type: updowncounter
        desc: The number of requests waiting in purgatory
        unit: "{request}"

  # Network metrics

  - beans:
      - kafka.network:type=RequestMetrics,name=TotalTimeMs,request=Produce
      - kafka.network:type=RequestMetrics,name=TotalTimeMs,request=FetchConsumer
      - kafka.network:type=RequestMetrics,name=TotalTimeMs,request=FetchFollower
    metricAttribute:
      kafka.request.type: lowercase(param(request))
    mapping:
      # This is not redundant with kafka.server.requests because a single network request can trigger
      # multiple increments to 'kafka.server.requests'. It also provides an additional breakdown of
      # fetch requests with 'fetchconsumer' and 'fetchfollower' request types.
      Count:
        metric: kafka.network.requests
        type: counter
        desc: The number of network requests received by the broker
        unit: "{request}"
      50thPercentile:
        metric: kafka.network.request.duration.p50
        type: gauge
        desc: The 50th percentile duration the broker has taken to service network requests
        sourceUnit: ms
        unit: s
      99thPercentile:
        metric: kafka.network.request.duration.p99
        type: gauge
        desc: The 99th percentile duration the broker has taken to service network requests
        sourceUnit: ms
        unit: s

  - bean: kafka.network:type=RequestChannel,name=RequestQueueSize
    mapping:
      Value:
        metric: kafka.network.request.queue
        type: updowncounter
        desc: Size of the network request queue
        unit: "{request}"

  # Controller and replica metrics

  - bean: kafka.server:type=ReplicaManager,name=PartitionCount
    mapping:
      Value:
        metric: kafka.server.partition.count
        type: updowncounter
        desc: The number of partitions on the broker
        unit: "{partition}"

  - bean: kafka.controller:type=KafkaController,name=OfflinePartitionsCount
    mapping:
      Value:
        metric: kafka.controller.partition.offline
        type: updowncounter
        desc: The number of partitions offline
        unit: "{partition}"

  - bean: kafka.server:type=ReplicaManager,name=UnderReplicatedPartitions
    mapping:
      Value:
        metric: kafka.server.partition.under_replicated
        type: updowncounter
        desc: The number of under-replicated partitions
        unit: "{partition}"

  - bean: kafka.server:type=ReplicaManager,name=IsrShrinksPerSec
    metricAttribute:
      kafka.server.isr.operation: const(shrink)
    mapping:
      Count:
        metric: kafka.server.isr.operations
        type: counter
        desc: &desc The number of in-sync replica operations
        unit: "{operation}"

  - bean: kafka.server:type=ReplicaManager,name=IsrExpandsPerSec
    metricAttribute:
      kafka.server.isr.operation: const(expand)
    mapping:
      Count:
        metric: kafka.server.isr.operations
        type: counter
        desc: *desc
        unit: "{operation}"

  - bean: kafka.server:type=ReplicaFetcherManager,name=MaxLag,clientId=Replica
    mapping:
      Value:
        metric: kafka.server.lag.max
        desc: The max lag in messages between follower and leader replicas
        unit: "{message}"

  - bean: kafka.controller:type=KafkaController,name=ActiveControllerCount
    mapping:
      Value:
        metric: kafka.controller.active.count
        type: updowncounter
        desc: The number of controllers active on the broker
        unit: "{controller}"

  - bean: kafka.controller:type=ControllerStats,name=LeaderElectionRateAndTimeMs
    mapping:
      Count:
        metric: kafka.controller.leader_elections
        type: counter
        desc: The leader election count
        unit: "{election}"

  - bean: kafka.controller:type=ControllerStats,name=UncleanLeaderElectionsPerSec
    mapping:
      Count:
        metric: kafka.controller.unclean_leader_elections
        type: counter
        desc: Unclean leader election count
        unit: "{election}"

  # Log metrics

  - bean: kafka.log:type=LogFlushStats,name=LogFlushRateAndTimeMs
    type: gauge
    mapping:
      Count:
        metric: kafka.log.flushes
        type: counter
        unit: "{flush}"
        desc: Log flush count
      50thPercentile:
        metric: kafka.log.flush.duration.p50
        desc: Log flush duration 50th percentile
        sourceUnit: ms
        unit: s
      99thPercentile:
        metric: kafka.log.flush.duration.p99
        desc: Log flush duration 99th percentile
        sourceUnit: ms
        unit: s

  # Additional broker metrics

  - bean: kafka.server:type=ReplicaManager,name=LeaderCount
    mapping:
      Value:
        metric: kafka.leader.count
        type: gauge
        unit: "{leader}"
        desc: The number of leaders assigned to the broker.

  - bean: kafka.server:type=ReplicaManager,name=IsrExpandsPerSec
    metricAttribute:
      kafka.server.isr.operation: const(expand)
    prefix: kafka.isr.operation.
    mapping:
      OneMinuteRate:
        metric: rate.1m
        type: gauge
        unit: "{operation}/s"
        desc: The one-minute rate of ISR expand and shrink operations.
      FiveMinuteRate:
        metric: rate.5m
        type: gauge
        unit: "{operation}/s"
        desc: The five-minute rate of ISR expand and shrink operations.
      FifteenMinuteRate:
        metric: rate.15m
        type: gauge
        unit: "{operation}/s"
        desc: The fifteen-minute rate of ISR expand and shrink operations.
      MeanRate:
        metric: rate.mean
        type: gauge
        unit: "{operation}/s"
        desc: The mean rate of ISR expand and shrink operations.

  - bean: kafka.server:type=ReplicaManager,name=IsrShrinksPerSec
    metricAttribute:
      kafka.server.isr.operation: const(shrink)
    prefix: kafka.isr.operation.
    mapping:
      OneMinuteRate:
        metric: rate.1m
        type: gauge
        unit: "{operation}/s"
        desc: The one-minute rate of ISR expand and shrink operations.
      FiveMinuteRate:
        metric: rate.5m
        type: gauge
        unit: "{operation}/s"
        desc: The five-minute rate of ISR expand and shrink operations.
      FifteenMinuteRate:
        metric: rate.15m
        type: gauge
        unit: "{operation}/s"
        desc: The fifteen-minute rate of ISR expand and shrink operations.
      MeanRate:
        metric: rate.mean
        type: gauge
        unit: "{operation}/s"
        desc: The mean rate of ISR expand and shrink operations.

  - bean: kafka.server:type=BrokerTopicMetrics,name=BytesInPerSec
    metricAttribute:
      network.io.direction: const(receive)
    prefix: kafka.network.io.
    mapping:
      OneMinuteRate:
        metric: rate.1m
        type: gauge
        unit: By/s
        desc: The one-minute inbound or outbound byte rate.
      FiveMinuteRate:
        metric: rate.5m
        type: gauge
        unit: By/s
        desc: The five-minute inbound or outbound byte rate.
      FifteenMinuteRate:
        metric: rate.15m
        type: gauge
        unit: By/s
        desc: The fifteen-minute inbound or outbound byte rate.
      MeanRate:
        metric: rate.mean
        type: gauge
        unit: By/s
        desc: The mean inbound or outbound byte rate.

  - bean: kafka.server:type=BrokerTopicMetrics,name=BytesOutPerSec
    metricAttribute:
      network.io.direction: const(transmit)
    prefix: kafka.network.io.
    mapping:
      OneMinuteRate:
        metric: rate.1m
        type: gauge
        unit: By/s
        desc: The one-minute inbound or outbound byte rate.
      FiveMinuteRate:
        metric: rate.5m
        type: gauge
        unit: By/s
        desc: The five-minute inbound or outbound byte rate.
      FifteenMinuteRate:
        metric: rate.15m
        type: gauge
        unit: By/s
        desc: The fifteen-minute inbound or outbound byte rate.
      MeanRate:
        metric: rate.mean
        type: gauge
        unit: By/s
        desc: The mean inbound or outbound byte rate.

  # The existing target reports total request time for the primary
  # Produce/Fetch request types. These rules add the 99th percentile for every
  # request type exposed by Kafka without redefining that existing metric.

  - bean: kafka.network:type=RequestMetrics,name=TotalTimeMs,request=*
    metricAttribute:
      kafka.request.type: lowercase(param(request))
    prefix: kafka.request.total.time.
    mapping:
      99thPercentile:
        metric: p99
        type: gauge
        sourceUnit: ms
        unit: s
        desc: The 99th percentile total request time.

  - bean: kafka.network:type=RequestMetrics,name=RequestQueueTimeMs,request=*
    metricAttribute:
      kafka.request.type: lowercase(param(request))
    prefix: kafka.request.queue.time.
    mapping:
      99thPercentile:
        metric: p99
        type: gauge
        sourceUnit: ms
        unit: s
        desc: The 99th percentile time requests spend queued before processing.

  - bean: kafka.network:type=RequestMetrics,name=LocalTimeMs,request=*
    metricAttribute:
      kafka.request.type: lowercase(param(request))
    prefix: kafka.request.local.time.
    mapping:
      99thPercentile:
        metric: p99
        type: gauge
        sourceUnit: ms
        unit: s
        desc: The 99th percentile local processing time for requests.

  - bean: kafka.network:type=RequestMetrics,name=RemoteTimeMs,request=*
    metricAttribute:
      kafka.request.type: lowercase(param(request))
    prefix: kafka.request.remote.time.
    mapping:
      99thPercentile:
        metric: p99
        type: gauge
        sourceUnit: ms
        unit: s
        desc: The 99th percentile remote processing time for requests.

  - bean: kafka.network:type=RequestMetrics,name=ResponseQueueTimeMs,request=*
    metricAttribute:
      kafka.request.type: lowercase(param(request))
    prefix: kafka.request.response.queue.time.
    mapping:
      99thPercentile:
        metric: p99
        type: gauge
        sourceUnit: ms
        unit: s
        desc: The 99th percentile time responses spend queued before send.

  - bean: kafka.network:type=RequestMetrics,name=ResponseSendTimeMs,request=*
    metricAttribute:
      kafka.request.type: lowercase(param(request))
    prefix: kafka.request.response.send.time.
    mapping:
      99thPercentile:
        metric: p99
        type: gauge
        sourceUnit: ms
        unit: s
        desc: The 99th percentile response send time.

  - bean: kafka.network:type=SocketServer,name=NetworkProcessorAvgIdlePercent
    mapping:
      Value:
        metric: kafka.network.processor.idle.average
        type: gauge
        unit: "1"
        desc: The average fraction of time network processors are idle.

  # Kafka exposes these idle measurements as fractions from 0 to 1 through
  # Meter rate attributes, despite the Percent suffix in the MBean name.
  - bean: kafka.server:type=KafkaRequestHandlerPool,name=RequestHandlerAvgIdlePercent
    prefix: kafka.request.handler.idle.
    mapping:
      MeanRate:
        metric: mean
        type: gauge
        unit: "1"
        desc: The mean fraction of time request handlers are idle.
      OneMinuteRate:
        metric: 1m
        type: gauge
        unit: "1"
        desc: The one-minute fraction of time request handlers are idle.

  - bean: kafka.network:type=Processor,name=IdlePercent,*
    metricAttribute:
      kafka.network.processor.id: param(networkProcessor)
    mapping:
      Value:
        metric: kafka.network.processor.idle.utilization
        type: gauge
        unit: "1"
        desc: The idle fraction of an individual network processor.
