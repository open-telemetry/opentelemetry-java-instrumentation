---
rules:

  # Broker metrics

  - bean: kafka.server:type=BrokerTopicMetrics,name=MessagesInPerSec
    # TODO: add topic breakdown
    mapping:
      Count:
        metric: kafka.message.count
        type: counter
        desc: The number of messages received by the broker
        unit: "{message}"

  - bean: kafka.server:type=BrokerTopicMetrics,name=TotalFetchRequestsPerSec
    metricAttribute:
      # TODO: add topic breakdown
      kafka.request.type: const(fetch)
    mapping:
      Count:
        metric: kafka.request.count
        type: counter
        desc: &desc The number of requests received by the broker
        unit: "{request}"

  - bean: kafka.server:type=BrokerTopicMetrics,name=TotalProduceRequestsPerSec
    metricAttribute:
      # TODO: add topic breakdown
      kafka.request.type: const(produce)
    mapping:
      Count:
        metric: kafka.request.count
        type: counter
        desc: *desc
        unit: "{request}"

  - bean: kafka.server:type=BrokerTopicMetrics,name=FailedFetchRequestsPerSec
    metricAttribute:
      # TODO: add topic breakdown
      kafka.request.type: const(fetch)
    mapping:
      Count:
        metric: kafka.request.failed
        type: counter
        desc: &desc The number of requests to the broker resulting in a failure
        unit: "{request}"

  - bean: kafka.server:type=BrokerTopicMetrics,name=FailedProduceRequestsPerSec
    metricAttribute:
      kafka.request.type: const(produce)
    mapping:
      Count:
        metric: kafka.request.failed
        type: counter
        desc: *desc
        unit: "{request}"

  - bean: kafka.server:type=BrokerTopicMetrics,name=BytesInPerSec
    metricAttribute:
      # TODO: add topic breakdown
      network.io.direction: const(receive)
    mapping:
      Count:
        metric: kafka.network.io
        type: counter
        desc: &desc The bytes received or sent by the broker
        unit: By

  - bean: kafka.server:type=BrokerTopicMetrics,name=BytesOutPerSec
    metricAttribute:
      # TODO: add topic breakdown
      network.io.direction: const(transmit)
    mapping:
      Count:
        metric: kafka.network.io
        type: counter
        desc: *desc
        unit: By

  - beans:
      - kafka.server:type=DelayedOperationPurgatory,name=PurgatorySize,delayedOperation=Produce
      - kafka.server:type=DelayedOperationPurgatory,name=PurgatorySize,delayedOperation=Fetch
    metricAttribute:
      kafka.request.type: lowercase(param(delayedOperation))
    mapping:
      Value:
        metric: kafka.purgatory.size
        type: updowncounter
        desc: The number of requests waiting in purgatory
        unit: "{request}"

  # Network metrics

  - beans:
      - kafka.network:type=RequestMetrics,name=TotalTimeMs,request=Produce
      - kafka.network:type=RequestMetrics,name=TotalTimeMs,request=FetchConsumer
      - kafka.network:type=RequestMetrics,name=TotalTimeMs,request=FetchFollower
    metricAttribute:
      kafka.request.type: lowercase(param(request))
    mapping:
      # This is not redundant with kafka.request.count because a single network request can trigger
      # multiple increments to 'kafka.request.count', also it provide an additional breakdown of
      # fetch requests with 'fetchrequest' and 'fetchfollower' request types.
      Count:
        metric: kafka.network.request.count
        type: counter
        desc: The number of requests received by the broker
        unit: "{request}"
      50thPercentile:
        metric: kafka.network.request.duration.p50
        type: gauge
        desc: The 50th percentile duration the broker has taken to service requests
        sourceUnit: ms
        unit: s
      99thPercentile:
        metric: kafka.network.request.duration.p99
        type: gauge
        desc: The 99th percentile duration the broker has taken to service requests
        sourceUnit: ms
        unit: s

  - bean: kafka.network:type=RequestChannel,name=RequestQueueSize
    mapping:
      Value:
        metric: kafka.network.request.queue
        type: updowncounter
        desc: Size of the request queue
        unit: "{request}"

  # Controller and replica metrics

  - bean: kafka.server:type=ReplicaManager,name=PartitionCount
    mapping:
      Value:
        metric: kafka.partition.count
        type: updowncounter
        desc: The number of partitions on the broker
        unit: "{partition}"

  - bean: kafka.controller:type=KafkaController,name=OfflinePartitionsCount
    mapping:
      Value:
        metric: kafka.partition.offline
        type: updowncounter
        desc: The number of partitions offline
        unit: "{partition}"

  - bean: kafka.server:type=ReplicaManager,name=UnderReplicatedPartitions
    mapping:
      Value:
        metric: kafka.partition.under_replicated
        type: updowncounter
        desc: The number of under-replicated partitions
        unit: "{partition}"

  - bean: kafka.server:type=ReplicaManager,name=IsrShrinksPerSec
    metricAttribute:
      kafka.isr.operation: const(shrink)
    mapping:
      Count:
        metric: kafka.isr.operation.count
        type: updowncounter
        desc: &desc The number of in-sync replica operations
        unit: "{operation}"

  - bean: kafka.server:type=ReplicaManager,name=IsrExpandsPerSec
    metricAttribute:
      kafka.isr.operation: const(expand)
    mapping:
      Count:
        metric: kafka.isr.operation.count
        type: updowncounter
        desc: *desc
        unit: "{operation}"

  - bean: kafka.server:type=ReplicaFetcherManager,name=MaxLag,clientId=Replica
    mapping:
      Value:
        metric: kafka.lag.max
        desc: The max lag in messages between follower and leader replicas
        unit: "{message}"

  - bean: kafka.controller:type=KafkaController,name=ActiveControllerCount
    mapping:
      Value:
        metric: kafka.controller.active.count
        type: updowncounter
        desc: The number of controllers active on the broker
        unit: "{controller}"

  - bean: kafka.controller:type=ControllerStats,name=LeaderElectionRateAndTimeMs
    mapping:
      Count:
        metric: kafka.leader_election.count
        type: counter
        desc: The leader election count
        unit: "{election}"

  - bean: kafka.controller:type=ControllerStats,name=UncleanLeaderElectionsPerSec
    mapping:
      Count:
        metric: kafka.leader_election.unclean.count
        type: counter
        desc: Unclean leader election count
        unit: "{election}"

  # Log metrics

  - bean: kafka.log:type=LogFlushStats,name=LogFlushRateAndTimeMs
    type: gauge
    mapping:
      Count:
        metric: kafka.log.flush.count
        type: counter
        unit: "{flush}"
        desc: Log flush count
      50thPercentile:
        metric: kafka.log.flush.duration.p50
        desc: Log flush duration 50th percentile
        sourceUnit: ms
        unit: s
      99thPercentile:
        metric: kafka.log.flush.duration.p99
        desc: Log flush duration 99th percentile
        sourceUnit: ms
        unit: s
