---
rules:
  # Broker metrics

  - bean: kafka.server:type=BrokerTopicMetrics,name=MessagesInPerSec
    mapping:
      Count:
        metric: kafka.message.count
        type: counter
        desc: The number of messages received by the broker
        unit: "{messages}"

  - bean: kafka.server:type=BrokerTopicMetrics,name=TotalFetchRequestsPerSec
    metricAttribute:
      type: const(fetch)
    mapping:
      Count:
        metric: kafka.request.count
        type: counter
        desc: The number of requests received by the broker
        unit: "{requests}"

  - bean: kafka.server:type=BrokerTopicMetrics,name=TotalProduceRequestsPerSec
    metricAttribute:
      type: const(produce)
    mapping:
      Count:
        metric: kafka.request.count
        type: counter
        desc: The number of requests received by the broker
        unit: "{requests}"

  - bean: kafka.server:type=BrokerTopicMetrics,name=FailedFetchRequestsPerSec
    metricAttribute:
      type: const(fetch)
    mapping:
      Count:
        metric: kafka.request.failed
        type: counter
        desc: The number of requests to the broker resulting in a failure
        unit: "{requests}"

  - bean: kafka.server:type=BrokerTopicMetrics,name=FailedProduceRequestsPerSec
    metricAttribute:
      type: const(produce)
    mapping:
      Count:
        metric: kafka.request.failed
        type: counter
        desc: The number of requests to the broker resulting in a failure
        unit: "{requests}"

  - beans:
      - kafka.network:type=RequestMetrics,name=TotalTimeMs,request=Produce
      - kafka.network:type=RequestMetrics,name=TotalTimeMs,request=FetchConsumer
      - kafka.network:type=RequestMetrics,name=TotalTimeMs,request=FetchFollower
    metricAttribute:
      type: param(request)
    unit: ms
    mapping:
      Count:
        metric: kafka.request.time.total
        type: counter
        desc: The total time the broker has taken to service requests
      50thPercentile:
        metric: kafka.request.time.50p
        type: gauge
        desc: The 50th percentile time the broker has taken to service requests
      99thPercentile:
        metric: kafka.request.time.99p
        type: gauge
        desc: The 99th percentile time the broker has taken to service requests

  - bean: kafka.network:type=RequestChannel,name=RequestQueueSize
    mapping:
      Value:
        metric: kafka.request.queue
        type: updowncounter
        desc: Size of the request queue
        unit: "{requests}"

  - bean: kafka.server:type=BrokerTopicMetrics,name=BytesInPerSec
    metricAttribute:
      direction: const(in)
    mapping:
      Count:
        metric: kafka.network.io
        type: counter
        desc: The bytes received or sent by the broker
        unit: By

  - bean: kafka.server:type=BrokerTopicMetrics,name=BytesOutPerSec
    metricAttribute:
      direction: const(out)
    mapping:
      Count:
        metric: kafka.network.io
        type: counter
        desc: The bytes received or sent by the broker
        unit: By

  - beans:
      - kafka.server:type=DelayedOperationPurgatory,name=PurgatorySize,delayedOperation=Produce
      - kafka.server:type=DelayedOperationPurgatory,name=PurgatorySize,delayedOperation=Fetch
    metricAttribute:
      type: param(delayedOperation)
    mapping:
      Value:
        metric: kafka.purgatory.size
        type: updowncounter
        desc: The number of requests waiting in purgatory
        unit: "{requests}"

  - bean: kafka.server:type=ReplicaManager,name=PartitionCount
    mapping:
      Value:
        metric: kafka.partition.count
        type: updowncounter
        desc: The number of partitions on the broker
        unit: "{partitions}"

  - bean: kafka.controller:type=KafkaController,name=OfflinePartitionsCount
    mapping:
      Value:
        metric: kafka.partition.offline
        type: updowncounter
        desc: The number of partitions offline
        unit: "{partitions}"

  - bean: kafka.server:type=ReplicaManager,name=UnderReplicatedPartitions
    mapping:
      Value:
        metric: kafka.partition.underReplicated
        type: updowncounter
        desc: The number of under replicated partitions
        unit: "{partitions}"

  - bean: kafka.server:type=ReplicaManager,name=IsrShrinksPerSec
    metricAttribute:
      operation: const(shrink)
    mapping:
      Count:
        metric: kafka.isr.operation.count
        type: updowncounter
        desc: The number of in-sync replica shrink and expand operations
        unit: "{operations}"

  - bean: kafka.server:type=ReplicaManager,name=IsrExpandsPerSec
    metricAttribute:
      operation: const(expand)
    mapping:
      Count:
        metric: kafka.isr.operation.count
        type: updowncounter
        desc: The number of in-sync replica shrink and expand operations
        unit: "{operations}"

  - bean: kafka.server:type=ReplicaFetcherManager,name=MaxLag,clientId=Replica
    mapping:
      Value:
        metric: kafka.lag.max
        desc: The max lag in messages between follower and leader replicas
        unit: "{messages}"

  - bean: kafka.controller:type=KafkaController,name=ActiveControllerCount
    mapping:
      Value:
        metric: kafka.controller.active.count
        type: updowncounter
        desc: The number of controllers active on the broker
        unit: "{controllers}"

  - bean: kafka.controller:type=ControllerStats,name=LeaderElectionRateAndTimeMs
    mapping:
      Count:
        metric: kafka.leaderElection.count
        type: counter
        desc: The leader election count
        unit: "{elections}"

  - bean: kafka.controller:type=ControllerStats,name=UncleanLeaderElectionsPerSec
    mapping:
      Count:
        metric: kafka.leaderElection.unclean.count
        type: counter
        desc: Unclean leader election count - increasing indicates broker failures
        unit: "{elections}"

  # Log metrics

  - bean: kafka.log:type=LogFlushStats,name=LogFlushRateAndTimeMs
    unit: ms
    type: gauge
    prefix: kafka.logs.flush.
    mapping:
      Count:
        type: counter
        desc: Log flush count
      50thPercentile:
        metric: time.50p
        desc: Log flush time - 50th percentile
      99thPercentile:
        metric: time.99p
        desc: Log flush time - 99th percentile

  # Additional broker metrics

  - bean: kafka.server:type=ReplicaManager,name=LeaderCount
    mapping:
      Value:
        metric: kafka.leader.count
        type: gauge
        unit: "{leader}"
        desc: The number of leaders assigned to the broker.

  - bean: kafka.server:type=ReplicaManager,name=IsrExpandsPerSec
    metricAttribute:
      operation: const(expand)
    prefix: kafka.isr.operation.
    mapping:
      OneMinuteRate:
        metric: rate.1m
        type: gauge
        unit: "{operation}/s"
        desc: The one-minute rate of ISR expand and shrink operations.
      FiveMinuteRate:
        metric: rate.5m
        type: gauge
        unit: "{operation}/s"
        desc: The five-minute rate of ISR expand and shrink operations.
      FifteenMinuteRate:
        metric: rate.15m
        type: gauge
        unit: "{operation}/s"
        desc: The fifteen-minute rate of ISR expand and shrink operations.
      MeanRate:
        metric: rate.mean
        type: gauge
        unit: "{operation}/s"
        desc: The mean rate of ISR expand and shrink operations.

  - bean: kafka.server:type=ReplicaManager,name=IsrShrinksPerSec
    metricAttribute:
      operation: const(shrink)
    prefix: kafka.isr.operation.
    mapping:
      OneMinuteRate:
        metric: rate.1m
        type: gauge
        unit: "{operation}/s"
        desc: The one-minute rate of ISR expand and shrink operations.
      FiveMinuteRate:
        metric: rate.5m
        type: gauge
        unit: "{operation}/s"
        desc: The five-minute rate of ISR expand and shrink operations.
      FifteenMinuteRate:
        metric: rate.15m
        type: gauge
        unit: "{operation}/s"
        desc: The fifteen-minute rate of ISR expand and shrink operations.
      MeanRate:
        metric: rate.mean
        type: gauge
        unit: "{operation}/s"
        desc: The mean rate of ISR expand and shrink operations.

  - bean: kafka.server:type=BrokerTopicMetrics,name=BytesInPerSec
    metricAttribute:
      direction: const(in)
    prefix: kafka.network.io.
    mapping:
      OneMinuteRate:
        metric: rate.1m
        type: gauge
        unit: By/s
        desc: The one-minute inbound or outbound byte rate.
      FiveMinuteRate:
        metric: rate.5m
        type: gauge
        unit: By/s
        desc: The five-minute inbound or outbound byte rate.
      FifteenMinuteRate:
        metric: rate.15m
        type: gauge
        unit: By/s
        desc: The fifteen-minute inbound or outbound byte rate.
      MeanRate:
        metric: rate.mean
        type: gauge
        unit: By/s
        desc: The mean inbound or outbound byte rate.

  - bean: kafka.server:type=BrokerTopicMetrics,name=BytesOutPerSec
    metricAttribute:
      direction: const(out)
    prefix: kafka.network.io.
    mapping:
      OneMinuteRate:
        metric: rate.1m
        type: gauge
        unit: By/s
        desc: The one-minute inbound or outbound byte rate.
      FiveMinuteRate:
        metric: rate.5m
        type: gauge
        unit: By/s
        desc: The five-minute inbound or outbound byte rate.
      FifteenMinuteRate:
        metric: rate.15m
        type: gauge
        unit: By/s
        desc: The fifteen-minute inbound or outbound byte rate.
      MeanRate:
        metric: rate.mean
        type: gauge
        unit: By/s
        desc: The mean inbound or outbound byte rate.

  # The existing target reports total request time for the primary
  # Produce/Fetch request types. These rules add the 99th percentile for every
  # request type exposed by Kafka without redefining that existing metric.

  - bean: kafka.network:type=RequestMetrics,name=TotalTimeMs,*
    metricAttribute:
      type: param(request)
    prefix: kafka.request.total.time.
    mapping:
      99thPercentile:
        metric: 99p
        type: gauge
        sourceUnit: ms
        unit: s
        desc: The 99th percentile total request time.

  - bean: kafka.network:type=RequestMetrics,name=RequestQueueTimeMs,*
    metricAttribute:
      type: param(request)
    prefix: kafka.request.queue.time.
    mapping:
      99thPercentile:
        metric: 99p
        type: gauge
        sourceUnit: ms
        unit: s
        desc: The 99th percentile time requests spend queued before processing.

  - bean: kafka.network:type=RequestMetrics,name=LocalTimeMs,*
    metricAttribute:
      type: param(request)
    prefix: kafka.request.local.time.
    mapping:
      99thPercentile:
        metric: 99p
        type: gauge
        sourceUnit: ms
        unit: s
        desc: The 99th percentile local processing time for requests.

  - bean: kafka.network:type=RequestMetrics,name=RemoteTimeMs,*
    metricAttribute:
      type: param(request)
    prefix: kafka.request.remote.time.
    mapping:
      99thPercentile:
        metric: 99p
        type: gauge
        sourceUnit: ms
        unit: s
        desc: The 99th percentile remote processing time for requests.

  - bean: kafka.network:type=RequestMetrics,name=ResponseQueueTimeMs,*
    metricAttribute:
      type: param(request)
    prefix: kafka.request.response.queue.time.
    mapping:
      99thPercentile:
        metric: 99p
        type: gauge
        sourceUnit: ms
        unit: s
        desc: The 99th percentile time responses spend queued before send.

  - bean: kafka.network:type=RequestMetrics,name=ResponseSendTimeMs,*
    metricAttribute:
      type: param(request)
    prefix: kafka.request.response.send.time.
    mapping:
      99thPercentile:
        metric: 99p
        type: gauge
        sourceUnit: ms
        unit: s
        desc: The 99th percentile response send time.

  - bean: kafka.network:type=SocketServer,name=NetworkProcessorAvgIdlePercent
    mapping:
      Value:
        metric: kafka.network.processor.idle.average
        type: gauge
        unit: "1"
        desc: The average fraction of time network processors are idle.

  # Kafka exposes these idle measurements as fractions from 0 to 1 through
  # Meter rate attributes, despite the Percent suffix in the MBean name.
  - bean: kafka.server:type=KafkaRequestHandlerPool,name=RequestHandlerAvgIdlePercent
    prefix: kafka.request.handler.idle.
    mapping:
      MeanRate:
        metric: mean
        type: gauge
        unit: "1"
        desc: The mean fraction of time request handlers are idle.
      OneMinuteRate:
        metric: 1m
        type: gauge
        unit: "1"
        desc: The one-minute fraction of time request handlers are idle.

  - bean: kafka.network:type=Processor,name=IdlePercent,*
    metricAttribute:
      kafka.network.processor.id: param(networkProcessor)
    mapping:
      Value:
        metric: kafka.network.processor.idle.utilization
        type: gauge
        unit: "1"
        desc: The idle fraction of an individual network processor.
