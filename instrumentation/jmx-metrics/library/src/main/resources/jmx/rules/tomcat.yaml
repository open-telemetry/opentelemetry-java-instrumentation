---
# For Tomcat, the default JMX domain is "Catalina:", however with some deployments like embedded in spring-boot
# we can have the "Tomcat:" domain used, thus we use both MBean names for the metrics.

rules:
  - beans:
    - Catalina:type=DataSource,*
    - Tomcat:type=DataSource,*
    prefix: tomcat.db.client.connection.
    metricAttribute:
      db.client.connection.pool.name: param(name)
    mapping:
      initialSize:
        metric: initial
        type: gauge
        unit: "{connection}"
        desc: The configured initial size of the JDBC connection pool.
      numActive:
        metric: &metric count
        type: &type updowncounter
        unit: &unit "{connection}"
        desc: &desc The number of JDBC connections currently in the state described by `db.client.connection.state`.
        metricAttribute:
          db.client.connection.state: const(used)
      numIdle:
        metric: *metric
        type: *type
        unit: *unit
        desc: *desc
        metricAttribute:
          db.client.connection.state: const(idle)
      active:
        metric: *metric
        type: *type
        unit: *unit
        desc: *desc
        metricAttribute:
          db.client.connection.state: const(used)
      idle:
        metric: *metric
        type: *type
        unit: *unit
        desc: *desc
        metricAttribute:
          db.client.connection.state: const(idle)
      maxActive:
        metric: &limit_metric limit
        type: &limit_type gauge
        unit: &limit_unit "{connection}"
        desc: &limit_desc The configured maximum size of the JDBC connection pool.
      maxTotal:
        metric: *limit_metric
        type: *limit_type
        unit: *limit_unit
        desc: *limit_desc

  - beans:
    - Catalina:type=GlobalRequestProcessor,name=*
    - Tomcat:type=GlobalRequestProcessor,name=*
    prefix: tomcat.
    metricAttribute:
      tomcat.request.processor.name: param(name)
    mapping:
      # tomcat.error.count
      errorCount:
        metric: error.count
        type: counter
        unit: "{error}"
        desc: The number of errors.
      # tomcat.request.count
      requestCount:
        metric: request.count
        type: counter
        unit: "{request}"
        desc: The number of requests processed.
      # tomcat.request.duration.max
      maxTime:
        metric: request.duration.max
        type: gauge
        sourceUnit: ms
        unit: s
        desc: The longest request processing time.
      # tomcat.request.duration.sum
      processingTime:
        metric: request.duration.sum
        type: counter
        sourceUnit: ms
        unit: s
        desc: Total time of processing all requests.
      # tomcat.network.io
      bytesReceived:
        metric: &metric network.io
        type: &type counter
        unit: &unit By
        desc: &desc The number of bytes transmitted.
        metricAttribute:
          network.io.direction: const(receive)
      # tomcat.network.io
      bytesSent:
        metric: *metric
        type: *type
        unit: *unit
        desc: *desc
        metricAttribute:
          network.io.direction: const(transmit)

  - beans:
    - Catalina:type=Manager,host=localhost,context=*
    - Tomcat:type=Manager,host=localhost,context=*
    prefix: tomcat.
    metricAttribute:
      tomcat.context: param(context)
    mapping:
      # tomcat.session.active.count
      activeSessions:
        metric: session.active.count
        type: updowncounter
        unit: "{session}"
        desc: The number of currently active sessions.
      # tomcat.session.active.limit
      maxActiveSessions:
        metric: session.active.limit
        dropNegativeValues: true
        type: updowncounter
        unit: "{session}"
        desc: Maximum possible number of active sessions.

      # Additional session metrics
      sessionMaxAliveTime:
        metric: session.duration.max
        type: gauge
        unit: s
        desc: The maximum observed session lifetime.
      sessionCounter:
        metric: session.created
        type: counter
        unit: "{session}"
        desc: The number of sessions created.
      sessionAverageAliveTime:
        metric: session.duration.mean
        type: gauge
        unit: s
        desc: The average observed session lifetime.
      processingTime:
        metric: session.processing.duration.sum
        type: counter
        sourceUnit: ms
        unit: s
        desc: The total time spent processing sessions.
      maxActive:
        metric: session.active.max
        type: gauge
        unit: "{session}"
        desc: The maximum number of concurrent active sessions observed.
      expiredSessions:
        metric: session.expired
        type: counter
        unit: "{session}"
        desc: The number of expired sessions.
      rejectedSessions:
        metric: session.rejected
        type: counter
        unit: "{session}"
        desc: The number of rejected sessions.

  - beans:
    - Catalina:type=ThreadPool,name=*
    - Tomcat:type=ThreadPool,name=*
    unit: "{thread}"
    prefix: tomcat.thread.
    type: updowncounter
    metricAttribute:
      tomcat.thread.pool.name: param(name)
    mapping:
      # tomcat.thread.count
      currentThreadCount:
        metric: count
        desc: Total thread count of the thread pool.
      # tomcat.thread.limit
      maxThreads:
        dropNegativeValues: true
        metric: limit
        desc: Maximum possible number of threads in the thread pool.
      # tomcat.thread.busy.count
      currentThreadsBusy:
        metric: busy.count
        desc: Number of busy threads in the thread pool.
