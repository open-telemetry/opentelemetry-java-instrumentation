groups:
  - id: attributes.kafka.broker
    type: attribute_group
    brief: Kafka broker attributes.
    attributes:
      - id: kafka.request.type
        type: string
        stability: development
        brief: Kafka request type in lowercase.
        examples:
          - "fetch"
          - "produce"
          - "fetchconsumer"
          - "fetchfollower"
          - "metadata"
      - id: kafka.topic.name
        type: string
        stability: development
        brief: Kafka topic name.
        examples:
          - "my-topic"
      - id: kafka.server.isr.operation
        type:
          members:
            - id: shrink
              value: "shrink"
              brief: In-sync replica set shrink.
              stability: development
            - id: expand
              value: "expand"
              brief: In-sync replica set expand.
              stability: development
        stability: development
        brief: Kafka in-sync replica set operation.
        examples:
          - "shrink"
          - "expand"

      - id: kafka.network.processor.id
        type: string
        stability: development
        brief: Identifier of the Kafka network processor.
        examples:
          - "0"

  - id: metric.kafka.server.messages
    metric_name: kafka.server.messages
    type: metric
    stability: development
    brief: The number of messages received by the broker.
    unit: "{message}"
    instrument: counter
    attributes:
      - ref: kafka.topic.name

  - id: metric.kafka.server.requests
    metric_name: kafka.server.requests
    type: metric
    stability: development
    brief: The number of requests received by the broker.
    unit: "{request}"
    instrument: counter
    attributes:
      - ref: kafka.request.type
      - ref: kafka.topic.name

  - id: metric.kafka.server.failed_requests
    metric_name: kafka.server.failed_requests
    type: metric
    stability: development
    brief: The number of requests to the broker resulting in a failure.
    unit: "{request}"
    instrument: counter
    attributes:
      - ref: kafka.request.type
      - ref: kafka.topic.name

  - id: metric.kafka.server.network.io
    metric_name: kafka.server.network.io
    type: metric
    stability: development
    brief: The bytes received or sent by the broker.
    unit: "By"
    instrument: counter
    attributes:
      - ref: kafka.topic.name
      - ref: network.io.direction

  - id: metric.kafka.server.purgatory.size
    metric_name: kafka.server.purgatory.size
    type: metric
    stability: development
    brief: The number of requests waiting in purgatory.
    unit: "{request}"
    instrument: updowncounter
    attributes:
      - ref: kafka.request.type

  - id: metric.kafka.network.requests
    metric_name: kafka.network.requests
    type: metric
    stability: development
    brief: The number of network requests received by the broker.
    unit: "{request}"
    instrument: counter
    attributes:
      - ref: kafka.request.type

  - id: metric.kafka.network.request.duration.p50
    metric_name: kafka.network.request.duration.p50
    type: metric
    stability: development
    brief: The 50th percentile duration the broker has taken to service network requests.
    unit: "s"
    instrument: gauge
    attributes:
      - ref: kafka.request.type

  - id: metric.kafka.network.request.duration.p99
    metric_name: kafka.network.request.duration.p99
    type: metric
    stability: development
    brief: The 99th percentile duration the broker has taken to service network requests.
    unit: "s"
    instrument: gauge
    attributes:
      - ref: kafka.request.type

  - id: metric.kafka.network.request.queue
    metric_name: kafka.network.request.queue
    type: metric
    stability: development
    brief: Size of the network request queue.
    unit: "{request}"
    instrument: updowncounter

  - id: metric.kafka.server.partition.count
    metric_name: kafka.server.partition.count
    type: metric
    stability: development
    brief: The number of partitions on the broker.
    unit: "{partition}"
    instrument: updowncounter

  - id: metric.kafka.controller.partition.offline
    metric_name: kafka.controller.partition.offline
    type: metric
    stability: development
    brief: The number of partitions offline.
    unit: "{partition}"
    instrument: updowncounter

  - id: metric.kafka.server.partition.under_replicated
    metric_name: kafka.server.partition.under_replicated
    type: metric
    stability: development
    brief: The number of under-replicated partitions.
    unit: "{partition}"
    instrument: updowncounter

  - id: metric.kafka.server.isr.operations
    metric_name: kafka.server.isr.operations
    type: metric
    stability: development
    brief: The number of in-sync replica operations.
    unit: "{operation}"
    instrument: counter
    attributes:
      - ref: kafka.server.isr.operation

  - id: metric.kafka.server.lag.max
    metric_name: kafka.server.lag.max
    type: metric
    stability: development
    brief: The max lag in messages between follower and leader replicas.
    unit: "{message}"
    instrument: gauge

  - id: metric.kafka.controller.active.count
    metric_name: kafka.controller.active.count
    type: metric
    stability: development
    brief: The number of controllers active on the broker.
    unit: "{controller}"
    instrument: updowncounter

  - id: metric.kafka.controller.leader_elections
    metric_name: kafka.controller.leader_elections
    type: metric
    stability: development
    brief: The leader election count.
    unit: "{election}"
    instrument: counter

  - id: metric.kafka.controller.unclean_leader_elections
    metric_name: kafka.controller.unclean_leader_elections
    type: metric
    stability: development
    brief: Unclean leader election count.
    unit: "{election}"
    instrument: counter

  - id: metric.kafka.log.flushes
    metric_name: kafka.log.flushes
    type: metric
    stability: development
    brief: Log flush count.
    unit: "{flush}"
    instrument: counter

  - id: metric.kafka.log.flush.duration.p50
    metric_name: kafka.log.flush.duration.p50
    type: metric
    stability: development
    brief: Log flush duration 50th percentile.
    unit: "s"
    instrument: gauge
    attributes: []

  - id: metric.kafka.log.flush.duration.p99
    metric_name: kafka.log.flush.duration.p99
    type: metric
    stability: development
    brief: Log flush duration 99th percentile.
    unit: "s"
    instrument: gauge
    attributes: []

  - id: metric.kafka.leader.count
    metric_name: kafka.leader.count
    type: metric
    stability: development
    brief: The number of leaders assigned to the broker.
    unit: "{leader}"
    instrument: gauge

  - id: metric.kafka.isr.operation.rate.1m
    metric_name: kafka.isr.operation.rate.1m
    type: metric
    stability: development
    brief: The one-minute rate of ISR expand and shrink operations.
    unit: "{operation}/s"
    instrument: gauge
    attributes:
      - ref: kafka.server.isr.operation

  - id: metric.kafka.isr.operation.rate.5m
    metric_name: kafka.isr.operation.rate.5m
    type: metric
    stability: development
    brief: The five-minute rate of ISR expand and shrink operations.
    unit: "{operation}/s"
    instrument: gauge
    attributes:
      - ref: kafka.server.isr.operation

  - id: metric.kafka.isr.operation.rate.15m
    metric_name: kafka.isr.operation.rate.15m
    type: metric
    stability: development
    brief: The fifteen-minute rate of ISR expand and shrink operations.
    unit: "{operation}/s"
    instrument: gauge
    attributes:
      - ref: kafka.server.isr.operation

  - id: metric.kafka.isr.operation.rate.mean
    metric_name: kafka.isr.operation.rate.mean
    type: metric
    stability: development
    brief: The mean rate of ISR expand and shrink operations.
    unit: "{operation}/s"
    instrument: gauge
    attributes:
      - ref: kafka.server.isr.operation

  - id: metric.kafka.network.io.rate.1m
    metric_name: kafka.network.io.rate.1m
    type: metric
    stability: development
    brief: The one-minute inbound or outbound byte rate.
    unit: "By/s"
    instrument: gauge
    attributes:
      - ref: network.io.direction

  - id: metric.kafka.network.io.rate.5m
    metric_name: kafka.network.io.rate.5m
    type: metric
    stability: development
    brief: The five-minute inbound or outbound byte rate.
    unit: "By/s"
    instrument: gauge
    attributes:
      - ref: network.io.direction

  - id: metric.kafka.network.io.rate.15m
    metric_name: kafka.network.io.rate.15m
    type: metric
    stability: development
    brief: The fifteen-minute inbound or outbound byte rate.
    unit: "By/s"
    instrument: gauge
    attributes:
      - ref: network.io.direction

  - id: metric.kafka.network.io.rate.mean
    metric_name: kafka.network.io.rate.mean
    type: metric
    stability: development
    brief: The mean inbound or outbound byte rate.
    unit: "By/s"
    instrument: gauge
    attributes:
      - ref: network.io.direction

  - id: metric.kafka.request.total.time.p99
    metric_name: kafka.request.total.time.p99
    type: metric
    stability: development
    brief: The 99th percentile total request time.
    unit: "s"
    instrument: gauge
    attributes:
      - ref: kafka.request.type

  - id: metric.kafka.request.queue.time.p99
    metric_name: kafka.request.queue.time.p99
    type: metric
    stability: development
    brief: The 99th percentile time requests spend queued before processing.
    unit: "s"
    instrument: gauge
    attributes:
      - ref: kafka.request.type

  - id: metric.kafka.request.local.time.p99
    metric_name: kafka.request.local.time.p99
    type: metric
    stability: development
    brief: The 99th percentile local processing time for requests.
    unit: "s"
    instrument: gauge
    attributes:
      - ref: kafka.request.type

  - id: metric.kafka.request.remote.time.p99
    metric_name: kafka.request.remote.time.p99
    type: metric
    stability: development
    brief: The 99th percentile remote processing time for requests.
    unit: "s"
    instrument: gauge
    attributes:
      - ref: kafka.request.type

  - id: metric.kafka.request.response.queue.time.p99
    metric_name: kafka.request.response.queue.time.p99
    type: metric
    stability: development
    brief: The 99th percentile time responses spend queued before send.
    unit: "s"
    instrument: gauge
    attributes:
      - ref: kafka.request.type

  - id: metric.kafka.request.response.send.time.p99
    metric_name: kafka.request.response.send.time.p99
    type: metric
    stability: development
    brief: The 99th percentile response send time.
    unit: "s"
    instrument: gauge
    attributes:
      - ref: kafka.request.type

  - id: metric.kafka.network.processor.idle.average
    metric_name: kafka.network.processor.idle.average
    type: metric
    stability: development
    brief: The average fraction of time network processors are idle.
    unit: "1"
    instrument: gauge

  - id: metric.kafka.request.handler.idle.mean
    metric_name: kafka.request.handler.idle.mean
    type: metric
    stability: development
    brief: The mean fraction of time request handlers are idle.
    unit: "1"
    instrument: gauge

  - id: metric.kafka.request.handler.idle.1m
    metric_name: kafka.request.handler.idle.1m
    type: metric
    stability: development
    brief: The one-minute fraction of time request handlers are idle.
    unit: "1"
    instrument: gauge

  - id: metric.kafka.network.processor.idle.utilization
    metric_name: kafka.network.processor.idle.utilization
    type: metric
    stability: development
    brief: The idle fraction of an individual network processor.
    unit: "1"
    instrument: gauge
    attributes:
      - ref: kafka.network.processor.id
