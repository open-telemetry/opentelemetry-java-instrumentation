groups:
  - id: attributes.tomcat
    type: attribute_group
    brief: Tomcat attributes
    attributes:
      - id: tomcat.context
        type: string
        stability: development
        brief: Web application context path
        examples:
          - "/myapp"
      - id: tomcat.request.processor.name
        type: string
        stability: development
        brief: Name of the Tomcat request processor.
        examples:
          - "http-nio-8080"
      - id: tomcat.thread.pool.name
        type: string
        stability: development
        brief: Name of the Tomcat thread pool.
        examples:
          - "http-nio-8080"
  - id: metric.tomcat.session.active.count
    metric_name: tomcat.session.active.count
    stability: development
    type: metric
    brief: The number of currently active sessions.
    unit: "{session}"
    instrument: updowncounter
    attributes:
      - ref: tomcat.context

  - id: metric.tomcat.session.active.limit
    metric_name: tomcat.session.active.limit
    stability: development
    type: metric
    brief: Maximum possible number of active sessions.
    unit: "{session}"
    instrument: updowncounter
    attributes:
      - ref: tomcat.context

  - id: metric.tomcat.db.client.connection.initial
    metric_name: tomcat.db.client.connection.initial
    stability: development
    type: metric
    brief: The configured initial size of the JDBC connection pool.
    unit: "{connection}"
    instrument: gauge
    attributes:
      - ref: db.client.connection.pool.name

  - id: metric.tomcat.db.client.connection.count
    metric_name: tomcat.db.client.connection.count
    stability: development
    type: metric
    brief: The number of active JDBC connections.
    unit: "{connection}"
    instrument: updowncounter
    attributes:
      - ref: db.client.connection.pool.name
      - ref: db.client.connection.state

  - id: metric.tomcat.db.client.connection.limit
    metric_name: tomcat.db.client.connection.limit
    stability: development
    type: metric
    brief: The configured maximum size of the JDBC connection pool.
    unit: "{connection}"
    instrument: gauge
    attributes:
      - ref: db.client.connection.pool.name

  - id: metric.tomcat.session.duration.max
    metric_name: tomcat.session.duration.max
    stability: development
    type: metric
    brief: The maximum observed session lifetime.
    unit: s
    instrument: gauge
    attributes:
      - ref: tomcat.context

  - id: metric.tomcat.session.created
    metric_name: tomcat.session.created
    stability: development
    type: metric
    brief: The number of sessions created.
    unit: "{session}"
    instrument: counter
    attributes:
      - ref: tomcat.context

  - id: metric.tomcat.session.duration.mean
    metric_name: tomcat.session.duration.mean
    stability: development
    type: metric
    brief: The average observed session lifetime.
    unit: s
    instrument: gauge
    attributes:
      - ref: tomcat.context

  - id: metric.tomcat.session.processing.duration.sum
    metric_name: tomcat.session.processing.duration.sum
    stability: development
    type: metric
    brief: The total time spent processing sessions.
    unit: s
    instrument: counter
    attributes:
      - ref: tomcat.context

  - id: metric.tomcat.session.active.max
    metric_name: tomcat.session.active.max
    stability: development
    type: metric
    brief: The maximum number of concurrent active sessions observed.
    unit: "{session}"
    instrument: gauge
    attributes:
      - ref: tomcat.context

  - id: metric.tomcat.session.expired
    metric_name: tomcat.session.expired
    stability: development
    type: metric
    brief: The number of expired sessions.
    unit: "{session}"
    instrument: counter
    attributes:
      - ref: tomcat.context

  - id: metric.tomcat.session.rejected
    metric_name: tomcat.session.rejected
    stability: development
    type: metric
    brief: The number of rejected sessions.
    unit: "{session}"
    instrument: counter
    attributes:
      - ref: tomcat.context

  - id: metric.tomcat.error.count
    metric_name: tomcat.error.count
    stability: development
    type: metric
    brief: The number of errors.
    unit: "{error}"
    instrument: counter
    attributes:
      - ref: tomcat.request.processor.name

  - id: metric.tomcat.request.count
    metric_name: tomcat.request.count
    stability: development
    type: metric
    brief: The number of requests processed.
    unit: "{request}"
    instrument: counter
    attributes:
      - ref: tomcat.request.processor.name

  - id: metric.tomcat.request.duration.max
    metric_name: tomcat.request.duration.max
    stability: development
    type: metric
    brief: The longest request processing time.
    unit: "s"
    instrument: gauge
    attributes:
      - ref: tomcat.request.processor.name

  - id: metric.tomcat.request.duration.sum
    metric_name: tomcat.request.duration.sum
    stability: development
    type: metric
    brief: Total time of processing all requests.
    unit: "s"
    instrument: counter
    attributes:
      - ref: tomcat.request.processor.name

  - id: metric.tomcat.thread.count
    metric_name: tomcat.thread.count
    stability: development
    type: metric
    brief: Total thread count of the thread pool.
    unit: "{thread}"
    instrument: updowncounter
    attributes:
      - ref: tomcat.thread.pool.name

  - id: metric.tomcat.network.io
    metric_name: tomcat.network.io
    stability: development
    type: metric
    brief: The number of bytes transmitted.
    unit: "By"
    instrument: counter
    attributes:
      - ref: tomcat.request.processor.name
      - ref: network.io.direction

  - id: metric.tomcat.thread.limit
    metric_name: tomcat.thread.limit
    stability: development
    type: metric
    brief: Maximum possible number of threads in the thread pool.
    unit: "{thread}"
    instrument: updowncounter
    attributes:
      - ref: tomcat.thread.pool.name

  - id: metric.tomcat.thread.busy.count
    metric_name: tomcat.thread.busy.count
    stability: development
    type: metric
    brief: Number of busy threads in the thread pool.
    unit: "{thread}"
    instrument: updowncounter
    attributes:
      - ref: tomcat.thread.pool.name
