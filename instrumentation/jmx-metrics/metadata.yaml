display_name: JMX Metrics
classification: custom
description: >
  Collects and reports metrics exposed through Java Management Extensions (JMX). It can be
  configured to extract JVM and application-level telemetry data from JMX MBeans such as memory
  usage, thread counts, and garbage collection statistics, and translate these measurements into
  OpenTelemetry metrics. Collected metrics can be filtered by name using include and exclude
  patterns.
configurations:
  - name: otel.jmx.enabled
    declarative_name: java.jmx.enabled
    description: Enables collection of JMX metrics.
    type: boolean
    default: true
  - name: otel.jmx.config
    declarative_name: java.jmx.config
    description: List of paths to JMX metric definition YAML files.
    type: list
    default: ""
  - name: otel.jmx.discovery.delay
    declarative_name: java.jmx.discovery.delay
    description: Time in milliseconds between JMX MBean detection attempts.
    type: int
    default: 60000
  - name: otel.jmx.target.system
    declarative_name: java.jmx.target.system
    deprecated: true
    description: >
      Deprecated list of predefined JMX target systems to collect metrics for, including their
      unstable metrics. Used when `otel.jmx.metrics.experimental.included` is empty. A nonempty
      experimental inclusion takes precedence. Remove this setting to use automatic stable metric
      collection and select unstable metrics by name. This setting will be removed in 3.0.
    type: list
    default: ""
  - name: otel.jmx.metrics.included
    declarative_name: java.jmx.metrics.included
    description: >
      Comma-separated list of case-sensitive glob patterns for metric names to collect. "*" matches
      any number of characters and "?" matches one character. Excluded patterns take precedence
      over included patterns. When no included patterns are configured, all metrics that are not
      excluded are collected. With neither selector property configured, all metrics are collected.
    type: list
    default: ""
    examples:
      - "jvm.memory.*,jvm.thread.count"
  - name: otel.jmx.metrics.experimental.included
    declarative_name: java.jmx.metrics.experimental.included
    description: >
      Comma-separated list of case-sensitive glob patterns for unstable (experimental) bundled
      metric names to opt in to. "*" matches any number of characters and "?" matches one character.
      Normal metric include and exclude filters also apply. Custom metric definitions do not
      require experimental opt-in.
    type: list
    default: ""
    examples:
      - "jetty.*,kafka.*"
  - name: otel.jmx.metrics.excluded
    declarative_name: java.jmx.metrics.excluded
    description: >
      Comma-separated list of case-sensitive glob patterns for metric names not to collect. "*"
      matches any number of characters and "?" matches one character. Excluded patterns take
      precedence over included patterns. When no included patterns are configured, all metrics that
      are not excluded are collected. With neither selector property configured, all metrics are
      collected.
    type: list
    default: ""
    examples:
      - "jvm.memory.limit,kafka.connect.*"
