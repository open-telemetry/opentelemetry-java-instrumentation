display_name: Redisson
description: This instrumentation enables database client spans and database client metrics for Redisson Redis client operations.
semantic_conventions:
  - DATABASE_CLIENT_SPANS
  - DATABASE_CLIENT_METRICS
library_link: https://github.com/redisson/redisson
configurations:
  - name: otel.instrumentation.redisson.query-sanitization.enabled
    declarative_name: java.redisson.query_sanitization.enabled
    description: >
      Enables query sanitization for Redisson queries. Overrides
      `otel.instrumentation.common.db.query-sanitization.enabled` for this instrumentation; when
      unset, that setting applies.
    type: boolean
  - ref: common.db.query-sanitization.enabled
  - ref: common.db-statement-sanitizer.enabled
  - ref: common.database.statement_sanitizer.enabled
  - name: otel.instrumentation.redisson.statement-sanitizer.enabled
    declarative_name: java.redisson.statement_sanitizer.enabled
    description: "Deprecated: use `otel.instrumentation.redisson.query-sanitization.enabled` instead. It is ignored under v3 preview and will be removed in 3.0."
    type: boolean
    default: true
    deprecated: true
    replaced_by: otel.instrumentation.redisson.query-sanitization.enabled
