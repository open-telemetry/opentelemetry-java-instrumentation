display_name: Methods
classification: custom
description: >
  Provides a flexible way to capture telemetry at the method level in JVM applications. By weaving
  instrumentation into targeted methods at runtime based on the
  "otel.instrumentation.methods.include" configuration property, it measures entry and exit points,
  execution duration and exception occurrences. The resulting data is automatically translated into
  OpenTelemetry traces.
configurations:
  - name: otel.instrumentation.methods.include
    declarative_name: java.methods.include
    description: Selects the classes and methods to instrument.
    type: list
    default: ""
    declarative_type: structured_list
    declarative_schema:
      type: object
      required: [class, methods]
      properties:
        class:
          type: string
          description: Fully qualified class name to instrument.
          example: com.example.MyClass
        methods:
          type: array
          description: Method objects with a required name and an optional span_kind (default INTERNAL).
          example:
            - name: method1
              span_kind: INTERNAL
    examples:
      - "com.example.MyClass[method1]"
      - "com.example.MyClass[method1,method2];com.example.OtherClass[call]"
