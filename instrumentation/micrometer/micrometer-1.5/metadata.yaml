display_name: Micrometer
disabled_by_default: true
description: >
  This instrumentation enables a Micrometer MeterRegistry that bridges Micrometer metrics to the
  OpenTelemetry Metrics SDK. It is disabled by default because it may produce metrics that overlap
  with metrics already captured by other instrumentations.
library_link: https://micrometer.io/
configurations:
  - name: otel.instrumentation.micrometer.experimental.jvm-metrics-ownership.enabled
    declarative_name: java.micrometer.jvm_metrics_ownership/development.enabled
    description: >
      Stops bridging supported Micrometer JVM metrics only when the corresponding agent JMX
      observer or GC notification listener registered before bridge initialization. Disabled,
      unsupported, JFR-only, or late replacements retain the Micrometer copy. Registration does
      not guarantee export through SDK views, and decisions do not change when runtime telemetry
      later starts or stops. Custom meters with the same eligible names and types can also be
      suppressed; use `otel.instrumentation.micrometer.experimental.jvm-metrics-ownership.kept`
      to keep specific meters.
    type: boolean
    default: false
  - name: otel.instrumentation.micrometer.experimental.jvm-metrics-ownership.kept
    declarative_name: java.micrometer.jvm_metrics_ownership/development.kept
    description: >
      Exact registered Micrometer meter names to keep bridged despite JVM ownership, including
      their companions. Names are matched after meter filters and before export naming
      conventions. Use the active convention name; wildcards are not supported.
    type: list
    default: ""
    examples:
      - jvm.classes.loaded
      - jvm.class.count,jvm.class.loaded
  - name: otel.instrumentation.micrometer.prometheus-mode.enabled
    declarative_name: java.micrometer.prometheus_mode.enabled
    description: >
      Simulates the behavior of Micrometer's PrometheusMeterRegistry. The instruments will be
      renamed to match Micrometer instrument naming, and the base time unit will be set to seconds.
    type: boolean
    default: false
  - name: otel.instrumentation.micrometer.base-time-unit
    declarative_name: java.micrometer.base_time_unit
    description: >
      Sets the base time unit for the OpenTelemetry MeterRegistry. Supported values: ns, us, ms, s,
      min, h, d.
    type: string
    default: s
    examples:
      - ns
      - milliseconds
  - name: otel.instrumentation.micrometer.experimental.histogram-gauges.enabled
    declarative_name: java.micrometer.histogram_gauges/development.enabled
    description: >
      Enables gauge-based Micrometer histograms for DistributionSummary and Timer instruments.
    type: boolean
    default: false
  - name: otel.instrumentation.micrometer.histogram-gauges.enabled
    declarative_name: java.micrometer.histogram_gauges.enabled
    description: >
      Deprecated alias for
      `otel.instrumentation.micrometer.experimental.histogram-gauges.enabled`. It will be removed in
      3.0.
    type: boolean
    default: false
    deprecated: true
    replaced_by: otel.instrumentation.micrometer.experimental.histogram-gauges.enabled
