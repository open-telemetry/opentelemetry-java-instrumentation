display_name: Micrometer
disabled_by_default: true
description: >
  This instrumentation enables a Micrometer MeterRegistry that bridges Micrometer metrics to the
  OpenTelemetry Metrics SDK. It is disabled by default because it may produce metrics that overlap
  with metrics already captured by other instrumentations.
library_link: https://micrometer.io/
configurations:
  - name: otel.instrumentation.micrometer.experimental.jvm-metrics-ownership.enabled
    declarative_name: java.micrometer.jvm_metrics_ownership/development.enabled
    description: >
      Stops bridging standard Micrometer JVM metrics that duplicate agent runtime telemetry. Buffer,
      system CPU and load, and file descriptor metrics are only suppressed when
      `otel.instrumentation.runtime-telemetry.emit-experimental-metrics` is also enabled. Custom
      meters with the same names and types are also suppressed.
    type: boolean
    default: false
  - name: otel.instrumentation.micrometer.prometheus-mode.enabled
    declarative_name: java.micrometer.prometheus_mode.enabled
    description: >
      Simulates the behavior of Micrometer's PrometheusMeterRegistry. The instruments will be
      renamed to match Micrometer instrument naming, and the base time unit will be set to seconds.
    type: boolean
    default: false
  - name: otel.instrumentation.micrometer.base-time-unit
    declarative_name: java.micrometer.base_time_unit
    description: >
      Sets the base time unit for the OpenTelemetry MeterRegistry. Supported values: ns, us, ms, s,
      min, h, d.
    type: string
    default: s
    examples:
      - ns
      - milliseconds
  - name: otel.instrumentation.micrometer.experimental.histogram-gauges.enabled
    declarative_name: java.micrometer.histogram_gauges/development.enabled
    description: >
      Enables gauge-based Micrometer histograms for DistributionSummary and Timer instruments.
    type: boolean
    default: false
