description: This instrumentation enables messaging spans for RabbitMQ message producers and consumers.
display_name: RabbitMQ
library_link: https://www.rabbitmq.com/client-libraries/java-api-guide
semantic_conventions:
  - MESSAGING_SPANS
configurations:
  - name: otel.instrumentation.rabbitmq.experimental-span-attributes
    declarative_name: java.rabbitmq.experimental_span_attributes/development
    description: >
      Enables experimental span attributes `rabbitmq.command`, `rabbitmq.delivery_mode`,
      `rabbitmq.queue`, and `rabbitmq.record.queue_time_ms`.
    type: boolean
    default: false
  - name: otel.instrumentation.messaging.experimental.receive-telemetry.enabled
    declarative_name: java.common.messaging.receive_telemetry/development.enabled
    description: >
      Enables consumer spans for RabbitMQ `basicGet` receive operations when legacy messaging
      semantic conventions are emitted. Stable messaging semantic conventions emit these spans
      regardless of this setting.
    type: boolean
    default: false
  - ref: messaging.headers.included
  - ref: messaging.headers.excluded
  - ref: messaging.capture-headers
